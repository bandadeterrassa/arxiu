<!doctype html>
<html lang="ca"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F9">
<title>Arxiu · Banda de Terrassa</title>
<style>
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --surface2:#EEF2F6; --line:#E1E7EF; --line2:#E1E7EF;
  --ink:#10151F; --ink2:#3A4453; --muted:#67728A; --accent:#1A2532; --accent-ink:#FFFFFF;
  --gold:#B9862F; --gold-bg:#FCF1DE; --gold-ink:#8A5F14;
  --info:#2E5FA3; --info-bg:#E7EFF9;
  --ok:#1E8F5F; --ok-bg:#E4F6ED; --bad:#C43D34; --bad-bg:#FBEAE8; --gray-bg:#EEF2F6;
  --radius:16px; --radius-s:10px; --radius-l:24px; --radius-pill:999px;
  --shadow:0 1px 2px rgba(16,21,31,.04), 0 10px 24px -8px rgba(16,21,31,.10);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:active{transform:scale(.97)}
a{color:inherit}
.hidden{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}

.top{position:sticky;top:0;z-index:20;background:rgba(244,246,249,.96);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line2);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.logo span{font-weight:800;font-size:16px;letter-spacing:-.06em;color:#fff;line-height:1}
.top h1{font-size:16px;margin:0;letter-spacing:-.01em;line-height:1.15}
.top h1 small{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}
.top .sp{flex:1}
.roleswitch{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:5px}
.roleswitch svg{width:13px;height:13px}
.savepill{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s}
.savepill.show{opacity:1}

main{max-width:680px;margin:0 auto;padding:16px 16px 96px}

/* ---- Consultar ---- */
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted);pointer-events:none}
.search input{width:100%;padding:14px 16px 14px 44px;border:1px solid transparent;border-radius:var(--radius-pill);background:var(--surface2);outline:none;font-size:16.5px;transition:background .2s,box-shadow .2s}
.search input:focus{background:var(--surface);box-shadow:0 0 0 4px rgba(26,37,50,.10),0 2px 10px rgba(16,21,31,.06)}
.search input::placeholder{color:var(--muted)}

.countline{font-size:13px;color:var(--muted);margin:2px 2px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.countline button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;color:var(--ink2);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.countline .fbadge{background:var(--ink);color:#fff;border-radius:999px;font-size:10.5px;padding:1px 6px;font-weight:800}

.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:14px 15px;text-align:left;width:100%;display:flex;align-items:flex-start;gap:10px}
.card{transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s ease,background .16s ease}
.card:active{background:var(--surface2);transform:scale(.985)}
@media (hover:hover){ .card:hover{box-shadow:0 2px 4px rgba(16,21,31,.05),0 14px 28px -8px rgba(16,21,31,.14);transform:translateY(-1px)} }
.card .main{flex:1;min-width:0}
.card .titlerow{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:3px}
.card .title{font-weight:700;font-size:16px;letter-spacing:-.01em;margin:0}
.estilchip{font-size:11px;font-weight:700;color:var(--info);background:var(--info-bg);border:1px solid transparent;border-radius:6px;padding:1.5px 6px;white-space:nowrap}
.card .authors{font-size:13.5px;color:var(--ink2);margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusline{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin:0 0 2px}
.statusline .dot{width:7px;height:7px;border-radius:50%;flex:none}
.statusline.ok .dot{background:var(--ok)} .statusline.ok{color:var(--ok)}
.statusline.warn .dot{background:var(--gold)} .statusline.warn{color:var(--gold-ink)}
.statusline.bad .dot{background:var(--bad)} .statusline.bad{color:var(--bad)}
.statusline.gray .dot{background:var(--muted)} .statusline.gray{color:var(--muted)}
.locline{font-size:12.5px;color:var(--muted);margin:0}
.card .chevron{color:var(--muted);flex:none;margin-top:3px}

.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty svg{width:40px;height:40px;margin-bottom:12px;opacity:.5}
.empty p{margin:0;font-size:14.5px}

/* segmented control */
.segctl{display:flex;background:var(--surface2);border-radius:var(--radius-s);padding:3px;margin-bottom:14px;gap:2px}
.segctl button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:8px;font-weight:700;font-size:13.5px;color:var(--ink2);transition:background .18s ease,color .18s ease,box-shadow .18s ease}
.segctl button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,21,31,.12)}

/* resum dashboard */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.statcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.statcard.warn{background:radial-gradient(120% 120% at 15% 15%, var(--gold-bg) 0%, var(--surface) 65%)}
.statcard .num{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.statcard .lbl{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:600}
.statcard.wide{grid-column:1/-1}
.barrow{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:7px 0}
.barrow .lbl2{width:130px;flex:none;color:var(--ink2);font-weight:600}
.barrow .bar{flex:1;height:8px;border-radius:5px;background:var(--surface2);overflow:hidden}
.barrow .bar span{display:block;height:100%;border-radius:5px}
.barrow .n{width:38px;text-align:right;font-weight:700;flex:none}

/* projectes list */
.projcard{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:13px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:9px}
.projcard .pn{font-weight:700;font-size:15px}
.projcard .pm{font-size:12.5px;color:var(--muted);margin-top:2px}
.projcard .pc{font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--surface2);border-radius:999px;padding:4px 10px;flex:none}

/* boxed detail sections (projecte/obra) */
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.box h4{margin:0 0 10px;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.box h4 .sp{flex:1}
.box h4 .cnt{font-weight:700;color:var(--ink2);text-transform:none;letter-spacing:0}
.kvgrid{display:grid;grid-template-columns:112px 1fr;gap:9px 12px;font-size:14.5px}
.kvgrid dt{color:var(--muted);font-weight:600;font-size:13.5px}
.kvgrid dd{margin:0;overflow-wrap:anywhere}
.pathbox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;overflow-wrap:anywhere;margin-top:8px}
.statusbig{display:flex;gap:8px;flex-wrap:wrap}
.tagpill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:7px;padding:4px 9px;background:var(--gray-bg);color:var(--ink2);white-space:nowrap}
.tagpill.ok{background:var(--ok-bg);color:var(--ok)}
.tagpill.bad{background:var(--bad-bg);color:var(--bad)}
.tagpill.warn{background:var(--gold-bg);color:var(--gold-ink)}
.tagpill .tdot{width:6px;height:6px;border-radius:50%;background:currentColor}
.famgrid{display:flex;flex-direction:column;gap:9px}
.famgrid .famrow{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:start}
.famgrid .famrow>span{font-size:12px;font-weight:700;color:var(--muted);padding-top:4px}
.famgrid .famrow .chipsw{display:flex;flex-wrap:wrap;gap:6px}
.icchip{font-size:12px;font-weight:700;border-radius:7px;padding:4px 8px;background:var(--accent);color:#fff}
.icchip.off{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.icchip.sp{background:var(--info-bg);color:var(--info)}
.copyrow{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.copyrow+.copyrow{margin-top:8px}
.k4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.k4row{display:flex;gap:8px;margin-bottom:16px}
.k4row .k4item{flex:1;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 4px}
.k4row .k4item .num{font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.k4row .k4item .lbl{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:3px}
.projrow2{display:flex;gap:12px;align-items:center;padding:14px 15px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s ease}
.projrow2:active{transform:scale(.985);background:var(--surface2)}
.projrow2:last-child{border-bottom:0}
.projrow2:active{background:var(--surface2)}
.yrbox{width:44px;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:none;color:var(--ink2)}

/* chips generic */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-pill);padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;transition:background .16s ease,color .16s ease,border-color .16s ease,transform .1s;min-height:44px;box-sizing:border-box}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(16,21,31,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:sheetFade .22s ease}
.sheet{background:var(--surface);width:100%;max-width:680px;border-radius:var(--radius-l) var(--radius-l) 0 0;max-height:90vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(16,21,31,.18);padding-bottom:env(safe-area-inset-bottom,0px);animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetFade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:flex-start;gap:10px;padding:16px 16px 10px;border-bottom:1px solid var(--line2);z-index:2}
.sheet-head .htxt{flex:1;min-width:0}
.sheet-head h2{font-size:19px;margin:0 0 1px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.sheet-head .authorlines{font-size:13.5px;color:var(--ink2);margin-top:6px;display:flex;flex-direction:column;gap:1px}
.sheet-close{border:0;background:var(--surface2);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.sheet-body{padding:6px 16px 24px}

h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px;font-weight:700}
h3.sec:first-child{margin-top:16px}
.kv{display:flex;flex-direction:column;gap:0}
.kv .item{display:flex;justify-content:space-between;gap:14px;font-size:14.5px;padding:9px 0;border-bottom:1px solid var(--line2)}
.kv .item:last-child{border-bottom:0}
.kv .k{color:var(--muted);flex:none}
.kv .v{text-align:right;font-weight:600;color:var(--ink)}
.taglist{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;color:var(--ink2);font-weight:600}
.tag.missing{background:var(--bad-bg);border-color:#EBC7C3;color:var(--bad)}
.note{background:var(--gold-bg);color:var(--gold-ink);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45}
.note.warn{background:var(--gold-bg);color:var(--gold-ink)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.info{background:var(--surface2);color:var(--ink2);border:1px solid var(--line2)}
.note+.note{margin-top:8px}
.obsnote{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--ink2);line-height:1.45;white-space:pre-wrap}
.projrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px}
.projrow:last-child{border-bottom:0}
.projrow .pname{font-weight:700}
.projrow .pmeta{color:var(--muted);font-size:12.5px;margin-top:1px}
.projrow.current .pname{color:var(--ink)}
.revbadge{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:6px 11px;border-radius:10px}
.revbadge.ok{background:var(--ok-bg);color:var(--ok)}
.revbadge.warn{background:var(--gold-bg);color:var(--gold-ink)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:680px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:transparent;padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);transition:color .18s ease}
.nav button svg{width:22px;height:22px}
.nav button .navicon{display:flex;align-items:center;justify-content:center;padding:3px 18px;border-radius:var(--radius-pill);margin-bottom:1px;transition:background .2s ease}
.nav button.on{color:var(--accent)}
.nav button.on .navicon{background:var(--info-bg)}

/* forms */
.screen-title{padding:2px 2px 4px}
.screen-title h2{font-size:28px;font-weight:700;margin:6px 0 2px;letter-spacing:-.02em}
.screen-title p{margin:0;color:var(--muted);font-size:14px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.block h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 14px;font-weight:700}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:-.005em}
.field label .req{color:var(--bad);font-weight:800}
.field label .opt{color:var(--muted);font-weight:500;font-size:12px}
.input,.textarea,.selectlike{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface2);outline:none;font-size:15.5px}
.input:focus,.textarea:focus{border-color:var(--ink);background:var(--surface);box-shadow:0 0 0 3px rgba(16,21,31,.08)}
.textarea{min-height:80px;resize:vertical;font-family:inherit}
.errtext{color:var(--bad);font-size:12.5px;margin-top:5px;display:none}
.field.err .input,.field.err .selectlike{border-color:var(--bad)}
.field.err .errtext{display:block}
.block.err{border-color:var(--bad)}
.block.err .errtext{display:block}
.checkline{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;min-height:24px}
.checkline input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}
.checkline span{font-size:15px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}

/* combobox */
.combo{position:relative}
.combo-input{width:100%;padding:11px 34px 11px 13px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface2);outline:none;font-size:15.5px}
.combo-input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(26,37,50,.12)}
.combo-arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.combo-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(16,21,31,.18);max-height:260px;overflow-y:auto;z-index:200}
.combo-opt{padding:12px 14px;font-size:14.5px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line2)}
.combo-opt:last-child{border-bottom:0}
.combo-opt:hover,.combo-opt.hi{background:var(--surface2)}
.combo-opt.create{color:var(--accent);font-weight:700}
.combo-empty{padding:14px;color:var(--muted);font-size:13.5px;text-align:center}
.selectedchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.selchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 11px;font-size:13.5px;font-weight:600}
.selchip button{border:0;background:var(--line2);width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:11px}

.btnbar{display:flex;gap:10px;padding:14px 0 6px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-pill);padding:13px 18px;font-weight:700;font-size:15.5px;transition:transform .1s}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}

/* config */
.cfgsection{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.cfghead{display:flex;align-items:center;justify-content:space-between;padding:14px 15px;cursor:pointer}
.cfghead h3{margin:0;font-size:15.5px;font-weight:700}
.cfghead .count{font-size:12.5px;color:var(--muted);font-weight:600}
.cfgbody{border-top:1px solid var(--line2);padding:6px 15px 14px}
.cfgrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14.5px;gap:10px}
.cfgrow:last-of-type{border-bottom:0}
.cfgrow .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfgrow .meta{color:var(--muted);font-size:12.5px;font-weight:500}
.cfgacts{display:flex;gap:6px;flex:none}
.iconbtn{border:0;background:var(--surface2);width:44px;height:44px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:transform .1s,background .15s}
.iconbtn:active{transform:scale(.92);background:var(--line2)}
.iconbtn.danger:active{background:var(--bad-bg)}
.iconbtn.danger{color:var(--bad)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1}
.addbtn{background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:10px;width:100%;text-align:center;font-weight:700;color:var(--ink2);font-size:14px;margin-top:8px}
.cfgempty{color:var(--muted);font-size:13.5px;padding:10px 0}

_cavalcadapatgefeliu","name":"Cavalcada Patge Feliu","year":null,"link":"","carpetaBox":"Partitures/Cavalcada Patge Feliu"},{"id":"proj_cavalcadareis","name":"Cavalcada Reis","year":null,"link":"","carpetaBox":"Partitures/Cavalcada Reis"},{"id":"proj_cercavila","name":"Cercavila","year":null,"link":"","carpetaBox":"Partitures/Cercavila"},{"id":"proj_firamodernistapropostes","name":"Fira Modernista (propostes)","year":null,"link":"","carpetaBox":"Partitures/Fira Modernista (propostes)"},{"id":"proj_novacercavila","name":"Nova Cercavila","year":null,"link":"","carpetaBox":"Partitures/Nova Cercavila"},{"id":"proj_partituresmusics","name":"Partitures músics","year":null,"link":"","carpetaBox":"Partitures/Partitures músics"}]}}</script>
<script>
/* Capture the pristine initial document markup (before any dynamic rendering)
   so we can republish the whole page later as the persisted record. */
const INITIAL_HTML = "<!doctype html>\n" + document.documentElement.outerHTML;

const RAW = JSON.parse(document.getElementById('data').textContent);

const STANDARD_ORDER = ["Flautí","Flauta","Oboè","Fagot","Clarinet","Clarinet baix","Saxo alt","Saxo tenor","Saxo baríton","Trompa","Trompeta","Trombó","Bombardí","Tuba","Percussió"];

const STATE = {
  pieces: RAW.pieces,
  catalogs: RAW.catalogs,
  role: 'gestio', // 'musica' | 'gestio' — demo-only toggle until real accounts exist
  screen: 'consultar',
  filters: { q:'', estil:null, projecte:null, any:null, estat:null, ubicacio:null, revisio:null, instrExtern:null },
};

function norm(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function cleanLocation(arr){
  if(!arr || !arr.length) return '';
  const seen = new Set(); const out = [];
  arr.forEach(raw=>{
    let s = (raw||'').split(/[.;]/)[0].trim(); // talla notes/frases després del primer punt
    if(!s) return;
    const key = s.toLowerCase();
    if(!seen.has(key)){ seen.add(key); out.push(s); }
  });
  return out.join(', ');
}
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }

/* ---------- nou sistema d'estat (5 etiquetes) ---------- */
function detailParts(p){
  const clean = arr => (arr||[]).filter(x => x && x.trim().toUpperCase()!=='TOT');
  const auto = clean(p.partsNoDetectades);
  if(auto.length) return auto.join(', ');
  const manual = clean(p.faltenInventari);
  if(manual.length) return manual.join(', ');
  return '';
}
function missingCount(p){
  if(p.partsNoDetectades&&p.partsNoDetectades.length) return p.partsNoDetectades.length;
  if(p.faltenInventari&&p.faltenInventari.length) return p.faltenInventari.length;
  return 0;
}
function partsSeverity(p){
  if(p.estatParts !== 'Falten parts') return null;
  if(p.totesFaltenParts) return 'severe';
  const mcAuto = (p.partsNoDetectades||[]).length;
  const mcManual = (p.faltenInventari||[]).length;
  if(mcAuto > 0) return mcAuto <= 4 ? 'forgivable' : 'severe';
  if(mcManual > 0) return 'severe'; // font humana (Excel/Word) — mai es perdona, per poc que sigui
  return 'severe'; // "Falten parts" sense cap detall concret — es tracta amb cautela
}
function obraState(p){
  if(p.nomesFisicPendent){
    const reasons = ['Només consta a l\'inventari físic — cal anar a comprovar-ho a l\'arxiu en paper.'];
    if(p.revisioNota && p.revisioNota.length) reasons.push(...p.revisioNota);
    return {key:'fisic', label:'Només en físic', cls:'gray', reasons};
  }
  const ep = p.estatParts, g = p.general;
  const knownGeneral = g!=='desconegut';
  const knownParts = ep==='Completa' || ep==='Falten parts';
  const severity = partsSeverity(p);
  const generalMissing = g!=='si'; // 'no' o 'desconegut' — no el tenim confirmat
  const reasons = [];
  if(p.autoriaConflicte) reasons.push('El compositor o l\'arranjador no coincideix entre les diverses còpies d\'aquesta obra — cal confirmar quin és el correcte.');
  if(p.arranjadorRevisar) reasons.push('El nom de l\'arranjador no s\'ha pogut normalitzar automàticament — cal revisar-lo.');
  if(p.pendentAcceptacio) reasons.push('Registrada per '+(p.registradaPer||'un músic')+(p.dataRegistre? ' el '+p.dataRegistre : '')+' — pendent que Junta l\'accepti.');
  if(p.calRevisioManual) reasons.push('Marcada manualment per revisar.');
  if(p.notaPaper && p.notaPaper.length) reasons.push('Hi ha una nota de l\'inventari en paper pendent de revisar: «'+p.notaPaper.join('; ')+'».');
  if(p.revisioNota && p.revisioNota.length) reasons.push(...p.revisioNota);
  if(knownGeneral && g==='no') reasons.push('Sabem que falta la partitura general del director.');
  if(!knownGeneral) reasons.push('No sabem si té la partitura general.');
  if(!p.composer && !p.arranger) reasons.push('No consta ni el compositor ni l\'arranjador.');
  else if(!p.composer) reasons.push('No consta el compositor.');
  else if(!p.arranger) reasons.push('No consta l\'arranjador.');
  if(severity==='forgivable') reasons.push('Falten '+(p.partsNoDetectades||[]).length+' parts detectades automàticament — es dona per pràcticament completa.');

  // 1) sense cap informació
  if(!knownGeneral && !knownParts){
    return {key:'incomplet', label:'Informació incompleta', cls:'gray', reasons};
  }
  // 2) disparadors clars de "cal revisar" — només incidències concretes que necessiten una persona
  if(p.calRevisioManual || (p.notaPaper&&p.notaPaper.length)){
    return {key:'revisar', label:'Cal revisar', cls:'warn', reasons};
  }
  // 3) problemes d'autoria — informació incompleta (un nom no normalitzable per si sol ja no bloqueja)
  if(p.autoriaConflicte){
    return {key:'incomplet', label:'Informació incompleta', cls:'gray', reasons};
  }
  // 4) no tenim la general confirmada com a "Sí" — separem l'etiqueta segons què falta exactament
  if(generalMissing){
    if(severity==='severe'){
      return {key:'falten-tot', label:'Falta general i parts', detail:detailParts(p), cls:'bad', reasons};
    }
    return {key:'falta-general', label:'Falta general', cls:'bad', reasons};
  }
  // a partir d'aquí, general==='si'
  // 5) falten parts de manera confirmada i no perdonable (font humana, o 5+, o "totes")
  if(severity==='severe'){
    return {key:'falten', label:'Falten parts', detail:detailParts(p), cls:'bad', reasons};
  }
  // 6) completa, o falten poques (1-4) detectades automàticament — es dona per complet
  if(ep==='Completa' || severity==='forgivable'){
    return {key:'complet', label:'Complet', cls:'ok', reasons};
  }
  // 7) sabem la general (Sí) però no sabem res fiable de les parts
  return {key:'incomplet', label:'Informació incompleta', cls:'gray', reasons};
}
function needsReview(p){ return obraState(p).key==='revisar'; }
function reviewReasons(p){ return obraState(p).reasons; }
function locationInfo(p){
  const digital = !!p.escanejada || (p.fileCount||0)>0;
  const fisic = !!p.enPaper || (p.ubicacioFisica && p.ubicacioFisica.length>0);
  if(digital && fisic) return 'Físic i digital';
  if(digital) return 'Digital';
  if(fisic) return 'Físic';
  return null;
}

/* ---------- persistence (artifact self-publish) ---------- */
let claudeArtifact = null;
(async () => { try { claudeArtifact = await window.claude?.use?.('artifact'); } catch(e){ claudeArtifact = null; } })();

function buildHtml(){
  const payload = { pieces: STATE.pieces, catalogs: STATE.catalogs };
  const json = JSON.stringify(payload).replace(/</g,'\\u003c');
  return INITIAL_HTML.replace(/(<script id="data" type="application\/json">)[\s\S]*?(<\/script>)/, (m,a,b)=> a+json+b);
}
let saveTimer=null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if(!claudeArtifact){ showSavePill('Desat només en aquesta sessió'); return; }
    try{ await claudeArtifact.publish(buildHtml()); showSavePill('Desat a l\'arxiu'); }
    catch(e){ showSavePill('No s\'ha pogut desar'); }
  }, 250);
}
function showSavePill(txt){
  const el = document.getElementById('savePill');
  el.textContent = txt;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=> el.classList.remove('show'), 2200);
}

/* ================= NAV / ROLE ================= */
function setRole(r){
  STATE.role = r;
  document.getElementById('roleLabel').textContent = r==='gestio' ? 'Gestió' : 'Músic';
  document.getElementById('navConfig').classList.toggle('hidden', r!=='gestio');
  if(STATE.screen==='config' && r!=='gestio') setScreen('consultar');
}
document.getElementById('roleSwitch').addEventListener('click', ()=> setRole(STATE.role==='gestio' ? 'musica' : 'gestio'));

function setScreen(s){
  STATE.screen = s;
  document.getElementById('mainConsultar').classList.toggle('hidden', s!=='consultar');
  document.getElementById('mainRegistrar').classList.toggle('hidden', s!=='registrar');
  document.getElementById('mainConfig').classList.toggle('hidden', s!=='config');
  document.getElementById('navConsultar').classList.toggle('on', s==='consultar');
  document.getElementById('navRegistrar').classList.toggle('on', s==='registrar');
  document.getElementById('navConfig').classList.toggle('on', s==='config');
  document.getElementById('topTitle').innerHTML = s==='consultar' ? 'Arxiu de la Banda<small>Banda de Terrassa</small>'
    : s==='registrar' ? 'Registrar obra<small>Banda de Terrassa</small>'
    : 'Configuració<small>Banda de Terrassa</small>';
  window.scrollTo(0,0);
  if(s==='registrar') renderRegistrar();
  if(s==='config') renderConfig();
}
document.querySelectorAll('.nav button[data-screen]').forEach(b=> b.addEventListener('click', ()=> setScreen(b.dataset.screen)));

/* ================= CONSULTAR: subvistes ================= */
STATE.subview = 'biblioteca';
document.querySelectorAll('#subviewCtl button[data-sub]').forEach(b=>{
  b.addEventListener('click', ()=>{
    STATE.subview = b.dataset.sub;
    document.querySelectorAll('#subviewCtl button[data-sub]').forEach(x=>x.classList.toggle('on', x===b));
    document.getElementById('subBiblioteca').classList.toggle('hidden', STATE.subview!=='biblioteca');
    document.getElementById('subProjectes').classList.toggle('hidden', STATE.subview!=='projectes');
    document.getElementById('subPendents').classList.toggle('hidden', STATE.subview!=='pendents');
    if(STATE.subview==='projectes') renderProjectesView();
    if(STATE.subview==='pendents') renderPendentsView();
  });
});

function obresDe(projecteId){ return STATE.pieces.filter(p=> (p.aparicions||[]).some(a=>a.projecteId===projecteId)); }
function projStats(pid){
  const list = obresDe(pid);
  let completa=0, falten=0, revisar=0, incomplet=0, fisic=0;
  list.forEach(p=>{ const st=obraState(p); if(st.key==='complet') completa++; else if(st.key==='falten'||st.key==='falta-general'||st.key==='falten-tot') falten++; else if(st.key==='revisar') revisar++; else if(st.key==='fisic') fisic++; else incomplet++; });
  return {n:list.length, completa, falten, revisar, incomplet, fisic, pendents: revisar+incomplet};
}

STATE.pq = '';
function renderProjectesView(){
  const root = document.getElementById('subProjectes');
  const q = norm(STATE.pq);
  const prs = STATE.catalogs.projectes.filter(p=> !q || norm([p.name,p.year].join(' ')).includes(q));
  const byYear = {};
  prs.forEach(p=>{ const k = p.year || 'Sense any'; (byYear[k]=byYear[k]||[]).push(p); });
  const keys = Object.keys(byYear).sort((a,b)=> a==='Sense any'?1 : b==='Sense any'?-1 : b-a);
  root.innerHTML = `
    <div class="search" style="margin-bottom:10px">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input class="pqInput" id="pqInput" type="text" placeholder="Cerca un projecte…" value="${esc(STATE.pq)}">
    </div>
    ${STATE.role==='gestio' ? `<button class="addbtn" id="newProj" style="margin-bottom:14px">+ Nou projecte</button>` : ''}
    ${keys.map(k=>`<h3 class="sec">${esc(String(k))}</h3><div class="list">${byYear[k].slice().sort((a,b)=>a.name.localeCompare(b.name,'ca')).map(pr=>{
      const s = projStats(pr.id);
      const bits = [];
      if(s.completa) bits.push(s.completa+' completes');
      if(s.falten) bits.push(s.falten+' amb parts que falten');
      if(s.pendents) bits.push(s.pendents+' pendents');
      const needsAttention = s.falten>0 || s.pendents>0;
      return `<button class="projrow2" data-pid="${pr.id}">
        <div class="main">
          <div class="title" style="font-size:15.5px">${esc(pr.name)}</div>
          <p class="authors">${s.n} partitur${s.n===1?'a':'es'}${bits.length?' · '+esc(bits.join(', ')):''}</p>
        </div>
        ${needsAttention?'<span class="tdot" style="background:var(--gold);width:8px;height:8px;border-radius:50%;flex:none"></span>':''}
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>`;
    }).join('')}</div>`).join('') || '<div class="empty"><p>Cap projecte.</p></div>'}
  `;
  const inp = document.getElementById('pqInput');
  inp.addEventListener('input', ()=>{ STATE.pq = inp.value; const pos = inp.selectionStart; renderProjectesView(); const n=document.getElementById('pqInput'); n.focus(); n.setSelectionRange(pos,pos); });
  root.querySelectorAll('[data-pid]').forEach(b=> b.addEventListener('click', ()=> openProjecteSmart(b.dataset.pid)));
  const newBtn = document.getElementById('newProj');
  if(newBtn) newBtn.addEventListener('click', ()=> editProjecte(null, ()=> renderProjectesView()));
}

function openProjecteSheet(pid){
  const pr = projById(pid); if(!pr) return;
  const obres = obresDe(pid).sort((a,b)=>a.title.localeCompare(b.title,'ca'));
  const s = projStats(pid);
  const bg = document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML = `<div class="sheet">
    <div class="sheet-head"><div class="htxt"><h2 style="display:block">${esc(pr.name)}</h2><div class="hsub">${pr.year||'Sense any'}</div></div>
      <button class="sheet-close" id="pjClose"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="sheet-body">
      ${pr.link?`<a class="btn primary" style="text-decoration:none;display:flex;margin-bottom:12px" href="${esc(pr.link)}" target="_blank" rel="noopener">Obre la carpeta a Box</a>`:'<p class="hint" style="margin:0 2px 12px">Sense enllaç de Box registrat.</p>'}
      <div class="k4row">
        <div class="k4item"><div class="num">${s.n}</div><div class="lbl">Partitures</div></div>
        <div class="k4item"><div class="num" style="color:var(--bad)">${s.falten}</div><div class="lbl">Falten</div></div>
        <div class="k4item"><div class="num" style="color:var(--gold-ink)">${s.pendents}</div><div class="lbl">Pendents</div></div>
        <div class="k4item"><div class="num" style="color:var(--ok)">${s.completa}</div><div class="lbl">Completes</div></div>
      </div>
      <h3 class="sec">Obres (${obres.length})</h3>
      <div class="list">${obres.map(o=>{ const st=obraState(o); return `<button class="projrow2" data-oid="${o.id}">
        <div class="main">
          <div class="title" style="font-size:15px">${esc(o.title)}</div>
          <p class="authors">${esc([o.composer,o.arranger?('Arr. '+o.arranger):''].filter(Boolean).join(' · '))}</p>
        </div>
        ${st?`<span class="tagpill ${st.cls}"><span class="tdot"></span>${esc(st.label)}</span>`:''}
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>`; }).join('') || '<p class="hint" style="padding:12px 0">Cap obra registrada encara per aquest projecte.</p>'}</div>
    </div>
  </div>`;
  document.body.appendChild(bg); document.body.classList.add('locked');
  function close(){ document.body.removeChild(bg); document.body.classList.remove('locked'); }
  bg.querySelector('#pjClose').addEventListener('click', close);
  bg.addEventListener('click', e=>{ if(e.target===bg) close(); });
  bg.querySelectorAll('[data-oid]').forEach(r=> r.addEventListener('click', ()=>{ close(); openObraSmart(r.dataset.oid); }));
}

function renderPendentsView(){

function projectYears(){ return [...new Set(STATE.catalogs.projectes.map(p=>p.year).filter(Boolean))].sort((a,b)=>b-a); }
function projById(id){ return STATE.catalogs.projectes.find(p=>p.id===id); }
function projLabel(p){
  const n = p.aparicions ? p.aparicions.length : 0;
  if(n===0) return 'Sense projecte';
  if(n===1) return p.aparicions[0].projecte + (p.aparicions[0].any? ' · '+p.aparicions[0].any : '');
  return n+' projectes';
}

function matches(p){
  const f = STATE.filters;
  if(f.q){
    const q = norm(f.q);
    const projNames = (p.aparicions||[]).map(a=>a.projecte).join(' ');
    const hay = norm([p.title,p.composer,p.arranger,projNames,p.estil].join(' '));
    if(!hay.includes(q)) return false;
  }
  if(f.estil && p.estil!==f.estil) return false;
  if(f.estat && obraState(p).key!==f.estat) return false;
  if(f.ubicacio){
    const loc = locationInfo(p);
    if(f.ubicacio==='fisic' && !(loc==='Físic'||loc==='Físic i digital')) return false;
    if(f.ubicacio==='digital' && !(loc==='Digital'||loc==='Físic i digital')) return false;
  }
  if(f.instrExtern && !(p.specials||[]).includes(f.instrExtern)) return false;
  return true;
}

/* ================= COMBOBOX / MULTISELECT COMPONENTS ================= */
function positionPanel(panel, input){
  const r = input.getBoundingClientRect();
  const spaceBelow = window.innerHeight - r.bottom;
  const openUp = spaceBelow < 180 && r.top > spaceBelow;
  panel.style.position = 'fixed';
  panel.style.left = r.left+'px';
  panel.style.width = r.width+'px';
  if(openUp){
    panel.style.bottom = (window.innerHeight - r.top + 6)+'px';
    panel.style.top = 'auto';
  } else {
    panel.style.top = (r.bottom + 6)+'px';
    panel.style.bottom = 'auto';
  }
}
function attachPanelDismiss(closeFn){
  const onScroll = ()=>{ closeFn(); document.removeEventListener('scroll', onScroll, true); window.removeEventListener('resize', onScroll); };
  document.addEventListener('scroll', onScroll, true);
  window.addEventListener('resize', onScroll);
  return onScroll;
}
function makeCombobox(container, {items, value, onChange, placeholder, allowCreate=true}){
  container.classList.add('combo');
  container.innerHTML = `<input class="combo-input" type="text" placeholder="${esc(placeholder||'')}" autocomplete="off" value="${esc(value||'')}">
    <svg class="combo-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const input = container.querySelector('input');
  let panel = null, dismiss = null;
  function closePanel(){ if(panel){ panel.remove(); panel=null; } if(dismiss){ document.removeEventListener('scroll',dismiss,true); window.removeEventListener('resize',dismiss); dismiss=null; } }
  function openPanel(){
    closePanel();
    const q = norm(input.value);
    const filtered = items.filter(it=> norm(it).includes(q));
    panel = document.createElement('div'); panel.className='combo-panel';
    let html = '';
    filtered.slice(0,60).forEach(it=> html += `<div class="combo-opt" data-v="${esc(it)}">${esc(it)}</div>`);
    if(allowCreate && input.value.trim() && !items.some(it=> norm(it)===q)){
      html += `<div class="combo-opt create" data-create="1">+ Afegeix "${esc(input.value.trim())}"</div>`;
    }
    if(!html) html = `<div class="combo-empty">Sense resultats</div>`;
    panel.innerHTML = html;
    document.body.appendChild(panel);
    positionPanel(panel, input);
    dismiss = attachPanelDismiss(closePanel);
    panel.querySelectorAll('.combo-opt[data-v]').forEach(o=> o.addEventListener('mousedown', e=>{ e.preventDefault(); input.value=o.dataset.v; onChange(o.dataset.v); closePanel(); }));
    const c = panel.querySelector('.combo-opt[data-create]');
    if(c) c.addEventListener('mousedown', e=>{ e.preventDefault(); const v=input.value.trim(); if(!items.includes(v)) items.push(v); onChange(v); closePanel(); });
  }
  input.addEventListener('focus', openPanel);
  input.addEventListener('input', openPanel);
  input.addEventListener('blur', ()=> setTimeout(closePanel,150));
}

function unifyRename(listKey, oldVal, newVal){
  let count = 0;
  function mergeArr(arr){
    if(!arr || !arr.includes(oldVal)) return arr;
    return [...new Set(arr.map(x=> x===oldVal? newVal : x))];
  }
  STATE.pieces.forEach(p=>{
    let touched = false;
    if(listKey==='autors'){
      if(p.composer===oldVal){ p.composer = newVal; touched = true; }
      else if(p.composer && p.composer.includes('; ')){
        const parts = p.composer.split('; ');
        if(parts.includes(oldVal)){ p.composer = [...new Set(parts.map(x=>x===oldVal?newVal:x))].join('; '); touched = true; }
      }
    } else if(listKey==='arranjadors'){
      if(p.arranger===oldVal){ p.arranger = newVal; touched = true; }
      else if(p.arranger && p.arranger.includes('; ')){
        const parts = p.arranger.split('; ');
        if(parts.includes(oldVal)){ p.arranger = [...new Set(parts.map(x=>x===oldVal?newVal:x))].join('; '); touched = true; }
      }
    } else if(listKey==='estils'){
      if(p.estil===oldVal){ p.estil = newVal; touched = true; }
    } else if(listKey==='instrumentsExterns'){
      const merged = mergeArr(p.specials);
      if(merged){ p.specials = merged; touched = true; }
    } else if(listKey==='parts'){
      const m1 = mergeArr(p.partsDetectades), m2 = mergeArr(p.partsNoDetectades);
      if(m1){ p.partsDetectades = m1; touched = true; }
      if(m2){ p.partsNoDetectades = m2; touched = true; }
    }
    if(touched) count++;
  });
  return count;
}
function editCatalogValue(listKey, cur, done){
  const bg = document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML = `<div class="sheet">
    <div class="sheet-head"><div class="htxt"><h2 style="display:block">Edita el valor</h2></div>
      <button class="sheet-close" id="cvClose"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="sheet-body">
      <div class="field"><label>Nom</label><input class="input" id="cv_val" value="${esc(cur)}"></div>
      <p class="hint">Si aquest valor ja s'utilitza en alguna obra, es corregirà a totes alhora.</p>
      <div class="btnbar"><button class="btn primary" id="cvSave" style="flex:1">Desa</button></div>
    </div>
  </div>`;
  document.body.appendChild(bg); document.body.classList.add('locked');
  const input = bg.querySelector('#cv_val');
  setTimeout(()=>{ input.focus(); input.select(); }, 50);
  function close(){ document.body.removeChild(bg); document.body.classList.remove('locked'); }
  bg.querySelector('#cvClose').addEventListener('click', close);
  bg.querySelector('#cvSave').addEventListener('click', ()=>{
    const val = input.value.trim();
    if(val && val!==cur){
      const idx = STATE.catalogs[listKey].indexOf(cur);
      if(idx>-1) STATE.catalogs[listKey][idx] = val;
      const n = unifyRename(listKey, cur, val);
      persist();
      if(n>0) showSavePill(`Unificat a ${n} obra${n===1?'':'s'}`);
    }
    close(); done();
  });
}

      STATE.catalogs.projectes = STATE.catalogs.projectes.filter(p=>p.id!==b.dataset.del); persist(); renderCfgBody(key, body); renderConfig();
    }));
    body.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=> editProjecte(b.dataset.edit, ()=>renderCfgBody(key,body))));
    body.querySelector('#addProjecte').addEventListener('click', ()=> editProjecte(null, ()=>{renderCfgBody(key,body); renderConfig();}));
    return;
  }
  const listKey = key;
  const items = STATE.catalogs[listKey];
  body.innerHTML = (items.length? items.slice().sort((a,b)=>a.localeCompare(b,'ca')).map(v=>`
    <div class="cfgrow" data-v="${esc(v)}">
      <div class="nm">${esc(v)}</div>
      <div class="cfgacts"><button class="iconbtn" data-edit="${esc(v)}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="iconbtn danger" data-del="${esc(v)}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4.5A1.5 1.5 0 0110.5 3h3A1.5 1.5 0 0115 4.5V7m2 0v12.5A1.5 1.5 0 0115.5 21h-7A1.5 1.5 0 017 19.5V7h10z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    </div>`).join('') : '<div class="cfgempty">Encara no hi ha cap element.</div>')
    + `<div class="addrow"><input class="input" id="newVal_${listKey}" placeholder="Nom nou"><button class="btn primary" style="flex:none;padding:11px 16px" id="addVal_${listKey}">+ Afegir</button></div>`;

  body.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', ()=>{
    STATE.catalogs[listKey] = STATE.catalogs[listKey].filter(v=>v!==b.dataset.del); persist(); renderCfgBody(key, body); renderConfig();
  }));
  body.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=>{
    editCatalogValue(listKey, b.dataset.edit, ()=>{ renderCfgBody(key, body); renderConfig(); });
  }));
  const addBtn = body.querySelector('#addVal_'+listKey);
  const addInput = body.querySelector('#newVal_'+listKey);
  addBtn.addEventListener('click', ()=>{
    const v = addInput.value.trim();
    if(v && !STATE.catalogs[listKey].includes(v)){ STATE.catalogs[listKey].push(v); persist(); renderCfgBody(key, body); renderConfig(); }
  });
}
function editProjecte(id, done){
  const proj = id? STATE.catalogs.projectes.find(p=>p.id===id) : {id:uid('proj'), name:'', year:null};
  const isNew = !id;
  const bg = document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML = `<div class="sheet">
    <div class="sheet-head"><div class="htxt"><h2 style="display:block">${isNew?'Nou projecte':'Edita projecte'}</h2></div>
      <button class="sheet-close" id="pClose"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="sheet-body">
      <div class="field"><label>Nom</label><input class="input" id="p_name" value="${esc(proj.name)}"></div>
      <div class="field"><label>Any</label><input class="input" id="p_year" type="number" value="${proj.year||''}"></div>
      <div class="field"><label>Enllaç de la carpeta a Box <span class="opt">opcional</span></label><input class="input" id="p_link" placeholder="https://…" value="${esc(proj.link||'')}"></div>
      <div class="btnbar"><button class="btn primary" id="pSave" style="flex:1">Desa</button></div>
    </div>
  </div>`;
  document.body.appendChild(bg); document.body.classList.add('locked');
  function close(){ document.body.removeChild(bg); document.body.classList.remove('locked'); }
  bg.querySelector('#pClose').addEventListener('click', close);
  bg.querySelector('#pSave').addEventListener('click', ()=>{
    proj.name = bg.querySelector('#p_name').value.trim() || 'Sense nom';
    proj.year = Number(bg.querySelector('#p_year').value) || null;
    proj.link = bg.querySelector('#p_link').value.trim();
    if(isNew) STATE.catalogs.projectes.push(proj);
    persist(); close(); done();
  });
}

/* ================= INIT ================= */
setRole('gestio');
setScreen('consultar');
renderList();
</script>
</body></html>
