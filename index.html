<!doctype html>
<html lang="ca"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8FAFC">
<title>Arxiu · Banda de Terrassa</title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Arxiu">
<style>
:root{
  /* Marca (mateixa identitat que l'app d'assistència) */
  --brand-navy:#102A43; --brand-pink:#F05FA3;
  --accent-h:212; --accent-s:32%; --accent-l:15%;
  --accent:hsl(var(--accent-h) var(--accent-s) var(--accent-l)); --accent-ink:#FFFFFF;
  --accent-soft:hsl(var(--accent-h) 50% 95%); --accent-line:hsl(var(--accent-h) 38% 82%);
  --accent-2:var(--brand-pink);
  /* Neutres */
  --bg:#F8FAFC; --surface:#FFFFFF; --surface2:#EEF2F6; --line:#E1E7EF; --line2:#E1E7EF; --line-strong:#C7D1DD;
  --ink:#10151F; --ink2:#3A4453; --muted:#67728A;
  /* Estats */
  --ok:#1F9A57; --ok-bg:#D8F0E2; --ok-fg:#0D6B3C;
  --bad:#D8433E; --bad-bg:#F9DCDB; --bad-fg:#A3231F;
  --gold:#D6A84F; --gold-bg:#F6E8CC; --gold-ink:#5C3E0A;
  --info:#0B4C6B; --info-bg:#D7ECF7; --gray-bg:#EEF2F6;
  --overlay:rgba(10,15,23,.46);
  /* Forma i elevació */
  --radius:16px; --radius-s:10px; --radius-l:24px; --radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(16,21,31,.06);
  --shadow:0 1px 2px rgba(16,21,31,.04), 0 18px 38px -10px rgba(16,21,31,.16);
  --shadow-lg:0 2px 6px rgba(16,21,31,.06), 0 28px 56px -14px rgba(16,21,31,.24);
  --ease-spring:cubic-bezier(.34,1.56,.64,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --nav-h:64px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:inherit}
.hidden{display:none!important}

/* ---- capçalera ---- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid transparent;transition:border-color .2s}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:9px;padding:14px 16px 10px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(155deg, var(--brand-navy), hsl(var(--accent-h) var(--accent-s) 14%) 70%);display:grid;place-items:center;flex:none;box-shadow:var(--shadow-sm), 0 0 0 1px color-mix(in srgb, var(--line-strong) 70%, transparent)}
/* logotip sense fons */
.logo,.logo-big{background:none!important;box-shadow:none!important;border-radius:0!important;overflow:visible}
.logo img,.logo-big img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(16,21,31,.18))}
.logo-big img{filter:drop-shadow(0 8px 18px rgba(16,21,31,.22))}
.top h1{flex:1;min-width:0;font-size:clamp(14px,4.5vw,21px);font-weight:700;margin:0;letter-spacing:-.015em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:var(--muted);font-weight:400;letter-spacing:0;margin-top:1px}
.top .sp{flex:0}
@media (max-width:360px){ .top-in{padding:12px 12px 9px;gap:7px} .top .logo{width:36px;height:36px} .top .icon-btn{width:36px;height:36px} }
.savepill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;padding:10px 16px;border-radius:12px;z-index:60;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s}
.savepill.show{opacity:1}

main{max-width:680px;margin:0 auto;padding:8px 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px));animation:fadeUp .35s var(--ease-out)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- Consultar ---- */
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;min-height:44px;padding:0 16px 0 42px;border:1px solid var(--line-strong);border-radius:var(--radius-pill);background:var(--surface);outline:none;font-size:16px;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search input::placeholder{color:var(--muted)}

.countline{font-size:13px;color:var(--muted);margin:2px 2px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.countline button{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;min-height:40px;padding:0 14px;color:var(--ink2);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;transition:transform .15s var(--ease-spring)}
.countline button:active{transform:scale(.95)}
.countline .fbadge{background:var(--ink);color:var(--bg);border-radius:999px;font-size:10.5px;padding:1px 7px;font-weight:700}

.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:var(--radius-l);box-shadow:var(--shadow-sm);border:1px solid var(--line);padding:14px 14px 14px 16px;text-align:left;width:100%;display:flex;align-items:center;gap:12px;transition:transform .18s var(--ease-spring),box-shadow .2s ease,background .15s}
.card:active{background:var(--surface2);transform:scale(.985)}
@media (hover:hover){ .card:hover{box-shadow:var(--shadow)} }
.card .main{flex:1;min-width:0}
.card .titlerow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:2px}
.card .title{font-weight:600;font-size:16px;line-height:1.25;letter-spacing:-.01em;margin:0}
.estilchip{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.card .authors{font-size:13.5px;color:var(--muted);margin:0 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusline{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;margin:0;background:var(--gray-bg);color:var(--ink2)}
.statusline .dot{width:7px;height:7px;border-radius:50%;flex:none;background:currentColor}
.statusline.ok{background:var(--ok-bg);color:var(--ok-fg)}
.statusline.warn{background:var(--gold-bg);color:var(--gold-ink)}
.statusline.bad{background:var(--bad-bg);color:var(--bad-fg)}
.statusline.gray{background:var(--gray-bg);color:var(--muted)}
.countline .sp{flex:1}
.viewtoggle{display:flex;background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:2px}
.viewtoggle button{border:0!important;background:transparent!important;min-height:36px!important;width:40px;padding:0!important;border-radius:999px!important;display:grid!important;place-items:center;color:var(--muted)!important}
.viewtoggle button.on{background:var(--ink)!important;color:var(--bg)!important}
/* vista compacta: una targeta per obra amb el color de l'estat al marc */
.list#list{padding-right:18px;gap:0}
.list > .cards{display:flex;flex-direction:column;gap:10px}
.list#list h3.letter{margin:20px 16px 6px;font-size:13px;letter-spacing:.02em;text-transform:none;color:var(--muted);font-weight:600}
.list#list h3.letter:first-child{margin-top:2px}
.list.compact h3.letter{margin:20px 16px 6px;font-size:13px;letter-spacing:.02em;text-transform:none;color:var(--muted);font-weight:600}
.list.compact h3.letter:first-child{margin-top:2px}
.crows{display:flex;flex-direction:column;gap:8px}
/* cada obra és una targeta arrodonida; el color de l'estat forma part del marc (com les sessions del calendari de l'app d'assistència) */
.crow{position:relative;display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 14px 9px 14px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-left:7px solid var(--line-strong);border-radius:var(--radius-l);box-shadow:var(--shadow-sm);overflow:hidden;transition:transform .18s var(--ease-spring),background .15s}
.crow.ok{border-left-color:var(--ok)} .crow.bad{border-left-color:var(--bad)} .crow.warn{border-left-color:var(--gold)}
.crow:active{background:var(--surface2);transform:scale(.985)}
.ctext{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ctitle{font-weight:500;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cwho{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cflag{width:20px;height:20px;border-radius:50%;background:var(--gold-bg);color:var(--gold-ink);font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}
.crow .chevron{color:var(--line-strong);flex:none;width:14px;height:14px}
.azindex{position:fixed;right:max(2px, calc((100vw - 680px) / 2 - 22px));transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;align-items:center;padding:4px 2px;touch-action:none;user-select:none;-webkit-user-select:none}
.azindex button{border:0;background:transparent;color:var(--accent);font-weight:700;line-height:1;padding:0 6px;min-height:0;display:flex;align-items:center}
/* ajuda */
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--ink2);border:1px solid var(--line);background:var(--surface);flex:none;transition:transform .15s var(--ease-spring)}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.help-intro{background:var(--accent-soft);border-radius:var(--radius);padding:12px 14px;font-size:13.5px;color:var(--ink2);margin:0 0 6px}
.help-h{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:20px 2px 4px}
.help-row{display:flex;gap:13px;align-items:flex-start;padding:12px 0}
.help-row + .help-row{border-top:1px solid var(--line)}
.help-row > span:first-child{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px}
.help-row > div{font-size:13.5px;line-height:1.45;color:var(--ink2);padding-top:2px}
.help-row b{color:var(--ink);font-size:14.5px;display:block;margin-bottom:3px}
.help-row .tagrow{margin:4px 0 6px}
.swatch{position:relative}
.swatch::before{content:"";width:5px;height:24px;border-radius:4px;background:currentColor}
.swatch.ok{color:var(--ok)} .swatch.bad{color:var(--bad)} .swatch.warn{color:var(--gold)}
/* inici de sessió (igual que l'app d'assistència) */
body.auth > .top, body.auth > main, body.auth > .nav, body.auth #azindex{display:none!important}
#loginScreen{padding:0 16px}
.login{min-height:100vh;min-height:100svh;display:grid;align-content:center;justify-items:center;gap:18px;padding:32px 0;text-align:center}
.login form{display:grid;gap:12px;width:min(100%,340px);text-align:left}
.logo-big{width:96px;height:96px;margin:0 0 -16px;border-radius:26px;background:linear-gradient(155deg, var(--brand-navy), hsl(var(--accent-h) var(--accent-s) 14%) 65%);box-shadow:var(--shadow-lg), 0 0 0 1px color-mix(in srgb, var(--line-strong) 70%, transparent);display:grid;place-items:center}
.login-h1{margin:0;font-weight:700;font-size:25px;line-height:1.12;letter-spacing:-.02em}
.login .muted{color:var(--muted);font-size:14px}
.login-foot{font-size:12.5px;color:var(--muted);max-width:34ch;margin:0}
.err{background:var(--bad-bg);color:var(--bad-fg);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600}
.lfield{display:grid;gap:6px;min-width:0}
.lfield > span{font-size:12.5px;font-weight:600;color:var(--ink2)}
.inp{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);padding:0 12px;font-size:16px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.pass-wrap{position:relative}
.pass-wrap .inp{padding-right:44px}
.pass-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.pass-toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pass-toggle .slash{opacity:0}
.pass-toggle[aria-pressed="true"] .slash{opacity:1}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;font-size:13.5px}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line-strong);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(20px)}
.tagrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.minitag{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--gray-bg);color:var(--ink2);white-space:nowrap}
.minitag.warn{background:var(--gold-bg);color:var(--gold-ink)}
.minitag.gray{background:var(--gray-bg);color:var(--muted)}
.minitag.ok{background:var(--ok-bg);color:var(--ok-fg)}
.placepill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.placepill{min-height:26px;padding:0 11px;font-size:12.5px}
.locline{font-size:12.5px;color:var(--muted);margin:7px 0 0}
.placenote{font-size:12.5px;color:var(--muted);align-self:center}
.archwhere{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-top:10px;padding:10px 12px;border-radius:var(--radius);background:var(--surface2)}
.archwhere .archq{font-size:12.5px;font-weight:600;color:var(--ink2)}
.archwhere .chip{min-height:42px;padding:0 14px;font-size:13px}
.archfield.err .archwhere{box-shadow:inset 0 0 0 1px var(--bad)}
.reasons{margin:8px 0 0;padding-left:16px;font-size:12.5px;color:var(--gold-ink);line-height:1.5}
.acceptbtns{display:flex;flex-direction:column;gap:6px;flex:none}
.btn-sm{min-height:36px;padding:0 14px;font-size:13.5px}
.btn-danger-ghost{background:var(--bad-bg);border-color:var(--bad-bg);color:var(--bad-fg)}
.statgrid2{align-items:center}
.statgrid2 dd{display:flex;flex-wrap:wrap;gap:6px}
.seccnt{font-weight:600;color:var(--ink2);letter-spacing:0;margin-left:4px}
/* feina pendent */
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);box-shadow:var(--shadow-sm);margin-bottom:10px;overflow:hidden}
.taskhead{width:100%;display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 14px 12px 16px;border:0;background:transparent;text-align:left}
.taskhead:active{background:var(--surface2)}
.tasktxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tasktitle{font-weight:600;font-size:15.5px}
.taskdesc{font-size:12.5px;color:var(--muted);line-height:1.35}
.taskhead .count{font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--surface2);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums;flex:none}
.taskcaret{color:var(--muted);flex:none;transition:transform .25s var(--ease-out)}
.task.open .taskcaret{transform:rotate(180deg)}
.taskbody{border-top:1px solid var(--line);background:var(--bg);padding:12px}
.taskbody h3.sec:first-child{margin-top:4px}
/* projecte: repertori editable */
.projrow2 .rowmain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;text-align:left}
.projrow2 .rowmain .main{flex:1;min-width:0}
.pickl{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:6px}
.pickrow{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.pickrow:first-child{border-top:0}
.pickrow:active{background:var(--surface2)}
.pickrow .main{flex:1;min-width:0;display:flex;flex-direction:column}
.pickrow .title{font-weight:600;font-size:14.5px}
.pickrow .authors{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickplus{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
/* parts que falten */
.missbox{margin-top:12px;padding:14px;border-radius:var(--radius);background:var(--bad-bg)}
.missbox .misslabel{display:block;font-size:12.5px;font-weight:600;color:var(--bad-fg);margin-bottom:8px}
.missbox .chip{min-height:42px;padding:0 13px;font-size:13px}
.missbox .chip.on{background:var(--bad);border-color:var(--bad);color:#fff}
.missbox .chip:disabled{opacity:.4}
/* configuració */
.cfgpanel{border-top:1px solid var(--line);padding:12px 12px 6px;background:var(--bg)}
.cfgtools{display:flex;gap:8px;align-items:center}
.cfgsearch{flex:1;margin:0}
.cfgpanel .addrow{margin:10px 0 0}
.cfglist{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);max-height:420px;overflow-y:auto}
.cfglist .cfgrow{padding:8px 8px 8px 14px;border-bottom:1px solid var(--line)}
.cfglist .cfgrow:last-child{border-bottom:0}
.cfgname{flex:1;min-width:0}
.cfglist .iconbtn{width:40px;height:40px;border:0;background:transparent}
.cfglist .cfgempty{padding:16px;text-align:center}
.card .chevron{color:var(--line-strong);flex:none}

.empty{padding:42px 16px;text-align:center;color:var(--muted)}
.empty svg{width:40px;height:40px;margin-bottom:12px;opacity:.5}
.empty p{margin:0 auto;max-width:36ch;font-size:14.5px}

/* control segmentat (com les subpestanyes de l'app d'assistència) */
.segctl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:12px;gap:2px}
.segctl button{border:0;background:transparent;min-height:40px;padding:0 6px;border-radius:999px;font-weight:600;font-size:13px;line-height:1.1;color:var(--ink2);transition:background .2s var(--ease-out),color .2s}
@media (max-width:360px){ .segctl button{font-size:12px;padding:0 4px} .top-in{gap:9px} }
.segctl button.on{background:var(--ink);color:var(--bg)}

/* resum */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.statcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px 16px}
.statcard.warn{background:radial-gradient(130% 130% at 25% 15%, color-mix(in srgb, var(--gold) 22%, var(--surface)) 0%, var(--surface) 78%)}
.statcard .num{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.statcard .lbl{font-size:12.5px;color:var(--muted);margin-top:4px}
.statcard.wide{grid-column:1/-1}
.barrow{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:7px 0}
.barrow .lbl2{width:130px;flex:none;color:var(--ink2);font-weight:600}
.barrow .bar{flex:1;height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.barrow .bar span{display:block;height:100%;border-radius:999px}
.barrow .n{width:38px;text-align:right;font-variant-numeric:tabular-nums;flex:none}

/* projectes */
.projcard{background:var(--surface);border-radius:var(--radius-l);box-shadow:var(--shadow-sm);border:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:10px}
.projcard .pn{font-weight:600;font-size:15px}
.projcard .pm{font-size:12.5px;color:var(--muted);margin-top:2px}
.projcard .pc{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px;flex:none}

/* seccions de detall */
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px 16px;margin-bottom:12px}
.box h4{margin:0 0 12px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.box h4 .sp{flex:1}
.box h4 .cnt{font-weight:600;color:var(--ink2);text-transform:none;letter-spacing:0;font-size:12.5px}
.kvgrid{display:grid;grid-template-columns:112px 1fr;gap:10px 12px;font-size:14.5px;margin:0}
.kvgrid dt{color:var(--muted);font-size:13.5px}
.kvgrid dd{margin:0;overflow-wrap:anywhere;font-weight:500}
.pathbox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink2);background:var(--surface2);border-radius:8px;padding:6px 9px;overflow-wrap:anywhere;margin-top:8px}
.statusbig{display:flex;gap:8px;flex-wrap:wrap}
.tagpill{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--gray-bg);color:var(--ink2);white-space:nowrap}
.tagpill.ok{background:var(--ok-bg);color:var(--ok-fg)}
.tagpill.bad{background:var(--bad-bg);color:var(--bad-fg)}
.aifoot{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 10px;margin:4px 0 8px;font-size:12px;color:var(--muted)}
.revactions{display:flex;justify-content:flex-end;margin-top:8px}
.revactions .btn{flex:none}
.revbox{margin-bottom:14px}
.revbox .revhint{margin:0 0 8px;font-size:12.5px;opacity:.85}
.revitem{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid color-mix(in srgb, currentColor 15%, transparent);cursor:pointer}
.revitem input{flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:var(--ok)}
.tagpill.ia{background:var(--info-bg);color:var(--info)}
.tagpill.warn{background:var(--gold-bg);color:var(--gold-ink)}
.tagpill .tdot{width:6px;height:6px;border-radius:50%;background:currentColor}
.famgrid{display:flex;flex-direction:column;gap:10px}
.famgrid .famrow{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:start}
.famgrid .famrow>span{font-size:12px;font-weight:600;color:var(--muted);padding-top:4px}
.famgrid .famrow .chipsw{display:flex;flex-wrap:wrap;gap:6px}
.icchip{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--ink);color:var(--bg)}
.icchip.off{background:transparent;color:var(--muted);border:1px dashed var(--line-strong)}
.icchip.sp{background:var(--accent-soft);color:var(--accent)}
.copyrow{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:12px 14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.copyrow+.copyrow{margin-top:8px}
.k4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.k4row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.k4row .k4item{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:12px 4px}
.k4row .k4item .num{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.k4row .k4item .lbl{font-size:11px;color:var(--muted);margin-top:4px}
.projrow2{display:flex;gap:12px;align-items:center;min-height:64px;padding:12px 14px 12px 16px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);box-shadow:var(--shadow-sm);transition:transform .18s var(--ease-spring),box-shadow .2s,background .15s}
@media (hover:hover){ .projrow2:hover{box-shadow:var(--shadow)} }
.projrow2:active{transform:scale(.985);background:var(--surface2)}
.projrow2 .main{flex:1;min-width:0}
.projrow2 .title{font-weight:600;letter-spacing:-.01em;line-height:1.25}
.projrow2 .authors{font-size:12.5px;color:var(--muted);margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.projrow2 .chevron{color:var(--line-strong);flex:none}
.yrbox{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none;color:var(--ink2)}

/* xips (filtres) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius-pill);min-height:44px;padding:0 16px;font-size:13.5px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;transition:transform .15s var(--ease-spring),background .15s,color .15s,border-color .15s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* full inferior (sheet) */
.sheet-bg{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:sheetFade .18s ease}
.sheet{background:var(--bg);width:100%;max-width:600px;border-radius:28px 28px 0 0;max-height:92vh;max-height:calc(100dvh - 24px);overflow-y:auto;overscroll-behavior:contain;box-shadow:var(--shadow-lg);padding-bottom:env(safe-area-inset-bottom,0px);animation:sheetUp .32s var(--ease-spring)}
@media (min-width:700px){ .sheet-bg{align-items:center} .sheet{border-radius:24px;max-height:86vh;max-height:86dvh} }
.sheet-bg{height:100%;height:100dvh}
.sheet .btnbar{position:sticky;bottom:0;z-index:3;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom, color-mix(in srgb, var(--bg) 0%, transparent), var(--bg) 14px)}
.sheet > .btnbar{margin:0}
@keyframes sheetFade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:flex-start;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line);z-index:2}
.sheet-head .htxt{flex:1;min-width:0}
.sheet-head h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sheet-head .hsub{color:var(--muted);font-size:13px;margin-top:2px}
.sheet-head .authorlines{font-size:13.5px;color:var(--ink2);margin-top:6px;display:flex;flex-direction:column;gap:1px}
.sheet-close{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);flex:none;transition:transform .15s var(--ease-spring)}
.sheet-close:active{transform:scale(.9)}
.sheet-body{padding:14px 16px 24px}

h3.sec{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:24px 2px 10px;font-weight:700}
h3.sec:first-child{margin-top:12px}
.kv{display:flex;flex-direction:column}
.kv .item{display:flex;justify-content:space-between;gap:14px;font-size:14.5px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv .item:last-child{border-bottom:0}
.kv .k{color:var(--muted);flex:none}
.kv .v{text-align:right;font-weight:600}
.taglist{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--surface2);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink2);font-weight:600}
.tag.missing{background:var(--bad-bg);color:var(--bad-fg)}
.note{background:var(--gold-bg);color:var(--gold-ink);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45}
.note.warn{background:var(--gold-bg);color:var(--gold-ink)}
.note.bad{background:var(--bad-bg);color:var(--bad-fg)}
.note.info{background:var(--info-bg);color:var(--info)}
.note+.note{margin-top:8px}
.statgrid2+.note{margin-top:12px}
.note b{display:block;margin-bottom:4px}
.note ul{margin:0;padding-left:18px}
.note.plain{background:var(--surface2);color:var(--ink2)}
.obsnote{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--ink2);line-height:1.45;white-space:pre-wrap}
.projrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.projrow:last-child{border-bottom:0}
.projrow .pname{font-weight:600}
.projrow .pmeta{color:var(--muted);font-size:12.5px;margin-top:1px}
.revbadge{display:inline-flex;align-items:center;gap:6px;min-height:28px;font-size:13px;font-weight:700;padding:0 12px;border-radius:999px}
.revbadge.ok{background:var(--ok-bg);color:var(--ok-fg)}
.revbadge.warn{background:var(--gold-bg);color:var(--gold-ink)}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
.nav-in{max-width:680px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h);gap:2px}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);transition:color .2s}
.nav button svg{width:22px;height:22px}
.nav button .navicon{display:grid;place-items:center;width:52px;height:28px;border-radius:999px;transition:background .2s var(--ease-out),transform .3s var(--ease-spring)}
.nav button.on{color:var(--accent)}
.nav button.on .navicon{background:var(--accent-soft);transform:translateY(-1px)}

/* formularis */
.screen-title{padding:4px 2px 14px}
.screen-title h2{font-size:25px;font-weight:700;margin:0 0 4px;line-height:1.12;letter-spacing:-.02em}
.screen-title p{margin:0;color:var(--muted);font-size:14px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);box-shadow:var(--shadow-sm);padding:16px;margin-bottom:14px}
.sheet-body .block[style*="padding:0"]{border:0;background:transparent}
.block h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 14px;font-weight:700}
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field label{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.field label .req{color:var(--bad);font-weight:700}
.field label .opt{color:var(--muted);font-weight:400;font-size:12px}
.input,.textarea,.selectlike{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--radius-s);background:var(--surface);outline:none;font-size:16px;transition:border-color .15s,box-shadow .15s}
.input:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.textarea{padding:10px 12px;min-height:100px;resize:vertical;line-height:1.4;font-family:inherit}
.errtext{color:var(--bad-fg);font-size:12.5px;margin-top:5px;display:none}
.field.err .input,.field.err .selectlike{border-color:var(--bad)}
.field.err .errtext{display:block}
.block.err{border-color:var(--bad)}
.block.err .errtext{display:block}
.checkline{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.checkline input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.checkline span{font-size:15px;font-weight:500}
.hint{font-size:12px;color:var(--muted);margin-top:6px}

/* combobox */
.combo{position:relative}
.combo-input{width:100%;min-height:44px;padding:0 36px 0 12px;border:1px solid var(--line-strong);border-radius:var(--radius-s);background:var(--surface);outline:none;font-size:16px;transition:border-color .15s,box-shadow .15s}
.combo-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.combo-arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.combo-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);max-height:260px;overflow-y:auto;z-index:200}
.combo-opt{min-height:44px;padding:10px 14px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.combo-opt:last-child{border-bottom:0}
.combo-opt:hover,.combo-opt.hi{background:var(--surface2)}
.combo-opt.create{color:var(--accent);font-weight:600}
.combo-empty{padding:14px;color:var(--muted);font-size:13.5px;text-align:center}
.selectedchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.selchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:4px 5px 4px 12px;font-size:13px;font-weight:600}
.selchip button{border:0;background:rgba(255,255,255,.18);width:28px;height:28px;margin:-4px -2px -4px 0;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px}

.btnbar{display:flex;gap:8px;padding:14px 0 6px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:var(--radius-pill);font-weight:600;font-size:15px;letter-spacing:-.006em;transition:transform .2s var(--ease-spring),opacity .12s,box-shadow .2s}
.btn:active{transform:scale(.955);opacity:.9}
.btn.primary{background:linear-gradient(180deg, hsl(var(--accent-h) var(--accent-s) calc(var(--accent-l) + 4%)), var(--accent));border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-sm), 0 8px 20px hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .32)}
.btn.pill-dark{flex:none;display:inline-flex;background:var(--ink);border-color:var(--ink);color:var(--bg);margin:2px 0 6px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}

/* configuració */
.cfgsection{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);box-shadow:var(--shadow-sm);margin-bottom:10px;overflow:hidden}
.cfghead{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 16px;cursor:pointer}
.cfghead h3{margin:0;font-size:15.5px;font-weight:600}
.cfghead .count{font-size:12px;font-weight:600;color:var(--ink2);background:var(--surface2);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.cfgbody{border-top:1px solid var(--line);padding:6px 16px 14px}
.cfgrow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;gap:10px}
.cfgrow:last-of-type{border-bottom:0}
.cfgrow .nm{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfgrow .meta{color:var(--muted);font-size:12.5px}
.cfgacts{display:flex;gap:6px;flex:none}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:transform .15s var(--ease-spring),background .15s}
.iconbtn:active{transform:scale(.9);background:var(--surface2)}
.iconbtn.danger{color:var(--bad)}
.iconbtn.danger:active{background:var(--bad-bg)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1}
.addbtn{background:transparent;border:1px dashed var(--line-strong);border-radius:var(--radius);min-height:48px;padding:0 12px;width:100%;text-align:center;font-weight:600;color:var(--accent);font-size:14.5px;margin-top:8px;transition:background .15s}
.addbtn:active{background:var(--surface2)}
.cfgempty{color:var(--muted);font-size:13.5px;padding:10px 0}
.cfgnote{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}
.exportbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}
.exportbox .btnrow{display:flex;gap:8px;flex-wrap:wrap}
.exportbox .btnrow .btn{white-space:nowrap}
.exportbox .btn{flex:1 1 200px}
.exportbox p{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0}
.exportbox .restore{flex-basis:100%;color:var(--bad-fg)}
.btn.btn-danger-ghost{background:var(--bad-bg);border-color:var(--bad-bg);color:var(--bad-fg)}
.restsum{list-style:none;margin:4px 0 12px;padding:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.restsum li{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;font-size:14.5px;border-top:1px solid var(--line)}
.restsum li:first-child{border-top:0}
.restsum b{font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="logo"><img src="logo.png" alt="Arxiu"></div>
    <h1 id="topTitle">Banda de Terrassa<small></small></h1>
    <div class="sp"></div>
    <button class="icon-btn" id="helpBtn" aria-label="Com funciona l'arxiu"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.7 9.4a2.4 2.4 0 1 1 3.3 2.2c-.7.3-1 .8-1 1.6v.3M12 16.6v.2"/></svg></button>
    <button class="icon-btn" id="logoutBtn" aria-label="Tanca la sessió"><svg viewBox="0 0 24 24"><path d="M15 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-2"/><path d="M9 12h11m0 0-3-3m3 3-3 3"/></svg></button>
  </div>
</div>

<main id="mainConsultar">
  <div class="segctl" id="subviewCtl">
    <button data-sub="biblioteca" class="on">Biblioteca</button>
    <button data-sub="projectes">Projectes</button>
    <button data-sub="pendents">Per revisar</button>
  </div>

  <div id="subBiblioteca">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="Cerca per títol, autor, projecte, instrument…" autocomplete="off">
    </div>
    <div class="countline">
      <span id="resultCount"></span>
      <span class="sp"></span>
      <div class="viewtoggle" role="group" aria-label="Vista">
        <button data-view="ampliada" aria-label="Vista ampliada"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="7" rx="2" stroke="currentColor" stroke-width="2"/><rect x="4" y="13" width="16" height="7" rx="2" stroke="currentColor" stroke-width="2"/></svg></button>
        <button data-view="compacta" aria-label="Vista compacta"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
      <button id="openFilters">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Filtres<span class="fbadge hidden" id="filterCountBadge">0</span>
      </button>
    </div>
    <div class="list" id="list"></div>
    <div class="empty hidden" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <p>Cap obra coincideix amb la cerca o els filtres.</p>
    </div>
  </div>

  <div id="subProjectes" class="hidden"></div>
  <div id="subPendents" class="hidden"></div>
</main>

<main class="hidden" id="mainRegistrar">
  <div class="screen-title">
    <h2>Registrar obra</h2>
    <p>Afegeix una partitura nova al catàleg de l'arxiu.</p>
  </div>
  <div id="registrarForm"></div>

<script>


const STANDARD_ORDER = ["Flautí","Flauta","Oboè","Fagot","Clarinet","Clarinet baix","Saxo alt","Saxo tenor","Saxo baríton","Trompa","Trompeta","Trombó","Bombardí","Tuba","Percussió"];

const STATE = {
  pieces: [],   // es carreguen del servidor en entrar
  catalogs: {estils:[], autors:[], arranjadors:[], parts:[], instrumentsExterns:[], projectes:[], ubicacions:[]},
  role: 'gestio', // 'musica' | 'gestio' — demo-only toggle until real accounts exist
  screen: 'consultar',
  filters: { q:'', estil:null, projecte:null, any:null, estat:null, general:null, ubicacio:null, lloc:null, original:null, instrExtern:null },
  view: (()=>{ try{ return localStorage.getItem('arxiu.vista')==='compacta' ? 'compacta' : 'ampliada'; }catch(e){ return 'ampliada'; } })(),
};

function norm(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }

/* ---------- nou sistema d'estat (5 etiquetes) ---------- */
function detailParts(p){
  if(p.totesFaltenParts) return 'totes';
  const clean = arr => (arr||[]).filter(x => x && x.trim().toUpperCase()!=='TOT');
  const auto = clean(p.partsNoDetectades);
  if(auto.length) return auto.join(', ');
  const manual = clean(p.faltenInventari);
  if(manual.length) return manual.join(', ');
  return '';
}
function missingCount(p){
  if(p.partsNoDetectades&&p.partsNoDetectades.length) return p.partsNoDetectades.length;
  if(p.faltenInventari&&p.faltenInventari.length) return p.faltenInventari.length;
  return 0;
}
function partsSeverity(p){
  if(p.estatParts !== 'Falten parts') return null;
  if(p.totesFaltenParts) return 'severe';
  const mcAuto = (p.partsNoDetectades||[]).length;
  const mcManual = (p.faltenInventari||[]).length;
  if(mcAuto > 0) return mcAuto <= 4 ? 'forgivable' : 'severe';
  if(mcManual > 0) return 'severe'; // font humana (Excel/Word) — mai es perdona, per poc que sigui
  return 'severe'; // "Falten parts" sense cap detall concret — es tracta amb cautela
}
/* ---------- estats de l'obra ----------
   Cada obra té dues facetes: la partitura general (G) i les parts de la banda (P).
   Cada faceta pot ser: 'ok' (la tenim), 'falta' o '?' (no ho sabem, «No ho sé»).
   Capa 1 — estat principal (una sola etiqueta): combina G i P. El vermell (el que falta) mana sobre el groc (sense verificar).
   Si l'estat és vermell i l'altra faceta és «No ho sé», se'n mostra una segona etiqueta del mateix nivell (groga).
   Capa 2 — etiqueta secundària: «Cal revisar».
   Ubicació — a la targeta, una línia petita només quan és en físic; a la fitxa, Al Box / En físic.
   Per canviar un nom o un color, només cal tocar aquestes taules. */
const ESTATS = {
  'complet':           {label:'Completa',                cls:'ok'},
  'falta-general':     {label:'Falta general',           cls:'bad'},
  'falten':            {label:'Falten parts',            cls:'bad'},
  'falta-tot':         {label:'Falta general i parts',   cls:'bad'},
  'verificar':         {label:'Sense verificar',         cls:'warn'},
  'verificar-general': {label:'General sense verificar', cls:'warn'},
  'verificar-parts':   {label:'Parts sense verificar',   cls:'warn'},
};
const FACETA = {  // com es mostra cada faceta a la fitxa i als filtres
  general: {ok:{label:'Sí', cls:'ok'},        falta:{label:'Falta', cls:'bad'},  '?':{label:'Sense verificar', cls:'warn'}},
  parts:   {ok:{label:'Completes', cls:'ok'}, falta:{label:'Falten', cls:'bad'}, '?':{label:'Sense verificar', cls:'warn'}},
};
function facets(p){
  const sev = partsSeverity(p);
  return {
    G: p.general==='si' ? 'ok' : p.general==='no' ? 'falta' : '?',
    P: (p.estatParts==='Completa' || sev==='forgivable') ? 'ok' : sev==='severe' ? 'falta' : '?',
    sev,
  };
}
function stateKey(G, P){
  if(G==='falta' && P==='falta') return 'falta-tot';
  if(G==='falta') return 'falta-general';
  if(P==='falta') return 'falten';
  if(G==='?' && P==='?') return 'verificar';
  if(G==='?') return 'verificar-general';
  if(P==='?') return 'verificar-parts';
  return 'complet';
}
function obraState(p){
  const {G, P, sev} = facets(p);
  const key = stateKey(G, P);
  // quan l'estat és vermell, la faceta desconeguda passa a la capa 2
  const extra = (G==='falta' && P==='?') ? ESTATS['verificar-parts'].label
              : (P==='falta' && G==='?') ? ESTATS['verificar-general'].label : '';

  return {key, ...ESTATS[key], G, P, sev, extra, detail: P==='falta' ? detailParts(p) : ''};
}
function stateText(st){ return st.label + (st.extra ? ' · '+st.extra : ''); }
/* ---------- notes de la fitxa ----------
   Tres blocs amb regles fixes.
   · Cal revisar       — incidències que requereixen feina; activen l'etiqueta i surten a «Per revisar».
   · Sobre la partitura — descripció del material (quin tipus de general hi ha, què conté la carpeta…).
   · A tenir en compte  — informació de servei: què falta comprovar, registres pendents, autoria buida.
   Les notes internes de la importació no es mostren. */
const NOTE_RULES = [  // s'aplica la primera que coincideix; si cap coincideix → «Sobre la partitura»
  {re:/^Unificada amb|^segons inventari\.?$/i, to:'ocult'},
  {re:/\.rar\b|\bzip\b|descomprimir|cal revisar/i, to:'revisar'},
];
function classifyNote(n){ const r = NOTE_RULES.find(r=>r.re.test(n)); return r ? r.to : 'partitura'; }
function obraNotes(p){
  const out = {revisar:[], partitura:[], compte:[]};
  const {G, P} = facets(p);
  // Cal revisar
  out.revisar = revisioItems(p).map(x=> x.text);
  // Sobre la partitura / notes de la importació
  (p.revisioNota||[]).forEach(n=>{ if(classifyNote(n)==='partitura') out.partitura.push(n); });
  if(p.notaPaperRevisada && p.notaPaperRevisada.length) out.partitura.push('Nota de l\'inventari en paper: «'+p.notaPaperRevisada.join('; ')+'».');
  // A tenir en compte
  if(p.nomesFisicPendent && (G==='?' || P==='?')) out.compte.push('Només registrada a l\'inventari en paper. Cal comprovar l\'inventari físic.');
  else {
    if(P==='?') out.compte.push('No s\'ha comprovat si hi ha totes les parts.');
    if(G==='?') out.compte.push('No s\'ha comprovat si hi ha la partitura general.');
  }
  if(p.pendentAcceptacio) out.compte.push('Registrada per '+(p.registradaPer||'un músic')+(p.dataRegistre? ' el '+p.dataRegistre : '')+' — pendent d\'aprovació.');
  if(!p.composer && !p.arranger) out.compte.push('No consta ni el compositor ni l\'arranjador.');
  else if(!p.composer) out.compte.push('No consta el compositor.');
  return out;
}
/* incidències de «Cal revisar»: cadascuna té una clau perquè es pugui marcar com a revisada */
function revisioItems(p){
  const out = [];
  if(p.autoriaConflicte) out.push({key:'autoria', text:'El compositor o l\'arranjador no coincideix entre les diverses còpies d\'aquesta obra — cal confirmar quin és el correcte.'});
  if(p.arranjadorRevisar) out.push({key:'arranjador', text:'El nom de l\'arranjador no s\'ha pogut normalitzar.'});
  if(p.notaPaper && p.notaPaper.length) out.push({key:'paper', text:'Hi ha una nota de l\'inventari en paper pendent de revisar: «'+p.notaPaper.join('; ')+'».'});
  (p.revisioNota||[]).forEach(n=>{ if(classifyNote(n)==='revisar') out.push({key:'nota:'+n, text:n}); });
  return out;
}
/* marca com a revisades les incidències indicades (totes si no se'n passa cap) */
function marcaRevisada(p, keys){
  keys = keys || revisioItems(p).map(x=> x.key);
  if(!keys.length) return;
  keys.forEach(k=>{
    if(k==='autoria') p.autoriaConflicte = false;
    else if(k==='arranjador') p.arranjadorRevisar = false;
    else if(k==='paper'){ p.notaPaperRevisada = [...(p.notaPaperRevisada||[]), ...(p.notaPaper||[])]; p.notaPaper = []; }
    else if(k.startsWith('nota:')){ const n = k.slice(5); p.revisioNota = (p.revisioNota||[]).filter(x=> x!==n); p.revisioFeta = [...(p.revisioFeta||[]), n]; }
  });
  p.revisada = {per: STATE.user ? STATE.user.name : '', data: new Date().toLocaleDateString('ca-ES', {day:'numeric', month:'long', year:'numeric'})};
}
/* marca «Detecció per IA»: dades obtingudes automàticament (poden tenir errors) */
function deteccioIA(p){ return !!p.origenIA || partsSeverity(p)==='forgivable'; }
function needsReview(p){ return obraNotes(p).revisar.length>0; }
function isDigital(p){ return !!p.escanejada || (p.fileCount||0)>0; }
function isFisic(p){ return !!p.enPaper || (p.ubicacioFisica&&p.ubicacioFisica.length>0); }
/* on és cada cosa: la general i les parts, cadascuna Al Box i/o En físic */
function placesOf(p){
  const base = [isDigital(p)&&'box', isFisic(p)&&'fisic'].filter(Boolean);
  return { g: p.generalNomesFisic ? ['fisic'] : base, p: p.partsNomesFisic ? ['fisic'] : base };
}
const PLACE_LABEL = {box:'Al Box', fisic:'En físic'};
function placesText(arr){ return arr.map((x,i)=> i ? PLACE_LABEL[x].toLowerCase() : PLACE_LABEL[x]).join(' i '); }
/* línia d'ubicació de la targeta: només quan alguna cosa és només en físic
   (si és al Box, primer es busca allà) */
function locLineHtml(p){
  if(!isFisic(p)) return '';
  const what = !isDigital(p) ? ['Només en físic']
    : [p.generalNomesFisic && 'General només en físic', p.partsNomesFisic && 'Parts només en físic'].filter(Boolean);
  if(!what.length) return '';
  const bits = [...what, (p.ubicacioFisica||[]).join(', ') || 'lloc sense indicar'];
  return `<p class="locline">${esc(bits.join(' · '))}</p>`;
}

/* etiquetes d'una obra: capa 1 + capa 2 */
function tagsHtml(p, st){
  st = st || obraState(p);
  const t = [`<span class="statusline ${st.cls}"><span class="dot"></span>${esc(st.label)}${st.detail?' · '+esc(st.detail):''}</span>`];
  if(st.extra) t.push(`<span class="statusline warn"><span class="dot"></span>${esc(st.extra)}</span>`);
  if(needsReview(p)) t.push(`<span class="minitag warn">Cal revisar</span>`);
  return `<div class="tagrow">${t.join('')}</div>`;
}
/* on es troba (fitxa): només on hi és, sempre amb el mateix estil */
function placePillsHtml(p){
  const d = isDigital(p), f = isFisic(p);
  const out = [];
  if(d) out.push('Al Box');
  if(f) out.push(`En físic · ${(p.ubicacioFisica||[]).join(', ') || 'lloc sense indicar'}`);
  if(d && f){ if(p.generalNomesFisic) out.push('General només en físic'); if(p.partsNomesFisic) out.push('Parts només en físic'); }
  return out.length ? `<div class="tagrow">${out.map(x=>`<span class="placepill">${esc(x)}</span>`).join('')}</div>` : '<span class="hint" style="margin:0">No consta enlloc</span>';
}
function notesHtml(n){
  const block = (cls, title, items)=> items.length ? `<div class="note ${cls}"><b>${title}</b><ul>${items.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>` : '';
  return block('warn', 'Cal revisar', n.revisar) + block('plain', 'Sobre la partitura', n.partitura) + block('info', 'A tenir en compte', n.compte);
}
/* targeta d'obra (biblioteca i feina pendent) */
const ICO_CHEVRON = '<svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function obraCardHtml(p, opts={}){
  const st = obraState(p);
  const authors = [p.composer, p.arranger?('Arr. '+p.arranger):''].filter(Boolean).join(' · ');
  return `<div class="card" data-id="${p.id}" role="button" tabindex="0">
    <div class="main">
      <div class="titlerow"><p class="title">${esc(p.title)}</p></div>
      ${authors?`<p class="authors">${esc(authors)}</p>`:''}
      ${tagsHtml(p, st)}
      ${locLineHtml(p)}
      ${opts.reasons ? `<ul class="reasons">${obraNotes(p).revisar.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>` : ''}
    </div>
    ${opts.accept ? `<div class="acceptbtns">
        <button class="btn primary btn-sm" data-accept="${p.id}">Accepta</button>
        <button class="btn btn-sm btn-danger-ghost" data-reject="${p.id}">Elimina</button>
      </div>` : ICO_CHEVRON}
  </div>`;
}
function bindCards(root, open){
  open = open || openObraSmart;
  root.querySelectorAll('.card[data-id], .crow[data-id]').forEach(c=>{
    c.addEventListener('click', ()=> open(c.dataset.id));
    c.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(c.dataset.id); } });
  });
}
function refreshViews(){
  renderList();
  if(STATE.subview==='pendents') renderPendentsView();
  if(STATE.subview==='projectes') renderProjectesView();
  if(STATE.sheetRefresh) STATE.sheetRefresh();  // fitxa de projecte oberta
}


/* ---------- servidor (Supabase, projecte «arxiu») ----------
   Les dades només es poden llegir i desar amb una sessió oberta. El servidor comprova
   el rol: amb Consulta només es poden registrar obres noves. */
const ARXIU_URL = 'https://izysqmmqbvwkkqplkjgj.supabase.co';
const ARXIU_KEY = 'sb_publishable_Vz0K9slsiDPV7FK8eCCdhg_WG3fcnBM';
class ErrorServidor extends Error { constructor(codi){ super(codi); this.codi = codi; } }
async function servidor(ruta, body){
  let r;
  try{
    r = await fetch(ARXIU_URL + ruta, {method:'POST', headers:{'Content-Type':'application/json', apikey: ARXIU_KEY}, body: JSON.stringify(body)});
  }catch(e){ throw new ErrorServidor('XARXA'); }
  const txt = await r.text(); let data = null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok){
    const m = (data && (data.error || data.message)) || '';
    throw new ErrorServidor(/SESSIO_CADUCADA/.test(m) ? 'SESSIO' : /SENSE_PERMIS/.test(m) ? 'PERMIS' : (data && data.error) || ('HTTP'+r.status));
  }
  return data;
}
const rpc = (fn, args)=> servidor('/rest/v1/rpc/'+fn, args);

/* ---------- desar i sincronitzar ----------
   SNAP és la darrera versió coneguda del servidor. Només s'envia el que ha canviat respecte a SNAP,
   juntament amb aquesta versió de base: el servidor combina els canvis camp per camp, de manera que
   si algú altre ha editat la mateixa obra (o la mateixa llista) mentrestant, no se li trepitgen els canvis.
   Les dades es tornen a demanar al servidor en tornar a l'app i cada minut, si no hi ha res obert ni pendent. */
const SNAP = {obres: new Map(), cat: new Map()};
function snapshot(){
  SNAP.obres = new Map(STATE.pieces.map(o=> [o.id, JSON.stringify(o)]));
  SNAP.cat = new Map(Object.entries(STATE.catalogs).map(([k,v])=> [k, JSON.stringify(v)]));
}
function pendingChanges(){
  const obres = [], bases = {}, esborra = [], catalegs = {}, catalegsBase = {};
  const cur = new Map(STATE.pieces.map(o=> [o.id, JSON.stringify(o)]));
  cur.forEach((j, id)=>{ const b = SNAP.obres.get(id); if(b!==j){ obres.push(JSON.parse(j)); bases[id] = b ? JSON.parse(b) : null; } });
  SNAP.obres.forEach((_, id)=>{ if(!cur.has(id)) esborra.push(id); });
  Object.entries(STATE.catalogs).forEach(([k,v])=>{ const b = SNAP.cat.get(k); if(b!==JSON.stringify(v)){ catalegs[k] = JSON.parse(JSON.stringify(v)); catalegsBase[k] = b ? JSON.parse(b) : null; } });
  return (obres.length || esborra.length || Object.keys(catalegs).length) ? {obres, bases, esborra, catalegs, catalegsBase} : null;
}
const jstr = x => JSON.stringify(x);
/* versió local = versió del servidor + el que s'ha tocat aquí després d'enviar */
function rebaseObra(server, sent, local){
  const out = {...server};
  new Set([...Object.keys(sent), ...Object.keys(local)]).forEach(k=>{
    if(jstr(local[k])!==jstr(sent[k])){ if(k in local) out[k] = local[k]; else delete out[k]; }
  });
  return out;
}
function rebaseLlista(server, sent, local){
  const S = new Set(sent.map(jstr)), L = new Set(local.map(jstr));
  const out = server.filter(x=> !(S.has(jstr(x)) && !L.has(jstr(x))));
  const O = new Set(out.map(jstr));
  local.forEach(x=>{ if(!S.has(jstr(x)) && !O.has(jstr(x))) out.push(x); });
  return out;
}
function replaceInPlace(obj, data){ Object.keys(obj).forEach(k=> delete obj[k]); Object.assign(obj, data); }
function applySaveResult(canvis, r){
  r = r || {};
  let canviat = false;
  const sentObres = new Map(canvis.obres.map(o=> [o.id, o]));
  const locals = new Map(STATE.pieces.map(o=> [o.id, o]));
  (r.obres||[]).forEach(m=>{
    SNAP.obres.set(m.id, jstr(m));
    const loc = locals.get(m.id), sent = sentObres.get(m.id);
    if(loc && sent){
      const nou = rebaseObra(m, sent, loc);
      if(jstr(nou)!==jstr(loc)){ replaceInPlace(loc, nou); canviat = true; }
    }
  });
  canvis.esborra.forEach(id=> SNAP.obres.delete(id));
  const perdudes = (r.perdudes||[]).map(id=>{
    SNAP.obres.delete(id);
    const loc = locals.get(id);
    STATE.pieces = STATE.pieces.filter(x=> x.id!==id); canviat = true;
    return loc ? loc.title : id;
  });
  Object.entries(r.catalegs||{}).forEach(([k, m])=>{
    SNAP.cat.set(k, jstr(m));
    const local = STATE.catalogs[k] || [], sent = canvis.catalegs[k] || local;
    const nou = rebaseLlista(m, sent, local);
    if(jstr(nou)!==jstr(local)){
      const pool = new Map(local.map(x=> [jstr(x), x]));   // conserva els mateixos objectes (p. ex. un projecte obert)
      STATE.catalogs[k] = nou.map(x=> pool.get(jstr(x)) || x); canviat = true;
    }
  });
  if(canviat && !document.body.classList.contains('locked')){ refreshViews(); if(STATE.screen==='config') renderConfig(); }
  const avisos = [];
  if(perdudes.length) avisos.push(`Algú altre havia eliminat «${perdudes.join('», «')}»`);
  if((r.conflictes||[]).length) avisos.push(`Algú altre també havia editat «${r.conflictes.map(c=>c.title).join('», «')}». S'han combinat els canvis`);
  return avisos.join('. ');
}
let saveTimer=null, saving=false, retryDelay=0;
function persist(delay){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if(saving){ persist(); return; }
    const canvis = pendingChanges(); if(!canvis || !STATE.session) return;
    saving = true;
    try{
      const r = await rpc('desa_canvis', {p_token: STATE.session.token, p: canvis});
      const avis = applySaveResult(canvis, r);
      showSavePill(avis || 'Desat'); retryDelay = 0;
    }catch(e){
      if(e.codi==='SESSIO'){ sessionExpired(); }
      else if(e.codi==='PERMIS'){ showSavePill('No tens permís per fer aquest canvi'); await loadData(); }
      else {
        retryDelay = Math.min(retryDelay ? retryDelay*2 : 3000, 30000);
        showSavePill('Sense connexió. Els canvis es desaran quan torni.');
        persist(retryDelay);
      }
    }finally{ saving = false; }
    if(!retryDelay && pendingChanges()) persist();   // canvis fets mentre es desava
  }, delay==null ? 300 : delay);
}
async function loadData(){
  const d = await rpc('carrega', {p_token: STATE.session.token});
  STATE.pieces = d.pieces || [];
  STATE.catalogs = Object.assign({estils:[], autors:[], arranjadors:[], parts:[], instrumentsExterns:[], projectes:[], ubicacions:[]}, d.catalogs || {});
  snapshot();
  refreshViews();
  if(STATE.screen==='config') renderConfig();
  return d.usuari;
}
/* torna a demanar les dades si no hi ha cap fitxa oberta ni canvis per desar */
let refreshing = false;
async function refreshFromServer(){
  const ocupat = ()=> !STATE.session || saving || refreshing || !!pendingChanges() || document.body.classList.contains('locked') || document.body.classList.contains('auth');
  if(ocupat()) return;
  refreshing = true;
  let d;
  try{ d = await rpc('carrega', {p_token: STATE.session.token}); }
  catch(e){ if(e.codi==='SESSIO') sessionExpired(); return; }
  finally{ refreshing = false; }
  if(ocupat()) return;
  const catalogs = Object.assign({estils:[], autors:[], arranjadors:[], parts:[], instrumentsExterns:[], projectes:[], ubicacions:[]}, d.catalogs || {});
  const pieces = d.pieces || [];
  const igualObres = pieces.length===SNAP.obres.size && pieces.every(o=> SNAP.obres.get(o.id)===jstr(o));
  const igualCat = Object.entries(catalogs).every(([k,v])=> SNAP.cat.get(k)===jstr(v));
  if(d.usuari && STATE.user && ROLE_OF[d.usuari.rol] && ROLE_OF[d.usuari.rol]!==STATE.role) setRole(ROLE_OF[d.usuari.rol]);
  if(igualObres && igualCat) return;
  STATE.pieces = pieces; STATE.catalogs = catalogs;
  snapshot();
  refreshViews();
  if(STATE.screen==='config' && !igualCat) renderConfig();
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible') refreshFromServer();
  else if(pendingChanges()) persist(0);   // en sortir de l'app, desa de seguida
});
setInterval(()=>{ if(document.visibilityState==='visible') refreshFromServer(); }, 60000);

/* ================= USUARIS I SESSIÓ ================= */
/* Els usuaris i les contrasenyes són els de l'app d'assistència. La funció de servidor «entrar»
   els comprova allà i hi canvia la contrasenya el primer cop; el rol es recalcula a cada accés:
   músic o cap de secció → Consulta (consultar i registrar)
   director, junta o administració → Edició (editar, Per revisar i Configuració) */
const LS_SESSION = 'arxiu:sessio';
const ROLE_OF = {edicio:'gestio', consulta:'musica'};
function loadSession(){
  for(const st of [localStorage, sessionStorage]){
    try{ const x = JSON.parse(st.getItem(LS_SESSION)||'null'); if(x && x.token && new Date(x.caduca) > new Date()) return x; }catch(e){}
  }
  return null;
}
function saveSession(x, keep){
  try{ localStorage.removeItem(LS_SESSION); sessionStorage.removeItem(LS_SESSION); }catch(e){}
  if(x){ try{ (keep ? localStorage : sessionStorage).setItem(LS_SESSION, JSON.stringify(x)); }catch(e){} }
}
function setRole(r){
  STATE.role = r;
  document.getElementById('navConfig').classList.toggle('hidden', r!=='gestio');
  document.querySelector('#subviewCtl [data-sub=pendents]').classList.toggle('hidden', r!=='gestio');
  if(STATE.screen==='config' && r!=='gestio') setScreen('consultar');
  if(STATE.subview==='pendents' && r!=='gestio') document.querySelector('#subviewCtl [data-sub=biblioteca]').click();
}
function userLine(){ return STATE.user ? esc(STATE.user.name) : ''; }
async function startSession(ses){
  STATE.session = ses;
  showLoading();
  let u;
  try{ u = await loadData(); }
  catch(e){
    if(e.codi==='SESSIO'){ saveSession(null); STATE.session = null; showLogin('La sessió ha caducat. Torna a entrar.'); }
    else showLogin('No s\'ha pogut connectar amb l\'arxiu. Comprova la connexió i torna-ho a provar.');
    return;
  }
  STATE.user = {id: u.id, name: u.nom};
  document.body.classList.remove('auth');
  const lg = document.getElementById('loginScreen'); if(lg) lg.remove();
  setRole(ROLE_OF[u.rol] || 'musica');
  setScreen('consultar');
  document.querySelector('#subviewCtl [data-sub=biblioteca]').click();
  STATE.filters.q = ''; document.getElementById('searchInput').value = '';
  renderList();
}
function sessionExpired(){
  saveSession(null); STATE.session = null; STATE.user = null;
  document.querySelectorAll('.sheet-bg').forEach(x=> x.remove()); document.body.classList.remove('locked');
  showLogin('La sessió ha caducat. Torna a entrar.');
}

const ERR_ENTRAR = {credencials:'Usuari o contrasenya incorrectes', desactivat:'Aquest usuari està desactivat',
  curta:'La contrasenya nova ha de tenir almenys 4 caràcters', igual:'La contrasenya nova ha de ser diferent de l\'actual'};
async function entrar(body){
  try{ return {ok: await servidor('/functions/v1/entrar', body)}; }
  catch(e){ return {err: ERR_ENTRAR[e.codi] || 'No s\'ha pogut connectar. Comprova la connexió i torna-ho a provar.'}; }
}
function showLogin(err){
  const el = authScreen();
  el.innerHTML = `<div class="login">${AUTH_HEAD}
    <form id="loginf" autocomplete="on">
      ${err ? `<div class="err">${esc(err)}</div>` : ''}

    </form>
    <p class="login-foot">Si no recordes les credencials,<br>parla amb la junta.</p></div>`;
  bindEyes(el);
  el.querySelector('#loginf').addEventListener('submit', async e=>{
    e.preventDefault();
    const usuari = el.querySelector('#lg-user').value.trim().toLowerCase(), contrasenya = el.querySelector('#lg-pass').value;
    const mantenir = el.querySelector('#lg-keep').checked;
    if(!usuari || !contrasenya){ showLogin('Escriu l\'usuari i la contrasenya'); return; }
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Connectant…';
    const r = await entrar({usuari, contrasenya, mantenir});
    if(r.err){ showLogin(r.err); return; }
    if(r.ok.canvi_obligatori){ showFirstPassword({usuari, contrasenya, mantenir, nom: r.ok.nom}); return; }
    const ses = {token: r.ok.token, caduca: r.ok.caduca};
    saveSession(ses, mantenir); startSession(ses);
  });
  setTimeout(()=>{ const i = el.querySelector('#lg-user'); if(i && !('ontouchstart' in window)) i.focus(); }, 50);
}
/* primer accés: cal triar una contrasenya nova (val també per a l'app d'assistència) */
function showFirstPassword(c, err){
  const el = authScreen();
  el.innerHTML = `<div class="login">${AUTH_HEAD}
    <form id="pwf" autocomplete="off">
      <div class="help-intro" style="margin:0">Hola${c.nom?', '+esc(c.nom.split(' ')[0]):''}! És el teu primer accés. Tria una contrasenya nova per continuar. També la faràs servir a l'app d'assistència.</div>
      ${err ? `<div class="err">${esc(err)}</div>` : ''}
      ${passFieldHtml('pw-new','Contrasenya nova','new-password')}
      ${passFieldHtml('pw-new2','Repeteix la contrasenya nova','new-password')}
      <button class="btn primary" type="submit" style="width:100%">Desa i entra</button>
      <button class="btn ghost" type="button" id="pw-back" style="width:100%">Torna enrere</button>
    </form></div>`;
  bindEyes(el);
  el.querySelector('#pw-back').addEventListener('click', ()=> showLogin());
  el.querySelector('#pwf').addEventListener('submit', async e=>{
    e.preventDefault();
    const nova = el.querySelector('#pw-new').value, nova2 = el.querySelector('#pw-new2').value;
    if(!nova || nova.length < 4){ showFirstPassword(c, ERR_ENTRAR.curta); return; }
    if(nova !== nova2){ showFirstPassword(c, 'Les contrasenyes noves no coincideixen'); return; }
    if(nova === c.contrasenya){ showFirstPassword(c, ERR_ENTRAR.igual); return; }
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Desant…';
    const r = await entrar({usuari: c.usuari, contrasenya: c.contrasenya, nova, mantenir: c.mantenir});
    if(r.err){ showFirstPassword(c, r.err); return; }
    const ses = {token: r.ok.token, caduca: r.ok.caduca};
    saveSession(ses, c.mantenir); startSession(ses);
  });
}

function openProjecteSheet(pid){
  const canEdit = STATE.role==='gestio';
  const bg = document.createElement('div'); bg.className='sheet-bg';
  document.body.appendChild(bg); document.body.classList.add('locked');
  let q = '', editing = false, toAdd = new Set(), toRm = new Set();
  const dirty = ()=> toAdd.size || toRm.size;
  function close(){
    if(editing && dirty() && !confirm('Hi ha canvis al repertori sense desar. Vols descartar-los?')) return;
    STATE.sheetRefresh = null; document.body.removeChild(bg); document.body.classList.remove('locked'); refreshViews();
  }
  bg.addEventListener('click', e=>{ if(e.target===bg) close(); });
  function save(){
    const pr = projById(pid);
    toAdd.forEach(id=>{ const p = STATE.pieces.find(x=>x.id===id); if(!p) return; p.aparicions = p.aparicions||[];
      if(!p.aparicions.some(a=>a.projecteId===pid)) p.aparicions.push({projecteId:pid, projecte:pr.name, any:pr.year||null, seccio:null, fitxers:0, estatParts:p.estatParts}); });
    toRm.forEach(id=>{ const p = STATE.pieces.find(x=>x.id===id); if(p) p.aparicions = (p.aparicions||[]).filter(a=>a.projecteId!==pid); });
    if(dirty()){ persist(); showSavePill('Repertori desat'); }
    toAdd = new Set(); toRm = new Set(); editing = false; q = ''; render();
  }
  function render(){
    const pr = projById(pid); if(!pr){ close(); return; }
    const obres = [...obresDe(pid).filter(p=> !toRm.has(p.id)), ...[...toAdd].map(id=> STATE.pieces.find(x=>x.id===id)).filter(Boolean)]
      .sort((a,b)=>a.title.localeCompare(b.title,'ca'));
    const nq = norm(q);
    const results = nq.length>=2 ? STATE.pieces.filter(p=> !obres.includes(p) && searchText(p).includes(nq)).sort((a,b)=>a.title.localeCompare(b.title,'ca')).slice(0,12) : [];
    bg.innerHTML = `<div class="sheet">
      <div class="sheet-head"><div class="htxt"><h2 style="display:block">${esc(pr.name)}</h2><div class="hsub">${pr.year||'Sense any'}${editing?' · Editant':''}</div></div>
        <button class="sheet-close" id="pjClose" aria-label="Tanca"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
      <div class="sheet-body">
        ${!editing && pr.link?`<a class="btn primary" style="text-decoration:none;display:flex;margin-bottom:12px" href="${esc(pr.link)}" target="_blank" rel="noopener">Obre la carpeta a Box</a>`:''}
        ${editing?`<button class="btn" id="pjData" style="width:100%;margin-bottom:12px">Edita el nom, l'any o l'enllaç</button>
          <div class="search" style="margin-bottom:8px">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="pjAdd" type="text" placeholder="Afegeix una obra al repertori…" autocomplete="off" value="${esc(q)}">
          </div>
          ${nq.length>=2?`<div class="pickl">${results.map(p=>`<button class="pickrow" data-add="${p.id}"><span class="main"><span class="title">${esc(p.title)}</span><span class="authors">${esc([p.composer,p.arranger?('Arr. '+p.arranger):''].filter(Boolean).join(' · '))}</span></span><span class="pickplus">+</span></button>`).join('') || '<p class="hint" style="margin:4px 4px 8px">Cap obra coincideix, o ja és al repertori.</p>'}</div>`:''}`:''}
        <h3 class="sec">Repertori <span class="seccnt">${obres.length}</span></h3>
        <div class="list">${obres.map(o=>{ const st=obraState(o); return `<div class="projrow2">
          <button class="rowmain" data-oid="${o.id}">
            <span class="main"><span class="title" style="display:block;font-size:15px">${esc(o.title)}</span>
            <span class="authors" style="display:block">${esc([o.composer,o.arranger?('Arr. '+o.arranger):''].filter(Boolean).join(' · '))}</span></span>
            <span class="tagpill ${st.cls}"><span class="tdot"></span>${esc(st.label)}</span>
          </button>
          ${editing?`<button class="iconbtn danger" data-rm="${o.id}" aria-label="Treu del repertori"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 12h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>`:''}
        </div>`; }).join('') || '<p class="hint" style="padding:8px 4px">Encara no hi ha cap obra al repertori d\'aquest projecte.</p>'}</div>
        ${canEdit ? `<div class="btnbar">${editing
          ? `<button class="btn" id="pjCancel">Cancel·la</button><button class="btn primary" id="pjSave">Desa</button>`
          : `<button class="btn primary" id="pjEdit">Edita</button>`}</div>` : ''}
      </div>
    </div>`;
    bg.querySelector('#pjClose').addEventListener('click', close);

    on('#pjEdit', ()=>{ editing = true; render(); });
    on('#pjCancel', ()=>{ toAdd = new Set(); toRm = new Set(); editing = false; q = ''; render(); });
    on('#pjSave', save);

function projectYears(){ return [...new Set(STATE.catalogs.projectes.map(p=>p.year).filter(Boolean))].sort((a,b)=>b-a); }
function projById(id){ return STATE.catalogs.projectes.find(p=>p.id===id); }
function projLabel(p){
  const n = p.aparicions ? p.aparicions.length : 0;
  if(n===0) return 'Sense projecte';
  if(n===1) return p.aparicions[0].projecte + (p.aparicions[0].any? ' · '+p.aparicions[0].any : '');
  return n+' projectes';
}

/* text on es busca: totes les metadades de l'obra. Cada paraula de la cerca ha d'aparèixer en algun camp. */
function searchText(p){
  const st = obraState(p), n = obraNotes(p);
  const fields = [
    p.title, p.titolBox, p.composer, p.arranger, p.de, p.estil, p.obs,
    ...(p.aparicions||[]).map(a=>{ const pr = projById(a.projecteId); return [pr?pr.name:a.projecte, pr?pr.year:a.any, a.seccio].join(' '); }),
    ...(p.specials||[]), ...(p.partsDetectades||[]), ...(p.faltenInventari||[]), ...(p.partsNoDetectades||[]),
    ...(p.ubicacioFisica||[]), isDigital(p)?'box digital':'', isFisic(p)?'fisic paper':'', (isFisic(p)&&!isDigital(p))?'nomes en fisic':'',
    st.label, st.extra, needsReview(p)?'cal revisar':'', p.original===true?'original comprada':'',
    ...n.revisar, ...n.partitura, ...(p.revisioNota||[]),
  ];
  return norm(fields.filter(Boolean).join(' · '));
}
function matches(p){
  const f = STATE.filters;
  if(f.q){
    const hay = searchText(p);
    if(!norm(f.q).split(/\s+/).filter(Boolean).every(w=> hay.includes(w))) return false;
  }
  if(f.estil && p.estil!==f.estil) return false;
  if(f.estat && facets(p).P!==f.estat) return false;
  if(f.general && facets(p).G!==f.general) return false;
  if(f.ubicacio==='fisic' && !isFisic(p)) return false;
  if(f.ubicacio==='nomesfisic' && !(isFisic(p) && !isDigital(p))) return false;
  if(f.ubicacio==='digital' && !isDigital(p)) return false;
  if(f.lloc && !(p.ubicacioFisica||[]).includes(f.lloc)) return false;
  if(f.original && p.original!==(f.original==='si')) return false;
  if(f.instrExtern && !(p.specials||[]).includes(f.instrExtern)) return false;
  return true;
}

function renderList(){
  const filtered = STATE.pieces.filter(p=>matches(p)).sort((a,b)=>a.title.localeCompare(b.title,'ca'));
  document.getElementById('resultCount').textContent = filtered.length===STATE.pieces.length ? `${filtered.length} obres` : `${filtered.length} de ${STATE.pieces.length} obres`;

  list.classList.remove('hidden'); empty.classList.add('hidden');

/* llista agrupada per inicial (les dues vistes). Compacta: una fila per obra; el color del marge és l'estat que predomina */
function groupedHtml(items, compact){
  let letter = null, out = '';
  items.forEach(p=>{
    const l = (norm(p.title).match(/[a-z0-9]/)||['#'])[0].toUpperCase();
    const L = /[0-9]/.test(l) ? '#' : l;
    if(L!==letter){ if(letter!==null) out += '</div>'; out += `<h3 class="sec letter" id="letter-${L}">${L}</h3><div class="${compact?'crows':'cards'}">`; letter = L; }
    if(!compact){ out += obraCardHtml(p); return; }
    const st = obraState(p);
    const who = p.composer || (p.arranger ? 'Arr. '+p.arranger : '');
    out += `<div class="crow ${st.cls}" data-id="${p.id}" role="button" tabindex="0" title="${esc(stateText(st))}">
      <span class="ctext"><span class="ctitle">${esc(p.title)}</span>${who?`<span class="cwho">${esc(who)}</span>`:''}</span>
      ${needsReview(p)?'<span class="cflag" title="Cal revisar">!</span>':''}
      ${ICO_CHEVRON}
    </div>`;
  });
  return out + (letter!==null ? '</div>' : '');
}

function renderAzIndex(){

  const letters = show ? [...document.querySelectorAll('#list h3.letter')].map(h=>h.textContent) : [];

  const pick = e=>{ const t = e.touches ? e.touches[0] : e; const b = document.elementFromPoint(t.clientX, t.clientY); if(b && b.dataset && b.dataset.l) go(b.dataset.l); };
  el.onclick = pick; el.ontouchstart = e=>{ e.preventDefault(); pick(e); }; el.ontouchmove = e=>{ e.preventDefault(); pick(e); };
}
/* l'índex ocupa l'espai lliure entre la barra d'eines de la llista (o la capçalera, en fer scroll) i la barra inferior */
function layoutAzIndex(){
  const el = document.getElementById('azindex'); if(!el) return;
  const n = el.children.length;
  const top = Math.max(document.querySelector('.top').getBoundingClientRect().bottom, document.querySelector('#subBiblioteca .countline').getBoundingClientRect().bottom) + 8;
  const bottom = document.querySelector('.nav').getBoundingClientRect().top - 8;
  const h = Math.max(8, Math.min(18, (bottom - top) / n));
  el.style.top = (top + (bottom - top) / 2) + 'px';
  [...el.children].forEach(b=>{ b.style.height = h+'px'; b.style.fontSize = Math.min(11, h - 1)+'px'; });
}

/* ================= COMBOBOX / MULTISELECT COMPONENTS ================= */
function positionPanel(panel, input){
  const r = input.getBoundingClientRect();
  const spaceBelow = window.innerHeight - r.bottom;
  const openUp = spaceBelow < 180 && r.top > spaceBelow;
  panel.style.position = 'fixed';
  panel.style.left = r.left+'px';
  panel.style.width = r.width+'px';
  if(openUp){
    panel.style.bottom = (window.innerHeight - r.top + 6)+'px';
    panel.style.top = 'auto';
  } else {
    panel.style.top = (r.bottom + 6)+'px';
    panel.style.bottom = 'auto';
  }
}
function attachPanelDismiss(closeFn){
  const onScroll = ()=>{ closeFn(); document.removeEventListener('scroll', onScroll, true); window.removeEventListener('resize', onScroll); };
  document.addEventListener('scroll', onScroll, true);
  window.addEventListener('resize', onScroll);
  return onScroll;
}
function makeCombobox(container, {items, value, onChange, placeholder, allowCreate=true}){
  container.classList.add('combo');
  container.innerHTML = `<input class="combo-input" type="text" placeholder="${esc(placeholder||'')}" autocomplete="off" value="${esc(value||'')}">
    <svg class="combo-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const input = container.querySelector('input');
  let panel = null, dismiss = null;
  function closePanel(){ if(panel){ panel.remove(); panel=null; } if(dismiss){ document.removeEventListener('scroll',dismiss,true); window.removeEventListener('resize',dismiss); dismiss=null; } }
  function openPanel(){
    closePanel();
    const q = norm(input.value);
    const filtered = items.filter(it=> norm(it).includes(q));
    panel = document.createElement('div'); panel.className='combo-panel';
    let html = '';
    filtered.slice(0,60).forEach(it=> html += `<div class="combo-opt" data-v="${esc(it)}">${esc(it)}</div>`);
    if(allowCreate && input.value.trim() && !items.some(it=> norm(it)===q)){
      html += `<div class="combo-opt create" data-create="1">+ Afegeix "${esc(input.value.trim())}"</div>`;
    }
    if(!html) html = `<div class="combo-empty">Sense resultats</div>`;
    panel.innerHTML = html;
    document.body.appendChild(panel);
    positionPanel(panel, input);
    dismiss = attachPanelDismiss(closePanel);
    panel.querySelectorAll('.combo-opt[data-v]').forEach(o=> o.addEventListener('mousedown', e=>{ e.preventDefault(); input.value=o.dataset.v; onChange(o.dataset.v); closePanel(); }));
    const c = panel.querySelector('.combo-opt[data-create]');
    if(c) c.addEventListener('mousedown', e=>{ e.preventDefault(); const v=input.value.trim(); if(!items.includes(v)) items.push(v); onChange(v); closePanel(); });
  }
  input.addEventListener('focus', openPanel);
  input.addEventListener('input', ()=>{ onChange(input.value.trim()); openPanel(); });
  input.addEventListener('blur', ()=> setTimeout(closePanel,150));
}
