/* ---- motor: pinta, delega els clics i les entrades, i munta els desplegables ---- */
function mountForm(root, d, secsFn, ctx){
  const sc = ctx.scroller;
  const getY = ()=> sc===window ? window.scrollY : sc.scrollTop;
  const setY = y=>{ if(sc===window) window.scrollTo(0,y); else sc.scrollTop = y; };
  function render(){
    const y = getY();
    root.innerHTML = secsFn(d);
    mountCombos();
    setY(y);
    if(d.adding){ const i = root.querySelector(d.adding==='estil' ? '[data-in=estilNew]' : '[data-in=extraNew]'); if(i) i.focus({preventScroll:true}); }
    ctx.onChange();
  }
  function mountCombos(){
    const cb = (id, key, items, ph, ref)=>{
      const box = root.querySelector('#'+id); if(!box) return;
      makeCombobox(box, {items, value:d[key], placeholder:ph, onChange:v=>{
        d[key] = v;
        if(key==='autor' && v){ const f = box.closest('.field'); if(f) f.classList.remove('err'); }
        if(ctx.onPerson) ctx.onPerson(key, v);
        ctx.onChange();
      }});
    };
    cb('cb_autor','autor',STATE.catalogs.autors,'Cerca o escriu un compositor');
    cb('cb_arranjador','arranjador',STATE.catalogs.arranjadors,'Cerca o escriu un arranjador');
    const ms = root.querySelector('#ms_projecte');
    if(ms){
      const lab = p=> p.name+(p.year?' ('+p.year+')':'');
      const items = STATE.catalogs.projectes.slice().sort((a,b)=>(b.year||0)-(a.year||0)).map(lab);
      const cur = d.projecteIds.map(pid=>{ const pp=STATE.catalogs.projectes.find(x=>x.id===pid); return pp?lab(pp):null; }).filter(Boolean);
      makeMultiSelect(ms, {items, values:cur, placeholder:'Cerca un projecte', allowCreate:false, onChange:v=>{
        d.projecteIds = v.map(l=>{ const f = STATE.catalogs.projectes.find(pp=> lab(pp)===l); return f ? f.id : null; }).filter(Boolean);
      }});
    }
  }
  function addNew(listKey, newKey, catalog, selectFn){
    const raw = (d[newKey]||'').trim(); if(!raw) { d.adding = null; return; }
    const found = [...catalog, ...d[listKey]].find(x=> norm(x)===norm(raw));
    const val = found || raw;
    if(!found) d[listKey].push(val);
    selectFn(val); d[newKey] = ''; d.adding = null;
  }
  function act(a, v, w){
    const m = d.missing;
    switch(a){
      case 'orig': d.original = d.original===(v==='si') ? null : (v==='si'); break;
      case 'estil': d.estil = d.estil===v ? '' : v; break;
      case 'estilAdd': d.adding = d.adding==='estil' ? null : 'estil'; break;
      case 'estilOk': addNew('estilNous','estilNew',STATE.catalogs.estils, val=>{ d.estil = val; }); break;
      case 'gen': d.general = v; d.err.gen = false; afterAnswer(d); break;
      case 'par': d.estatParts = v; d.err.par = false; afterAnswer(d); break;
      case 'totes': m.totes = !m.totes; m.touched = true; break;
      case 'miss': m.sel = m.sel.includes(v) ? m.sel.filter(x=>x!==v) : [...m.sel, v]; m.touched = true; break;
      case 'grp': d.openGrp = d.openGrp===v ? null : v; break;
      case 'extra': d.instrExterns = d.instrExterns.includes(v) ? d.instrExterns.filter(x=>x!==v) : [...d.instrExterns, v]; break;
      case 'extraAdd': d.adding = d.adding==='extra' ? null : 'extra'; break;
      case 'extraOk': addNew('extraNous','extraNew',STATE.catalogs.instrumentsExterns, val=>{ if(!d.instrExterns.includes(val)) d.instrExterns.push(val); }); break;
      case 'place': {
        const k = w==='u' ? 'uPlaces' : w==='g' ? 'gPlaces' : 'pPlaces';
        d[k] = d[k].includes(v) ? d[k].filter(x=>x!==v) : [...d[k], v];
        d.err[w] = false; break; }
      case 'diff':
        if(d.same){ d.same = false; d.gPlaces = d.uPlaces.slice(); d.pPlaces = d.uPlaces.slice(); }
        else { d.same = true; d.uPlaces = (applG(d) ? d.gPlaces : d.pPlaces).slice(); }
        break;
      case 'lloc': d.llocs = d.llocs.includes(v) ? d.llocs.filter(x=>x!==v) : [...d.llocs, v]; break;
    }
    render();
  }
  root.addEventListener('click', e=>{
    const b = e.target.closest('[data-a]'); if(!b || !root.contains(b)) return;
    act(b.dataset.a, b.dataset.v, b.dataset.w);
  });
  root.addEventListener('input', e=>{
    const t = e.target, k = t.dataset && t.dataset.in; if(!k) return;
    if(k==='nom'){ d.nom = t.value; t.closest('.field').classList.remove('err'); }
    else if(k==='altres'){ d.missing.altres = t.value; d.missing.touched = true; }
    else if(k==='coment') d.comentaris = t.value;
    else if(k==='estilNew') d.estilNew = t.value;
    else if(k==='extraNew') d.extraNew = t.value;
    ctx.onChange();
  });
  root.addEventListener('keydown', e=>{
    if(e.key!=='Enter') return;
    const k = e.target.dataset && e.target.dataset.in;
    if(k==='estilNew'){ e.preventDefault(); act('estilOk'); }
    else if(k==='extraNew'){ e.preventDefault(); act('extraOk'); }
  });
  render();
  return { render, scrollToError(){ const x = root.querySelector('.err'); if(x) x.scrollIntoView({behavior:'smooth', block:'center'}); } };
}

/* ---- validació ---- */
function vObra(d){ d.err = {...d.err, nom:!d.nom.trim(), autor:!d.autor.trim()}; return !d.err.nom && !d.err.autor; }
function vParts(d){ d.err = {...d.err, gen:!d.general, par:!d.estatParts}; return !d.err.gen && !d.err.par; }
function vUbic(d){
  plc(d);
  const e = {u:false, g:false, p:false};
  if(d.same){ e.u = (applG(d)||applP(d)) && !d.uPlaces.length; }
  else { e.g = applG(d) && !d.gPlaces.length; e.p = applP(d) && !d.pPlaces.length; }
  d.err = {...d.err, ...e};
  return !e.u && !e.g && !e.p;
}
/* aplica els valors nous als catàlegs (estils, autors, instruments) abans de desar */
function desaCatalegs(d){
  const C = STATE.catalogs;
  if(d.autor && !C.autors.includes(d.autor)) C.autors.push(d.autor);
  if(d.arranjador && !C.arranjadors.includes(d.arranjador)) C.arranjadors.push(d.arranjador);
  if(d.estil && !C.estils.includes(d.estil)) C.estils.push(d.estil);
  d.instrExterns.forEach(i=>{ if(!C.instrumentsExterns.includes(i)) C.instrumentsExterns.push(i); });
}
/* resum: la mateixa targeta que es veurà a l'arxiu */
function fillResum(d, base){
  const box = document.getElementById('resum'); if(!box) return;
  const tmp = JSON.parse(JSON.stringify({ ...(base||{}), title:d.nom.trim()||'Sense títol', composer:d.autor, arranger:d.arranjador, estil:d.estil,
    general:d.general, estatParts:d.estatParts, specials:d.instrExterns, ...(missingFields(d)||{}), ...placeOfDraft(d),
    ...(base ? {} : {autoriaConflicte:false, pendentAcceptacio: STATE.role!=='gestio'}) }));
  if(base && d.revisats.size) marcaRevisada(tmp, [...d.revisats]);
  box.innerHTML = obraCardHtml(tmp, {preview:true});
  const sub = document.getElementById('resumSub');
  if(sub && !base && STATE.role!=='gestio') sub.textContent = "Així es veurà l'obra. Un gestor haurà d'acceptar el registre.";
}


/* ================= EDITAR OBRA: llista de files; cada fila s'obre en una fulla amb una sola pregunta ================= */
function openEditPiece(id, opts={}){
  const piece = STATE.pieces.find(x=>x.id===id);
  if(!piece) return;
  const d = newDraft(piece);
  const revItems = revisioItems(piece);
  const C = STATE.catalogs;
  let showErr = false;
  const el = document.createElement('div'); el.className = 'page pnav';
  document.body.appendChild(el); document.body.classList.add('locked');
  const projLab = p=> p.name+(p.year?' ('+p.year+')':'');

  /* ---- ubicació: en mode «mateix lloc» la general i les parts comparteixen la llista uPlaces ---- */
  const gKey = ()=> d.same ? 'uPlaces' : 'gPlaces';
  const pKey = ()=> (d.same || !applG(d)) ? 'uPlaces' : 'pPlaces';
  const togglePlace = (w, v)=>{ const k = w==='g' ? gKey() : pKey(); d[k] = d[k].includes(v) ? d[k].filter(x=>x!==v) : [...d[k], v]; };
  const setSame = on=>{
    if(on){ d.uPlaces = (applG(d) ? d.gPlaces : d.pPlaces).slice(); d.same = true; }
    else { d.same = false; d.gPlaces = d.uPlaces.slice(); d.pPlaces = d.uPlaces.slice(); }
  };
  const needsLoc = ()=> applG(d) || applP(d);
  const pendRev = ()=> revItems.filter(it=> !d.revisats.has(it.key)).length;
  const needArmari = ()=> needsLoc() && placeOfDraft(d).enPaper && (C.ubicacions||[]).length>1;

  /* ---- text de cada fila ---- */
  const where = arr=> arr.length ? ' · '+placesText(arr) : '';
  function gVal(){
    if(!d.general) return ['Cal indicar-ho','bad'];
    if(d.general==='no') return ['No','bad'];
    const arr = d[gKey()];
    if(showErr && !arr.length) return ['Cal indicar on és','bad'];
    return [(d.general==='si'?'Sí':'No ho sé') + where(arr), d.general==='si'?'':'warn'];
  }
  function pVal(){
    if(!d.estatParts) return ['Cal indicar-ho','bad'];
    if(d.estatParts==='Falten parts'){ const m = d.missing, l = missingList(m); return [m.totes ? 'Falten totes' : l.length ? 'Falten '+l.join(', ') : 'Falten', 'bad']; }
    const arr = d[pKey()];
    if(showErr && !arr.length) return ['Cal indicar on són','bad'];
    return [(d.estatParts==='Completa'?'Completes':'No ho sé') + where(arr), d.estatParts==='Completa'?'':'warn'];
  }
  const row = (key, label, val, cls)=> `<button type="button" class="rw" data-row="${key}"><span class="rl">${label}</span><span class="rv ${cls||''}">${esc(val)}</span><svg class="chv" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>`;
  const grp = (t, rows)=> `<div class="gt">${t}</div><div class="g2">${rows.join('')}</div>`;

  function renderMain(){
    const y = el.scrollTop;
    const tmp = JSON.parse(JSON.stringify({...piece, title:d.nom.trim()||piece.title, composer:d.autor, arranger:d.arranjador, estil:d.estil, general:d.general, estatParts:d.estatParts,
      specials:d.instrExterns, ...(missingFields(d)||{}), ...placeOfDraft(d)}));
    marcaRevisada(tmp, [...d.revisats]);
    const st = obraState(tmp);
    const sub = st.detail && st.detail!=='totes' ? st.detail : st.extra;
    const [gv, gc] = gVal(), [pv, pc] = pVal();
    const need = (v,k)=> showErr && !v.trim() ? ['Cal indicar-ho','bad'] : [v||'—',''];
    const [t1,c1] = need(d.nom,'nom'), [t2,c2] = need(d.autor,'autor');
    el.innerHTML = `<div class="phead"><div class="phead-in"><div class="ptitle" style="margin-top:6px"><h1>Edita l'obra</h1></div><div class="pwho">${esc(piece.title)}</div></div></div>
      <div class="pbody">
        <div class="stat ${st.cls}"><i></i><div><b>${esc(st.label)}</b>${sub?`<span>${esc(sub)}</span>`:''}</div></div>
        ${revItems.length ? `<div class="g2" style="margin-top:14px">${row('rev','<b style="color:var(--warn-t)">Cal revisar</b>', pendRev() ? pendRev()+(pendRev()===1?' punt':' punts') : 'Revisat', pendRev()?'warn':'')}</div>` : ''}
        ${grp('Obra', [row('nom','Títol',t1,c1), row('autor','Compositor',t2,c2), row('arr','Arranjador',d.arranjador||'—'), row('estil','Estil',d.estil||'—'), row('orig','Partitura original', d.original===true?'Sí, comprada':d.original===false?'No':'—')])}
        ${grp('Partitures', [row('gen','Partitura general (director)',gv,gc), row('par','Parts dels instruments (músic)',pv,pc), ...(needArmari() ? [row('armari','Armari', d.llocs.join(', ') || (showErr?'Cal indicar-ho':'Sense indicar'), '')] : [])])}
        ${grp('Altres', [row('extra','Instrumentació extra', d.instrExterns.join(', ')||'—'), row('proj','Projectes', d.projecteIds.length ? String(d.projecteIds.length) : '—'), row('coment','Comentaris', d.comentaris.trim() ? d.comentaris.trim().slice(0,22)+(d.comentaris.trim().length>22?'…':'') : '—')])}
        ${STATE.role==='gestio' ? `<button type="button" class="btn bd w" id="eDelete" style="margin-top:28px">Elimina l'obra</button>` : ''}
      </div>
      <div class="sticky-foot"><div class="foot-in"><button class="btn o back" id="eCancel">Cancel·la</button><button class="btn" id="eSave">Desa els canvis</button></div></div>`;
    el.scrollTop = y;
    el.querySelectorAll('[data-row]').forEach(b=> b.addEventListener('click', ()=> openSheet(b.dataset.row)));
    el.querySelector('#eCancel').addEventListener('click', close);
    el.querySelector('#eSave').addEventListener('click', save);
    const del = el.querySelector('#eDelete');
    if(del) del.addEventListener('click', ()=>{
      if(STATE.role!=='gestio') return;
      if(!confirm(`Segur que vols eliminar «${piece.title}» de l'arxiu?\n\nDesapareixerà per a tothom.`)) return;
      STATE.pieces = STATE.pieces.filter(x=> x.id!==piece.id);
      persist(); el.remove(); unlockBody(); refreshViews(); showSavePill(`«${piece.title}» eliminada`);
    });
  }
  function close(){ el.remove(); unlockBody(); if(opts.back) openDetail(piece.id); }

  /* ---- fulles: una pregunta cada una ---- */
  const radio = (act, items, cur)=> `<div class="g2">${items.map(([v,l])=>`<button type="button" class="rw rad" data-s="${act}" data-v="${esc(v)}"><span class="rl">${l}</span>${cur===v?'<svg class="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':''}</button>`).join('')}</div>`;
  const toggles = (w, arr)=> `<div class="three" style="margin-top:6px">${Object.entries(PLACE_LABEL).map(([k,l])=>`<button type="button" class="${arr.includes(k)?'on':''}" data-s="place" data-w="${w}" data-v="${k}">${l}</button>`).join('')}</div>`;
  const chipsH = (items, sel, act)=> `<div class="chips">${items.map(x=>`<button type="button" class="chip ${sel(x)?'on':''}" data-s="${act}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
  const switchRow = (label, on, key)=> `<label class="rw"><span class="rl">${label}</span><span class="switch"><input type="checkbox" data-sw="${key}" ${on?'checked':''}><span></span></span></label>`;
  const groupsParts = ()=> groupParts(C.parts||[]);

  const SHEETS = {
    nom:  {t:'Títol', body:()=> `<input class="inp2" data-in="nom" value="${esc(d.nom)}" autocomplete="off">`},
    autor:{t:'Compositor', sub:'Per exemple: Giuseppe Verdi', body:()=> `<div id="cbx"></div>`, mount:r=> makeCombobox(r.querySelector('#cbx'), {items:C.autors, value:d.autor, placeholder:'Cerca o escriu un compositor', onChange:v=>{ d.autor=v; if(v!==(piece.composer||'')) d.revisats.add('autoria'); }})},
    arr:  {t:'Arranjador', sub:'Si en té', body:()=> `<div id="cbx"></div>`, mount:r=> makeCombobox(r.querySelector('#cbx'), {items:C.arranjadors, value:d.arranjador, placeholder:'Cerca o escriu un arranjador', onChange:v=>{ d.arranjador=v; if(v!==(piece.arranger||'')){ d.revisats.add('arranjador'); d.revisats.add('autoria'); } }})},
    estil:{t:'Estil', body:()=>{
      const l = [...C.estils, ...d.estilNous.filter(x=>!C.estils.includes(x))];
      return chipsH(l, x=>d.estil===x, 'estil') .replace(/<\/div>$/, `<button type="button" class="chip add" data-s="estilAdd">+ Afegeix un estil</button></div>`)
        + (d.adding==='estil' ? `<div class="addline"><input class="inp2" data-in="estilNew" value="${esc(d.estilNew)}" placeholder="Nom de l'estil" autocomplete="off"><button type="button" class="btn s" data-s="estilOk">Afegeix</button></div>` : ''); }},
    orig: {t:'Partitura original', sub:'Opcional', body:()=> radio('orig', [['si','Sí, comprada'],['no','No']], d.original===true?'si':d.original===false?'no':'')},
    gen:  {t:'Partitura general (director)', sub:'Tenim la partitura del director?', body:()=> radio('gen', [['si','Sí'],['no','No'],['desconegut','No ho sé']], d.general)
      + (applG(d) ? `<div class="gt" style="margin-top:20px">On és?</div>${toggles('g', d[gKey()])}` : '')},
    par:  {t:'Parts dels instruments (músic)', sub:'Tenim totes les parts?', body:()=> radio('par', [['Completa','Completes'],['Falten parts','En falten'],['Per revisar','No ho sé']], d.estatParts)
      + (d.estatParts==='Falten parts' ? `<div class="g2" style="margin-top:14px"><button type="button" class="rw" data-s="goto" data-v="falten"><span class="rl">Quines falten?</span><span class="rv sel">${esc(d.missing.totes?'Totes':missingList(d.missing).join(', ')||'Cap')}</span><svg class="chv" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>` : '')
      + (applP(d) ? `<div class="gt" style="margin-top:20px">On són les que tenim?</div>`
          + (applG(d) ? `<div class="g2">${switchRow('Al mateix lloc que la general', d.same, 'same')}</div>` : '')
          + ((!applG(d) || !d.same) ? toggles('p', d[pKey()]) : '') : '')},
    falten:{t:'Quines falten?', sub:'Parts dels instruments', parent:'par', body:()=> `<div class="g2">${switchRow('Totes les parts', d.missing.totes, 'totes')}</div>
      <div class="g2 ${d.missing.totes?'dis':''}" style="margin-top:14px">${groupsParts().map(g=>{ const on = g.items.filter(x=>d.missing.sel.includes(x));
        return `<button type="button" class="rw" data-s="goto" data-v="fam:${esc(g.name)}"><span class="rl">${esc(g.name)}</span><span class="rv ${on.length?'sel':'mut'}">${esc(on.length?on.join(', '):'Cap')}</span><svg class="chv" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>`; }).join('')}</div>
      <div class="gt ${d.missing.totes?'dis':''}" style="margin-top:18px">Altres veus <span style="font-weight:400">separades per comes</span></div>
      <input class="inp2" data-in="altres" value="${esc(d.missing.altres)}" placeholder="Per exemple: Clarinet mi bemoll" autocomplete="off" ${d.missing.totes?'disabled':''}>`},
    armari:{t:'Armari', sub:'On és a l\'arxiu físic? Pots marcar-ne més d\'un.', body:()=> chipsH(C.ubicacions||[], x=>d.llocs.includes(x), 'lloc')},
    extra:{t:'Instrumentació extra', sub:'Opcional', body:()=>{
      const l = [...C.instrumentsExterns, ...d.extraNous.filter(x=>!C.instrumentsExterns.includes(x))];
      return chipsH(l, x=>d.instrExterns.includes(x), 'extra').replace(/<\/div>$/, `<button type="button" class="chip add" data-s="extraAdd">+ Afegeix</button></div>`)
        + (d.adding==='extra' ? `<div class="addline"><input class="inp2" data-in="extraNew" value="${esc(d.extraNew)}" placeholder="Per exemple: Cor, Piano" autocomplete="off"><button type="button" class="btn s" data-s="extraOk">Afegeix</button></div>` : ''); }},
    proj: {t:'Projectes', sub:'Opcional. Pot ser-hi en diversos.', body:()=> `<div id="cbx"></div>`, mount:r=>{
      const items = C.projectes.slice().sort((a,b)=>(b.year||0)-(a.year||0)).map(projLab);
      const cur = d.projecteIds.map(pid=>{ const pp = C.projectes.find(x=>x.id===pid); return pp?projLab(pp):null; }).filter(Boolean);
      makeMultiSelect(r.querySelector('#cbx'), {items, values:cur, placeholder:'Cerca un projecte', allowCreate:false, onChange:v=>{
        d.projecteIds = v.map(l=>{ const f = C.projectes.find(pp=> projLab(pp)===l); return f ? f.id : null; }).filter(Boolean); }}); }},
    coment:{t:'Comentaris', sub:'Opcional', body:()=> `<textarea class="textarea" data-in="coment" placeholder="Notes, enllaços, detalls a tenir en compte…">${esc(d.comentaris)}</textarea>`},
    rev:  {t:'Cal revisar', sub:'Marca cada punt quan l\'hagis comprovat o corregit. En desar, l\'obra sortirà de «Cal revisar».', body:()=> revItems.map(it=>`<label class="revitem"><input type="checkbox" data-rev="${esc(it.key)}" ${d.revisats.has(it.key)?'checked':''}><span>${esc(it.text)}</span></label>`).join('')},
  };
  function openSheet(first){
    const bg = document.createElement('div'); bg.className = 'sheet-bg';
    bg.innerHTML = `<div class="sheet"><div class="sheet-head"><div class="htxt" id="shT"></div><button class="sheet-close" id="shX" aria-label="Tanca"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
      <div class="sheet-body" id="shB"></div><div class="btnbar"><button class="btn" id="shOk" style="flex:1">Fet</button></div></div>`;
    document.body.appendChild(bg);
    let view = first;
    const body = bg.querySelector('#shB');
    function paint(){
      const S = view.startsWith('fam:') ? null : SHEETS[view];
      if(S){
        bg.querySelector('#shT').innerHTML = `<div style="display:flex;gap:12px;align-items:center">${S.parent?'<button type="button" class="ib" id="shBack" aria-label="Enrere" style="flex:none">'+I.back+'</button>':''}<div style="min-width:0"><h2 style="font-size:24px;line-height:28px">${esc(S.t)}</h2>${S.sub?`<div class="hsub">${esc(S.sub)}</div>`:''}</div></div>`;
        body.innerHTML = S.body();
        if(S.mount) S.mount(body);
      } else {
        const g = groupsParts().find(x=> 'fam:'+x.name===view);
        bg.querySelector('#shT').innerHTML = `<div style="display:flex;gap:12px;align-items:center"><button type="button" class="ib" id="shBack" aria-label="Enrere" style="flex:none">${I.back}</button><div><h2 style="font-size:24px;line-height:28px">${esc(g?g.name:'')}</h2><div class="hsub">Marca les que falten</div></div></div>`;
        body.innerHTML = `<div class="g2">${(g?g.items:[]).map(x=>`<button type="button" class="rw rad" data-s="miss" data-v="${esc(x)}"><span class="rl">${esc(x)}</span>${d.missing.sel.includes(x)?'<svg class="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':''}</button>`).join('')}</div>`;
      }
      const back = bg.querySelector('#shBack');
      if(back) back.addEventListener('click', ()=>{ view = view.startsWith('fam:') ? 'falten' : SHEETS[view].parent; paint(); });
      const inp = body.querySelector('input.inp2, textarea');
      if(inp && !('ontouchstart' in window)) inp.focus();
      const ad = body.querySelector('[data-in=estilNew],[data-in=extraNew]'); if(ad) ad.focus();
    }
    const done = ()=>{ bg.remove(); renderMain(); };
    function after(){ afterAnswer(d); paint(); renderMain(); bg.style.visibility = ''; }
    const A = {
      estil:(v)=>{ d.estil = d.estil===v ? '' : v; },
      estilAdd:()=>{ d.adding = d.adding==='estil' ? null : 'estil'; },
      estilOk:()=>{ addNew('estilNous','estilNew',C.estils, val=>{ d.estil = val; }); },
      orig:(v)=>{ const b = v==='si'; d.original = d.original===b ? null : b; },
      gen:(v)=>{ d.general = v; },
      par:(v)=>{ d.estatParts = v; },
      place:(v,w)=>{ togglePlace(w, v); },
      goto:(v)=>{ view = v; },
      miss:(v)=>{ const m = d.missing; m.sel = m.sel.includes(v) ? m.sel.filter(x=>x!==v) : [...m.sel, v]; m.touched = true; },
      lloc:(v)=>{ d.llocs = d.llocs.includes(v) ? d.llocs.filter(x=>x!==v) : [...d.llocs, v]; },
      extra:(v)=>{ d.instrExterns = d.instrExterns.includes(v) ? d.instrExterns.filter(x=>x!==v) : [...d.instrExterns, v]; },
      extraAdd:()=>{ d.adding = d.adding==='extra' ? null : 'extra'; },
      extraOk:()=>{ addNew('extraNous','extraNew',C.instrumentsExterns, val=>{ if(!d.instrExterns.includes(val)) d.instrExterns.push(val); }); },
    };
    function addNew(listKey, newKey, catalog, pick){
      const raw = (d[newKey]||'').trim(); d.adding = null; if(!raw) return;
      const found = [...catalog, ...d[listKey]].find(x=> norm(x)===norm(raw));
      if(!found) d[listKey].push(raw);
      pick(found || raw); d[newKey] = '';
    }
    bg.addEventListener('click', e=>{
      if(e.target===bg){ done(); return; }
      const b = e.target.closest('[data-s]'); if(!b || !bg.contains(b)) return;
      A[b.dataset.s](b.dataset.v, b.dataset.w); after();
    });
    bg.addEventListener('change', e=>{
      const sw = e.target.dataset && e.target.dataset.sw, rv = e.target.dataset && e.target.dataset.rev;
      if(sw==='same') setSame(e.target.checked);
      else if(sw==='totes'){ d.missing.totes = e.target.checked; d.missing.touched = true; }
      else if(rv){ if(e.target.checked) d.revisats.add(rv); else d.revisats.delete(rv); renderMain(); return; }
      else return;
      after();
    });
    bg.addEventListener('input', e=>{
      const k = e.target.dataset && e.target.dataset.in; if(!k) return;
      if(k==='nom') d.nom = e.target.value;
      else if(k==='altres'){ d.missing.altres = e.target.value; d.missing.touched = true; }
      else if(k==='coment') d.comentaris = e.target.value;
      else if(k==='estilNew') d.estilNew = e.target.value;
      else if(k==='extraNew') d.extraNew = e.target.value;
    });
    bg.addEventListener('keydown', e=>{
      if(e.key!=='Enter') return;
      const k = e.target.dataset && e.target.dataset.in;
      if(k==='estilNew'){ e.preventDefault(); A.estilOk(); after(); }
      else if(k==='extraNew'){ e.preventDefault(); A.extraOk(); after(); }
      else if(k==='nom'){ e.preventDefault(); done(); }
    });
    bg.querySelector('#shX').addEventListener('click', done);
    bg.querySelector('#shOk').addEventListener('click', done);
    paint();
  }

  function save(){
    d.err = {};
    const okNom = !!d.nom.trim(), okAut = !!d.autor.trim();
    const okLoc = vUbic(d);
    const okArm = true;
    if(!(okNom && okAut && okLoc)){
      showErr = true; renderMain();
      const bad = [...el.querySelectorAll('.rv.bad')].find(x=> /Cal indicar/.test(x.textContent));
      if(bad) bad.closest('.rw').scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    desaCatalegs(d);
    const general = d.general, estatParts = d.estatParts;
    const oldByPid = {}; (piece.aparicions||[]).forEach(a=>{ if(a.projecteId) oldByPid[a.projecteId]=a; });
    const newAparicions = d.projecteIds.map(pid=>{
      const pp = C.projectes.find(x=>x.id===pid);
      return oldByPid[pid] || { projecteId:pid, projecte:pp?pp.name:'', any:pp?pp.year:null, seccio:'', fitxers:0, estatParts };
    });
    Object.assign(piece, {
      title: d.nom.trim(), composer: d.autor.trim(), arranger: d.arranjador.trim(),
      obs: d.comentaris.trim(), aparicions: newAparicions, original: d.original,
      estil: d.estil.trim(), general, estatParts,
      specials: d.instrExterns, ...(missingFields(d)||{}),
      ...placeOfDraft(d),
      nomesFisicPendent: !!piece.nomesFisicPendent && estatParts==='Per revisar',
    });
    if(d.revisats.size) marcaRevisada(piece, [...d.revisats]);
    persist(); refreshViews(); close();
  }
  renderMain();
}


/* ================= REGISTRAR (3 passos) ================= */
const REG = {d:null, step:1};
function renderRegistrar(){
  REG.d = newDraft(); REG.step = 1;
  regRender();
}
function regRender(){
  const d = REG.d, n = REG.step;
  const root = document.getElementById('registrarForm');
  const titles = ['Quina obra és?','Quines parts tenim?','On es troba?'];
  const subs = ['Completa tots els apartats que puguis.', d.nom.trim(), ''];
  root.innerHTML = `<div class="steps">${[1,2,3].map(i=>`${i>1?'<i></i>':''}<b class="${i===n?'on':i<n?'done':''}">${i}</b>`).join('')}</div>
    <h1 class="h1" style="margin-top:22px">${titles[n-1]}</h1>${subs[n-1]?`<div class="sub">${esc(subs[n-1])}</div>`:''}
    <div id="regBody" style="padding-bottom:170px;margin-top:${n===1?22:0}px"></div>
    <div class="foot"><div class="foot-in">${n>1?'<button class="btn o back" id="regBack">Enrere</button>':''}<button class="btn" id="regNext">${n===3?"Desa l'obra":'Continua'}</button><button type="button" class="btn o cx" id="regCancel">Cancel·la</button></div></div>`;
  const secs = n===1 ? (d=> secObra(d))
    : n===2 ? (d=> secParts(d))
    : (d=> secUbic(d, true) + secProjectes() + secComentaris(d) + secResum());
  const form = mountForm(document.getElementById('regBody'), d, secs, { scroller: window, onChange: ()=> { if(n===3) fillResum(d, null); } });
  const go = k=>{ REG.step = k; regRender(); window.scrollTo(0,0); };
  document.getElementById('regCancel').addEventListener('click', ()=>{
    const touched = d.nom.trim() || d.autor.trim() || n>1;
    if(touched && !confirm("Vols descartar el que has escrit?")) return;
    REG.d = null; setScreen('consultar');
  });
  const back = document.getElementById('regBack'); if(back) back.addEventListener('click', ()=> go(n-1));
  document.getElementById('regNext').addEventListener('click', ()=>{

function csvCell(v){
  v = v==null ? '' : String(v);
  return /[";\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function exportCsv(){
  const rows = [...STATE.pieces].sort((a,b)=> (a.title||'').localeCompare(b.title||'', 'ca', {sensitivity:'base'}));
  const lines = [CSV_COLS.map(c=> csvCell(c[0])).join(';'),
    ...rows.map(p=> CSV_COLS.map(c=> csvCell(c[1](p))).join(';'))];
  // BOM perquè Excel reconegui els accents; «;» és el separador que Excel espera en català
  downloadFile(`arxiu-obres-${exportDate()}.csv`, '﻿'+lines.join('\r\n'), 'text/csv;charset=utf-8');
  showSavePill(`CSV baixat (${rows.length} obres)`);
}
/* restaurar: la còpia substitueix les obres i les llistes; el servidor ho desa tot alhora i n'enregistra l'historial */
function parseBackup(text){
  let d; try{ d = JSON.parse(text); }catch(e){ throw new Error('El fitxer no és una còpia de seguretat vàlida.'); }
  if(!d || d.format!=='arxiu-banda-terrassa' || !Array.isArray(d.obres) || !d.catalegs || typeof d.catalegs!=='object')
    throw new Error('Aquest fitxer no és una còpia de seguretat de l\'arxiu.');
  const ids = new Set();
  for(const o of d.obres){
    if(!o || typeof o!=='object' || !o.id || typeof o.id!=='string' || typeof o.title!=='string') throw new Error('La còpia té obres mal formades.');
    if(ids.has(o.id)) throw new Error('La còpia té obres repetides.');
    ids.add(o.id);
  }
  const catalogs = {estils:[], autors:[], arranjadors:[], parts:[], instrumentsExterns:[], projectes:[], ubicacions:[]};
  Object.keys(catalogs).forEach(k=>{ if(Array.isArray(d.catalegs[k])) catalogs[k] = d.catalegs[k]; });
  return {obres:d.obres, catalogs, exportat:d.exportat, exportatPer:d.exportatPer};
}

function unifyRename(listKey, oldVal, newVal){
  let count = 0;
  function mergeArr(arr){
    if(!arr || !arr.includes(oldVal)) return arr;
    return [...new Set(arr.map(x=> x===oldVal? newVal : x))];
  }
  STATE.pieces.forEach(p=>{
    let touched = false;
    if(listKey==='autors'){
      if(p.composer===oldVal){ p.composer = newVal; touched = true; }
      else if(p.composer && p.composer.includes('; ')){
        const parts = p.composer.split('; ');
        if(parts.includes(oldVal)){ p.composer = [...new Set(parts.map(x=>x===oldVal?newVal:x))].join('; '); touched = true; }
      }
    } else if(listKey==='arranjadors'){
      if(p.arranger===oldVal){ p.arranger = newVal; touched = true; }
      else if(p.arranger && p.arranger.includes('; ')){
        const parts = p.arranger.split('; ');
        if(parts.includes(oldVal)){ p.arranger = [...new Set(parts.map(x=>x===oldVal?newVal:x))].join('; '); touched = true; }
      }
    } else if(listKey==='estils'){
      if(p.estil===oldVal){ p.estil = newVal; touched = true; }
    } else if(listKey==='instrumentsExterns'){
      const merged = mergeArr(p.specials);
      if(merged){ p.specials = merged; touched = true; }
    } else if(listKey==='ubicacions'){
      const merged = mergeArr(p.ubicacioFisica);
      if(merged){ p.ubicacioFisica = merged; touched = true; }
    } else if(listKey==='parts'){
      const m1 = mergeArr(p.partsDetectades), m2 = mergeArr(p.partsNoDetectades);
      if(m1){ p.partsDetectades = m1; touched = true; }
      if(m2){ p.partsNoDetectades = m2; touched = true; }
    }
    if(touched) count++;
  });
  return count;
}

    proj.name = bg.querySelector('#p_name').value.trim() || 'Sense nom';
    proj.year = Number(bg.querySelector('#p_year').value) || null;
    proj.link = bg.querySelector('#p_link').value.trim();
    if(isNew) STATE.catalogs.projectes.push(proj);
    STATE.pieces.forEach(p=> (p.aparicions||[]).forEach(a=>{ if(a.projecteId===proj.id){ a.projecte = proj.name; a.any = proj.year; } }));
    persist(); close(); done();
    if(isNew && STATE.screen==='consultar') openProjecteSheet(proj.id);
  });
}

/* ================= AJUDA ================= */
function openHelp(){
  const gestio = STATE.role==='gestio';
  const tag = (cls, t)=> `<span class="st ${cls}" style="display:inline-block;margin:6px 12px 0 0;font:600 13px/18px var(--sf)">${t}</span>`;
  const bg = document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML = `<div class="sheet">
    <div class="sheet-head"><div class="htxt"><h2>Com funciona l'arxiu</h2></div>
      <button class="sheet-close" id="hClose" aria-label="Tanca"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="sheet-body">
      <p class="help-intro">L'arxiu recull totes les partitures de la banda: què tenim de cada obra, on és i si està completa per poder-la tocar.</p>

      <h3 class="help-h">Què vol dir cada color</h3>
      <div class="help-row"><span class="swatch ok"></span><div><b>Verd — La podem tocar</b>Hi ha la partitura general del director i totes les parts dels instruments.
        <div>${tag('ok','Completa')}</div></div></div>
      <div class="help-row"><span class="swatch bad"></span><div><b>Vermell — Falta alguna cosa</b>Sabem que no tenim la partitura general, o que falten parts d'alguns instruments. Si en sabem quines, surten al costat.
        <div>${tag('bad','Falta la general')}${tag('bad','Falten parts')}${tag('bad','Falta la general i parts')}</div></div></div>
      <div class="help-row"><span class="swatch warn"></span><div><b>Groc — Cal comprovar-ho</b>Encara no sabem si hi és tot: algú ha d'anar a l'arxiu a mirar-ho. «Cal revisar» vol dir que hi ha alguna dada per corregir.
        <div>${tag('warn','Per verificar')}${tag('warn','Parts sense verificar')}${tag('warn','General sense verificar')}${tag('warn','Cal revisar')}</div></div></div>
      <div class="help-row"><span class="swatch"></span><div><b>Si en surten dos</b>El vermell sempre va primer. Per exemple, «Falta la general · Parts sense verificar» vol dir que no hi ha la general i que les parts encara s'han de comprovar.</div></div>

      <h3 class="help-h">On es troben les partitures</h3>
      <div class="help-row"><span class="swatch"></span><div><b>Al Box</b>Hi ha una còpia digital. És el primer lloc on buscar-la.</div></div>
      <div class="help-row"><span class="swatch"></span><div><b>En físic</b>Hi ha una còpia en paper a l'arxiu. Quan només és en paper, la targeta ho indica a sota, amb l'armari.</div></div>

      <h3 class="help-h">Com consultar-ho</h3>
      <div class="help-row"><span class="swatch"></span><div><b>Cercador</b>Escriu qualsevol dada: títol, autor, projecte, any, instrument… Pots escriure diverses paraules, com «nadal 2023».</div></div>
      <div class="help-row"><span class="swatch"></span><div><b>Dues vistes</b>Les fitxes mostren cada obra amb el seu estat. La llista n'és la versió compacta, amb una fila per obra i el color de l'estat al marc. En totes dues, l'índex de lletres de la dreta et porta directament a una lletra.</div></div>
      <div class="help-row"><span class="swatch"></span><div><b>Projectes</b>Cada concert o actuació amb el seu repertori. Des de la fitxa d'una obra pots anar als projectes on s'ha tocat.</div></div>
      ${gestio ? `
      <h3 class="help-h">Amb el rol d'edició</h3>
      <div class="help-row"><span class="swatch"></span><div><b>Per revisar</b>La feina pendent agrupada: registres dels músics per acceptar, obres a revisar i obres per comprovar. Les obres on falten parts o la general es troben amb els filtres.</div></div>
      <div class="help-row"><span class="swatch"></span><div><b>Editar</b>Obre una obra o un projecte i toca el llapis. Des de «Per revisar», les obres s'obren directament per editar.</div></div>
      <div class="help-row"><span class="swatch"></span><div><b>Configuració</b>Les llistes que fan servir els formularis: ubicacions, compositors, plantilla de la banda… Si hi canvies un nom, es canvia a totes les obres.</div></div>`
      : `
      <div class="help-row"><span class="swatch"></span><div><b>Registrar</b>Si trobes una obra que no hi és, registra-la amb el botó +. La Junta la revisarà i l'aprovarà.</div></div>`}
      ${STATE.user ? `<p class="hint" style="margin-top:22px">Sessió iniciada com a <b>${esc(STATE.user.name)}</b>. Per sortir, toca la icona de la capçalera.</p>` : ''}
      <div class="btnbar"><button class="btn" id="hOk" style="flex:1">Entesos</button></div>
    </div>
  </div>`;
  document.body.appendChild(bg); document.body.classList.add('locked');
  const close = ()=>{ bg.remove(); unlockBody(); };
  bg.querySelector('#hClose').addEventListener('click', close);
  bg.querySelector('#hOk').addEventListener('click', close);
  bg.addEventListener('click', e=>{ if(e.target===bg) close(); });
}
document.getElementById('helpBtn').addEventListener('click', openHelp);


/* ================= INIT ================= */
document.querySelectorAll('[data-view]').forEach(b=> b.classList.toggle('on', b.dataset.view===STATE.view));
STATE.user = null; STATE.session = null;
setRole('musica');
const saved = loadSession();
if(saved) startSession(saved); else showLogin();
</script>
</body></html>
