  const input = container.querySelector('input');
  const chipsBox = container.querySelector('.selectedchips');
  function renderChips(){
    chipsBox.innerHTML = selected.map(v=>`<span class="selchip">${esc(v)}<button data-rm="${esc(v)}">✕</button></span>`).join('');
    chipsBox.querySelectorAll('button[data-rm]').forEach(b=> b.addEventListener('click', ()=>{ selected = selected.filter(x=>x!==b.dataset.rm); renderChips(); onChange(selected); }));
  }
  renderChips();
  let panel=null, dismiss=null;
  function closePanel(){ if(panel){panel.remove(); panel=null;} if(dismiss){ document.removeEventListener('scroll',dismiss,true); window.removeEventListener('resize',dismiss); dismiss=null; } }
  function openPanel(){
    closePanel();
    const q = norm(input.value);
    const filtered = items.filter(it=> norm(it).includes(q) && !selected.includes(it));
    panel = document.createElement('div'); panel.className='combo-panel';
    let html = filtered.slice(0,60).map(it=>`<div class="combo-opt" data-v="${esc(it)}">${esc(it)}</div>`).join('');
    if(allowCreate && input.value.trim() && !items.some(it=>norm(it)===q)){
      html += `<div class="combo-opt create" data-create="1">+ Afegeix "${esc(input.value.trim())}"</div>`;
    }
    if(!html) html = `<div class="combo-empty">Sense resultats</div>`;
    panel.innerHTML = html;
    document.body.appendChild(panel);
    positionPanel(panel, input);
    dismiss = attachPanelDismiss(closePanel);
    panel.querySelectorAll('.combo-opt[data-v]').forEach(o=> o.addEventListener('mousedown', e=>{ e.preventDefault(); selected.push(o.dataset.v); input.value=''; renderChips(); onChange(selected); closePanel(); }));
    const c = panel.querySelector('.combo-opt[data-create]');
    if(c) c.addEventListener('mousedown', e=>{ e.preventDefault(); const v=input.value.trim(); if(!items.includes(v)) items.push(v); selected.push(v); input.value=''; renderChips(); onChange(selected); closePanel(); });
  }
  input.addEventListener('focus', openPanel);
  input.addEventListener('input', openPanel);
  input.addEventListener('blur', ()=> setTimeout(closePanel,150));
}

/* llocs físics: xips de selecció múltiple sobre la llista tancada de Configuració */
function llocChipsHtml(id, selected, hidden){

  return `<div class="field llocs ${hidden?'hidden':''}" id="${id}"><label>On és, a l'arxiu físic? <span class="opt">pots marcar-ne més d'un</span></label>
    <div class="chips">${items.map(u=>`<button type="button" class="chip ${selected.includes(u)?'on':''}" data-lloc="${esc(u)}">${esc(u)}</button>`).join('')}</div></div>`;
}
function bindLlocChips(box, draft){
  box.querySelectorAll('[data-lloc]').forEach(b=> b.addEventListener('click', ()=>{
    const v = b.dataset.lloc;
    draft.llocs = draft.llocs.includes(v) ? draft.llocs.filter(x=>x!==v) : [...draft.llocs, v];
    b.classList.toggle('on', draft.llocs.includes(v));
  }));

/* parts que falten: xips sobre la plantilla (Configuració › Parts) + camp lliure per a veus concretes */
function missingInit(piece){
  const src = (piece.faltenInventari&&piece.faltenInventari.length) ? piece.faltenInventari : (piece.partsNoDetectades||[]);
  const cat = STATE.catalogs.parts||[];
  return {
    totes: !!piece.totesFaltenParts || src.some(x=>(x||'').trim().toUpperCase()==='TOT'),
    sel: src.filter(x=>cat.includes(x)),
    altres: src.filter(x=>x && !cat.includes(x) && x.trim().toUpperCase()!=='TOT').join(', '),
    touched: false,
  };
}
function missingList(m){ return [...m.sel, ...m.altres.split(',').map(x=>x.trim()).filter(Boolean)]; }
/* camps de parts que resulten del formulari (null = no s'ha tocat, es conserva el que hi havia) */
function missingFields(draft){
  if(draft.estatParts!=='Falten parts') return {faltenInventari:[], partsNoDetectades:[], totesFaltenParts:false};
  if(!draft.missing.touched) return null;
  return {faltenInventari: draft.missing.totes ? ['TOT'] : missingList(draft.missing), partsNoDetectades:[], totesFaltenParts: draft.missing.totes};
}
function missingHtml(id, m, hidden){
  const cat = STATE.catalogs.parts||[];
  return `<div class="missbox ${hidden?'hidden':''}" id="${id}">
    <label class="misslabel">Quines parts falten?</label>
    <div class="chips">
      <button type="button" class="chip ${m.totes?'on':''}" data-totes="1">Totes</button>
      ${cat.map(x=>`<button type="button" class="chip ${m.sel.includes(x)?'on':''}" data-miss="${esc(x)}" ${m.totes?'disabled':''}>${esc(x)}</button>`).join('')}
    </div>
    <div class="field" style="margin:12px 0 0"><label>Altres o veus concretes <span class="opt">separades per comes, p. ex. Clarinet 3, Trompa 2</span></label>
      <input class="input" data-altres value="${esc(m.altres)}" ${m.totes?'disabled':''}></div>
  </div>`;
}
function bindMissing(box, m, onChange){
  const sync = ()=>{
    box.querySelector('[data-totes]').classList.toggle('on', m.totes);
    box.querySelectorAll('[data-miss]').forEach(b=>{ b.classList.toggle('on', m.sel.includes(b.dataset.miss)); b.disabled = m.totes; });
    box.querySelector('[data-altres]').disabled = m.totes;
    m.touched = true; onChange();
  };
  box.querySelector('[data-totes]').addEventListener('click', ()=>{ m.totes = !m.totes; sync(); });
  box.querySelectorAll('[data-miss]').forEach(b=> b.addEventListener('click', ()=>{
    const v = b.dataset.miss; m.sel = m.sel.includes(v) ? m.sel.filter(x=>x!==v) : [...m.sel, v]; sync();
  }));
  box.querySelector('[data-altres]').addEventListener('input', e=>{ m.altres = e.target.value; m.touched = true; onChange(); });
}

/* Estat de l'arxiu (formularis): per a la general i per a les parts, primer si hi són i després on són.
   Amb una sola ubicació física a Configuració no cal triar-la; se n'assigna automàticament. */
function archInit(piece){
  const pl = placesOf(piece);
  return { gPlaces: pl.g.slice(), pPlaces: pl.p.slice(), llocs: (piece.ubicacioFisica||[]).slice() };
}
function archHtml(pre, d, allowUnknown){
  const gOpts = [['si','Sí'],['no','No']].concat(allowUnknown ? [['desconegut','No ho sé']] : []);
  const pOpts = [['Completa','Sí, completes'],['Falten parts','No, en falten']].concat(allowUnknown ? [['Per revisar','No ho sé']] : []);
  const where = (key, arr, q, show)=> `<div class="archwhere ${show?'':'hidden'}"><span class="archq">${q}</span>
      <div class="chips">${Object.entries(PLACE_LABEL).map(([k,l])=>`<button type="button" class="chip ${arr.includes(k)?'on':''}" data-${key}="${k}">${l}</button>`).join('')}</div></div>`;
  const multi = (STATE.catalogs.ubicacions||[]).length > 1;
  return `
    <div class="field archfield" id="${pre}_general">
      <label>Partitura general <span class="req">*</span></label>
      <div class="chips">${gOpts.map(([k,l])=>`<button type="button" class="chip ${d.general===k?'on':''}" data-g="${k}">${l}</button>`).join('')}</div>
      ${where('gp', d.gPlaces, 'On és?', d.general && d.general!=='no')}
      <div class="errtext">Indica si hi ha la partitura general i on és.</div>
    </div>
    <div class="field archfield" id="${pre}_parts">
      <label>Parts de la banda <span class="req">*</span></label>
      <div class="chips">${pOpts.map(([k,l])=>`<button type="button" class="chip ${d.estatParts===k?'on':''}" data-p="${k}">${l}</button>`).join('')}</div>
      ${where('pp', d.pPlaces, 'On són?', !!d.estatParts)}
      ${missingHtml(pre+'_missing', d.missing, d.estatParts!=='Falten parts')}
      <div class="errtext">Indica com estan les parts i on són.</div>
    </div>
    ${multi ? llocChipsHtml(pre+'_llocs', d.llocs, true) : ''}`;
}
function bindArch(root, pre, d, onChange){
  const gBox = root.querySelector('#'+pre+'_general'), pBox = root.querySelector('#'+pre+'_parts');
  const llocs = root.querySelector('#'+pre+'_llocs');
  const sync = ()=>{
    gBox.querySelector('.archwhere').classList.toggle('hidden', !d.general || d.general==='no');
    pBox.querySelector('.archwhere').classList.toggle('hidden', !d.estatParts);
    root.querySelector('#'+pre+'_missing').classList.toggle('hidden', d.estatParts!=='Falten parts');
    if(llocs) llocs.classList.toggle('hidden', !archApply(d).enPaper);
    onChange();
  };
  const single = (box, attr, key)=> box.querySelectorAll(`[data-${attr}]`).forEach(b=> b.addEventListener('click', ()=>{
    d[key] = b.dataset[attr];
    box.querySelectorAll(`[data-${attr}]`).forEach(x=> x.classList.toggle('on', x===b));
    box.classList.remove('err'); sync();
  }));
  const multiPick = (box, attr, key)=> box.querySelectorAll(`[data-${attr}]`).forEach(b=> b.addEventListener('click', ()=>{
    const v = b.dataset[attr];
    d[key] = d[key].includes(v) ? d[key].filter(x=>x!==v) : [...d[key], v];
    b.classList.toggle('on', d[key].includes(v));
    box.classList.remove('err'); sync();
  }));
  single(gBox, 'g', 'general'); multiPick(gBox, 'gp', 'gPlaces');
  single(pBox, 'p', 'estatParts'); multiPick(pBox, 'pp', 'pPlaces');
  bindMissing(root.querySelector('#'+pre+'_missing'), d.missing, onChange);
  if(llocs) bindLlocChips(llocs, d);
  if(llocs) llocs.classList.toggle('hidden', !archApply(d).enPaper);
}
function archValidate(root, pre, d){
  const gOk = !!d.general && (d.general==='no' || d.gPlaces.length>0);
  const pOk = !!d.estatParts && d.pPlaces.length>0;
  root.querySelector('#'+pre+'_general').classList.toggle('err', !gOk);
  root.querySelector('#'+pre+'_parts').classList.toggle('err', !pOk);
  return gOk && pOk;
}
/* camps d'ubicació que resulten del formulari */
function archApply(d){
  const g = d.general && d.general!=='no' ? d.gPlaces : [], pp = d.pPlaces;
  const box = g.includes('box') || pp.includes('box'), fis = g.includes('fisic') || pp.includes('fisic');
  const cat = STATE.catalogs.ubicacions||[];
  const llocs = !fis ? [] : cat.length===1 ? [cat[0]] : (d.llocs.length ? d.llocs : cat.slice(0,1));
  return {
    escanejada: box, enPaper: fis, ubicacioFisica: llocs,
    generalNomesFisic: box && fis && g.length===1 && g[0]==='fisic',
    partsNomesFisic: box && fis && pp.length===1 && pp[0]==='fisic',
  };
}

/* partitura original (comprada): Sí / No; es pot deixar sense marcar */
const ORIGINAL = {si:'Sí, comprada', no:'No'};
function originalHtml(id, val){
  return `<div class="field" id="${id}"><label>Partitura original <span class="opt">opcional</span></label>
    <div class="chips">${Object.entries(ORIGINAL).map(([k,l])=>`<button type="button" class="chip ${val===(k==='si')?'on':''}" data-orig="${k}">${l}</button>`).join('')}</div></div>`;
}
function bindOriginal(box, draft){
  box.querySelectorAll('[data-orig]').forEach(b=> b.addEventListener('click', ()=>{
    const v = b.dataset.orig==='si';
    draft.original = draft.original===v ? null : v;
    box.querySelectorAll('[data-orig]').forEach(x=> x.classList.toggle('on', draft.original===(x.dataset.orig==='si')));
  }));
}
function originalText(p){ return p.original===true ? 'Sí, comprada' : p.original===false ? 'No' : '—'; }

/* ================= EDITAR OBRA EXISTENT ================= */
function openEditPiece(id, opts={}){
  const piece = STATE.pieces.find(x=>x.id===id);
  if(!piece) return;
  const draft = {
    nom: piece.title, autor: piece.composer||'', arranjador: piece.arranger||'', estil: piece.estil||'',
    projecteIds: (piece.aparicions||[]).map(a=>a.projecteId).filter(Boolean),
    general: piece.general||'desconegut', estatParts: piece.estatParts==='No és a Box' ? 'Per revisar' : (piece.estatParts||'Per revisar'),
    ...archInit(piece),
    missing: missingInit(piece), instrExterns: piece.specials||[],
    comentaris: piece.obs||'', original: typeof piece.original==='boolean' ? piece.original : null,
    revisats: new Set(),
  };
  const revItems = revisioItems(piece);
  const bg = document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML = `<div class="sheet">
    <div class="sheet-head"><div class="htxt"><h2 style="display:block">Edita l'obra</h2><div class="hsub">${esc(piece.title)}</div></div>
      <button class="sheet-close" id="eClose"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="sheet-body">
      ${revItems.length ? `<div class="note warn revbox" id="ef_rev"><b>Cal revisar</b>
        <p class="revhint">Marca cada punt quan l'hagis comprovat o corregit. En desar, l'obra sortirà de «Cal revisar».</p>
        ${revItems.map(it=>`<label class="revitem"><input type="checkbox" data-rev="${esc(it.key)}"><span>${esc(it.text)}</span></label>`).join('')}
      </div>` : ''}
      <div class="block" style="box-shadow:none;padding:0;margin-bottom:6px">
        <div class="field" id="ef_nom"><label>Títol <span class="req">*</span></label><input class="input" id="ein_nom" value="${esc(draft.nom)}"><div class="errtext">Cal indicar el títol de la partitura.</div></div>
        <div class="field" id="ef_autor"><label>Compositor <span class="req">*</span></label><div id="ecb_autor"></div><div class="errtext">Cal indicar el compositor.</div></div>
        <div class="field"><label>Arranjador <span class="opt">opcional</span></label><div id="ecb_arranjador"></div></div>
        <div class="field"><label>Estil <span class="opt">opcional</span></label><div id="ecb_estil"></div></div>
        ${originalHtml('ef_original', draft.original)}
        <div class="field"><label>Projectes <span class="opt">opcional — pot ser-hi en diversos</span></label><div id="ems_projecte"></div></div>
      </div>
      <h3 class="sec">Estat de l'arxiu</h3>
      ${archHtml('ef', draft, true)}
      <div class="field"><label>Instruments fora de la plantilla habitual <span class="opt">opcional</span></label><div id="ems_instr"></div></div>
      <div class="note info" id="ef_preview" style="margin-top:10px"></div>

      <h3 class="sec">Comentaris</h3>
      <textarea class="textarea" id="ein_comentaris">${esc(draft.comentaris)}</textarea>

      <div class="btnbar"><button class="btn primary" id="eSave" style="flex:1">Desa els canvis</button></div>
    </div>
  </div>`;
  document.body.appendChild(bg); document.body.classList.add('locked');

  function updatePreview(){
    const tmp = JSON.parse(JSON.stringify({...piece, general:draft.general, estatParts:draft.estatParts, ...(missingFields(draft)||{}),
      ...archApply(draft), composer:draft.autor, arranger:draft.arranjador}));
    marcaRevisada(tmp, [...draft.revisats]);
    const st = obraState(tmp);
    bg.querySelector('#ef_preview').innerHTML = `<b>Estat resultant:</b> ${esc(stateText(st))}${needsReview(tmp)?' · Cal revisar':''}`;
  }

  // en corregir l'autoria, es marca sol el punt corresponent (es pot desmarcar)
  function autoRev(keys){
    keys.forEach(k=>{ const cb = bg.querySelector(`[data-rev="${k}"]`); if(cb && !cb.checked){ cb.checked = true; draft.revisats.add(k); } });
  }
  bg.querySelectorAll('[data-rev]').forEach(cb=> cb.addEventListener('change', ()=>{
    if(cb.checked) draft.revisats.add(cb.dataset.rev); else draft.revisats.delete(cb.dataset.rev);
    updatePreview();
  }));
  makeCombobox(bg.querySelector('#ecb_autor'), {items:STATE.catalogs.autors, value:draft.autor, placeholder:'Cerca o afegeix un autor', onChange:v=>{draft.autor=v; if(v!==(piece.composer||'')) autoRev(['autoria']); updatePreview();}});
  makeCombobox(bg.querySelector('#ecb_arranjador'), {items:STATE.catalogs.arranjadors, value:draft.arranjador, placeholder:'Cerca o afegeix un arranjador', onChange:v=>{draft.arranjador=v; if(v!==(piece.arranger||'')) autoRev(['arranjador','autoria']); updatePreview();}});
  makeCombobox(bg.querySelector('#ecb_estil'), {items:STATE.catalogs.estils, value:draft.estil, placeholder:'Cerca o afegeix un estil', onChange:v=>draft.estil=v});
  bindOriginal(bg.querySelector('#ef_original'), draft);
  const projLabelOf = pp=> pp.name+(pp.year?' ('+pp.year+')':'');
  const projItems = STATE.catalogs.projectes.slice().sort((a,b)=>(b.year||0)-(a.year||0)).map(projLabelOf);
  const curProjLabels = draft.projecteIds.map(pid=>{ const pp=STATE.catalogs.projectes.find(x=>x.id===pid); return pp?projLabelOf(pp):null; }).filter(Boolean);
  makeMultiSelect(bg.querySelector('#ems_projecte'), {items:projItems, values:curProjLabels, placeholder:'Cerca un projecte', allowCreate:false, onChange:v=>{
    draft.projecteIds = v.map(label=>{ const found = STATE.catalogs.projectes.find(pp=> projLabelOf(pp)===label); return found? found.id : null; }).filter(Boolean);
  }});
  bindArch(bg, 'ef', draft, updatePreview);
  makeMultiSelect(bg.querySelector('#ems_instr'), {items:STATE.catalogs.instrumentsExterns, values:draft.instrExterns.slice(), placeholder:'p. ex. Cor, Piano', onChange:v=>draft.instrExterns=v});
  bg.querySelector('#ein_nom').addEventListener('input', e=>{ draft.nom=e.target.value; bg.querySelector('#ef_nom').classList.remove('err'); });
  bg.querySelector('#ein_comentaris').addEventListener('input', e=>draft.comentaris=e.target.value);
  updatePreview();

  function close(){ document.body.removeChild(bg); document.body.classList.remove('locked'); }
  bg.querySelector('#eClose').addEventListener('click', ()=>{ close(); if(opts.back) openDetail(piece.id); });

  bg.querySelector('#eSave').addEventListener('click', ()=>{
    let ok = true;
    if(!draft.nom.trim()){ bg.querySelector('#ef_nom').classList.add('err'); ok=false; }
    if(!draft.autor.trim()){ bg.querySelector('#ef_autor').classList.add('err'); ok=false; }
    if(!archValidate(bg, 'ef', draft)) ok=false;
    if(!ok){ const e = bg.querySelector('.err'); if(e) e.scrollIntoView({behavior:'smooth', block:'center'}); return; }
    if(draft.autor && !STATE.catalogs.autors.includes(draft.autor)) STATE.catalogs.autors.push(draft.autor);
    if(draft.arranjador && !STATE.catalogs.arranjadors.includes(draft.arranjador)) STATE.catalogs.arranjadors.push(draft.arranjador);
    if(draft.estil && !STATE.catalogs.estils.includes(draft.estil)) STATE.catalogs.estils.push(draft.estil);
    draft.instrExterns.forEach(i=>{ if(!STATE.catalogs.instrumentsExterns.includes(i)) STATE.catalogs.instrumentsExterns.push(i); });

    const general = draft.general, estatParts = draft.estatParts;

    const oldByPid = {}; (piece.aparicions||[]).forEach(a=>{ if(a.projecteId) oldByPid[a.projecteId]=a; });
    const newAparicions = draft.projecteIds.map(pid=>{
      const pp = STATE.catalogs.projectes.find(x=>x.id===pid);
      const old = oldByPid[pid];
      return old || { projecteId:pid, projecte:pp?pp.name:'', any:pp?pp.year:null, seccio:'', fitxers:0, estatParts };
    });

    Object.assign(piece, {
      title: draft.nom.trim(), composer: draft.autor.trim(), arranger: draft.arranjador.trim(),
      obs: draft.comentaris.trim(), aparicions: newAparicions, original: draft.original,
      estil: draft.estil.trim(), general, estatParts,
      specials: draft.instrExterns, ...(missingFields(draft)||{}),
      ...archApply(draft),
      nomesFisicPendent: !!piece.nomesFisicPendent && estatParts==='Per revisar',
    });
    if(draft.revisats.size) marcaRevisada(piece, [...draft.revisats]);
    persist(); refreshViews(); close();
    if(opts.back) openDetail(piece.id);
  });
}

  makeMultiSelect(document.getElementById('ms_projecte'), {items:projItems, values:[], placeholder:'Cerca un projecte', allowCreate:false, onChange:v=>{
    draft.projecteIds = v.map(label=>{ const found = STATE.catalogs.projectes.find(p=> projLabelOf(p)===label); return found? found.id : null; }).filter(Boolean);
  }});

  bindArch(root, 'f', draft, updatePreview);
  makeMultiSelect(document.getElementById('ms_instr'), {items:STATE.catalogs.instrumentsExterns, values:[], placeholder:'p. ex. Cor, Piano', onChange:v=>draft.instrExterns=v});

  document.getElementById('in_nom').addEventListener('input', e=>{ draft.nom=e.target.value; document.getElementById('f_nom').classList.remove('err'); });
  document.getElementById('in_comentaris').addEventListener('input', e=>draft.comentaris=e.target.value);
  updatePreview();

  document.getElementById('regCancel').addEventListener('click', ()=> renderRegistrar());

  document.getElementById('regSave').addEventListener('click', ()=>{
    let ok = true;
    if(!draft.nom.trim()){ document.getElementById('f_nom').classList.add('err'); ok=false; }
    if(!draft.autor.trim()){ document.getElementById('f_autor').classList.add('err'); ok=false; }
    if(!archValidate(root, 'f', draft)) ok=false;
    if(!ok){ const e = root.querySelector('.err'); if(e) e.scrollIntoView({behavior:'smooth', block:'center'}); return; }

    if(draft.autor && !STATE.catalogs.autors.includes(draft.autor)) STATE.catalogs.autors.push(draft.autor);
    if(draft.arranjador && !STATE.catalogs.arranjadors.includes(draft.arranjador)) STATE.catalogs.arranjadors.push(draft.arranjador);
    if(draft.estil && !STATE.catalogs.estils.includes(draft.estil)) STATE.catalogs.estils.push(draft.estil);
    draft.instrExterns.forEach(i=>{ if(!STATE.catalogs.instrumentsExterns.includes(i)) STATE.catalogs.instrumentsExterns.push(i); });

    const general = draft.general, estatParts = draft.estatParts;
    const aparicions = draft.projecteIds.map(pid=>{
      const pp = STATE.catalogs.projectes.find(x=>x.id===pid);
      return { projecteId:pid, projecte:pp?pp.name:'', any:pp?pp.year:null, seccio:'', fitxers:0, estatParts };
    });

    const piece = {
      id: uid('o'),
      title: draft.nom.trim(),
      composer: draft.autor.trim(),
      arranger: draft.arranjador.trim(),
      obs: draft.comentaris.trim(),
      original: draft.original,
      aparicions: aparicions,
      estil: draft.estil.trim(),
      fileCount: 0,
      general: general,
      estatParts: estatParts,
      partsDetectades: [],
      specials: draft.instrExterns,
      partsNoDetectades: [], faltenInventari: [], totesFaltenParts: false,
      ...(missingFields(draft)||{}),
      ...archApply(draft),
      autoriaConflicte: false,
      fontsPaper: false, origenManual: true,
      pendentAcceptacio: STATE.role!=='gestio',
      registradaPer: STATE.user ? STATE.user.name : '', dataRegistre: new Date().toLocaleDateString('ca-ES', {day:'numeric',month:'long',year:'numeric'}),
    };
    STATE.pieces.push(piece);
    persist();
    setScreen('consultar');
    STATE.filters.q = piece.title;
    document.getElementById('searchInput').value = piece.title;
    renderList();
  });
}

function csvCell(v){
  v = v==null ? '' : String(v);
  return /[";\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function exportCsv(){
  const rows = [...STATE.pieces].sort((a,b)=> (a.title||'').localeCompare(b.title||'', 'ca', {sensitivity:'base'}));
  const lines = [CSV_COLS.map(c=> csvCell(c[0])).join(';'),
    ...rows.map(p=> CSV_COLS.map(c=> csvCell(c[1](p))).join(';'))];
  // BOM perquè Excel reconegui els accents; «;» és el separador que Excel espera en català
  downloadFile(`arxiu-obres-${exportDate()}.csv`, '﻿'+lines.join('\r\n'), 'text/csv;charset=utf-8');
  showSavePill(`CSV baixat (${rows.length} obres)`);
}
/* restaurar: la còpia substitueix les obres i les llistes; el servidor ho desa tot alhora i n'enregistra l'historial */
function parseBackup(text){
  let d; try{ d = JSON.parse(text); }catch(e){ throw new Error('El fitxer no és una còpia de seguretat vàlida.'); }
  if(!d || d.format!=='arxiu-banda-terrassa' || !Array.isArray(d.obres) || !d.catalegs || typeof d.catalegs!=='object')
    throw new Error('Aquest fitxer no és una còpia de seguretat de l\'arxiu.');
  const ids = new Set();
  for(const o of d.obres){
    if(!o || typeof o!=='object' || !o.id || typeof o.id!=='string' || typeof o.title!=='string') throw new Error('La còpia té obres mal formades.');
    if(ids.has(o.id)) throw new Error('La còpia té obres repetides.');
    ids.add(o.id);
  }
  const catalogs = {estils:[], autors:[], arranjadors:[], parts:[], instrumentsExterns:[], projectes:[], ubicacions:[]};
  Object.keys(catalogs).forEach(k=>{ if(Array.isArray(d.catalegs[k])) catalogs[k] = d.catalegs[k]; });
  return {obres:d.obres, catalogs, exportat:d.exportat, exportatPer:d.exportatPer};
}
async function restoreBackup(file){
  let b;
  try{ b = parseBackup(await file.text()); }catch(e){ alert(e.message); return; }
  await refreshFromServer();   // compara amb les dades més recents
  const cur = new Map(STATE.pieces.map(o=> [o.id, JSON.stringify(o)]));
  const nova = new Map(b.obres.map(o=> [o.id, JSON.stringify(o)]));
  let afegeix = 0, canvia = 0, esborra = 0;
  nova.forEach((j, id)=>{ if(!cur.has(id)) afegeix++; else if(cur.get(id)!==j) canvia++; });
  cur.forEach((_, id)=>{ if(!nova.has(id)) esborra++; });
  const quan = b.exportat ? new Date(b.exportat).toLocaleString('ca-ES', {dateStyle:'long', timeStyle:'short'}) : 'data desconeguda';
  const bg = document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML = `<div class="sheet">
    <div class="sheet-head"><div class="htxt"><h2 style="display:block">Restaura la còpia</h2>
      <div class="hsub">Feta el ${esc(quan)}${b.exportatPer? ' per '+esc(b.exportatPer):''}</div></div>
      <button class="sheet-close" id="rsClose"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="sheet-body">
      <ul class="restsum">
        <li><span>Obres a la còpia</span><b>${b.obres.length}</b></li>
        <li><span>Obres actuals</span><b>${STATE.pieces.length}</b></li>
        <li><span>Es recuperaran</span><b>${afegeix}</b></li>
        <li><span>Es modificaran</span><b>${canvia}</b></li>
        <li><span>S'eliminaran</span><b>${esborra}</b></li>
      </ul>
      <p class="hint">Les dades actuals se substituiran per les de la còpia, també les llistes de Configuració. Abans de fer-ho, es baixarà una còpia de l'estat actual per si cal tornar enrere.</p>
      <div class="btnbar"><button class="btn btn-danger-ghost" id="rsGo" style="flex:1">Restaura</button></div>
    </div>
  </div>`;
  document.body.appendChild(bg); document.body.classList.add('locked');
  function close(){ bg.remove(); document.body.classList.remove('locked'); }
  bg.querySelector('#rsClose').addEventListener('click', close);
  bg.querySelector('#rsGo').addEventListener('click', async ()=>{
    const go = bg.querySelector('#rsGo');
    if(saving){ showSavePill('Encara s\'estan desant canvis. Torna-ho a provar d\'aquí a un moment.'); return; }
    clearTimeout(saveTimer);
    go.disabled = true; go.textContent = 'Restaurant…';
    exportBackup('arxiu-abans-de-restaurar');
    STATE.pieces = b.obres;
    STATE.catalogs = b.catalogs;
    const canvis = pendingChanges();
    saving = true;
    try{
      if(canvis){
        canvis.forca = true;   // la còpia substitueix el que hi hagi, també els canvis recents d'altres
        applySaveResult(canvis, await rpc('desa_canvis', {p_token: STATE.session.token, p: canvis}));
      }
      close(); refreshViews(); renderConfig();
      showSavePill('Còpia restaurada');
    }catch(e){
      close();
      if(e.codi==='SESSIO'){ sessionExpired(); return; }
      showSavePill(e.codi==='PERMIS' ? 'No tens permís per restaurar' : 'No s\'ha pogut restaurar. No s\'ha canviat res.');
      await loadData();
    }finally{ saving = false; }
  });
}

function unifyRename(listKey, oldVal, newVal){
  let count = 0;
  function mergeArr(arr){
    if(!arr || !arr.includes(oldVal)) return arr;
    return [...new Set(arr.map(x=> x===oldVal? newVal : x))];
  }
  STATE.pieces.forEach(p=>{
    let touched = false;
    if(listKey==='autors'){
      if(p.composer===oldVal){ p.composer = newVal; touched = true; }
      else if(p.composer && p.composer.includes('; ')){
        const parts = p.composer.split('; ');
        if(parts.includes(oldVal)){ p.composer = [...new Set(parts.map(x=>x===oldVal?newVal:x))].join('; '); touched = true; }
      }
    } else if(listKey==='arranjadors'){
      if(p.arranger===oldVal){ p.arranger = newVal; touched = true; }
      else if(p.arranger && p.arranger.includes('; ')){
        const parts = p.arranger.split('; ');
        if(parts.includes(oldVal)){ p.arranger = [...new Set(parts.map(x=>x===oldVal?newVal:x))].join('; '); touched = true; }
      }
    } else if(listKey==='estils'){
      if(p.estil===oldVal){ p.estil = newVal; touched = true; }
    } else if(listKey==='instrumentsExterns'){
      const merged = mergeArr(p.specials);
      if(merged){ p.specials = merged; touched = true; }
    } else if(listKey==='ubicacions'){
      const merged = mergeArr(p.ubicacioFisica);
      if(merged){ p.ubicacioFisica = merged; touched = true; }
    } else if(listKey==='parts'){
      const m1 = mergeArr(p.partsDetectades), m2 = mergeArr(p.partsNoDetectades);
      if(m1){ p.partsDetectades = m1; touched = true; }
      if(m2){ p.partsNoDetectades = m2; touched = true; }
    }
    if(touched) count++;
  });
  return count;
}

    renderConfig();
  };
  body.querySelector('#cfgAddOk').addEventListener('click', add);
  body.querySelector('#cfgNew').addEventListener('keydown', e=>{ if(e.key==='Enter') add(); });
}
function editProjecte(id, done){
  const proj = id? STATE.catalogs.projectes.find(p=>p.id===id) : {id:uid('proj'), name:'', year:null};
  const isNew = !id;
  const bg = document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML = `<div class="sheet">
    <div class="sheet-head"><div class="htxt"><h2 style="display:block">${isNew?'Nou projecte':'Edita projecte'}</h2></div>
      <button class="sheet-close" id="pClose"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="sheet-body">
      <div class="field"><label>Nom</label><input class="input" id="p_name" value="${esc(proj.name)}"></div>
      <div class="field"><label>Any</label><input class="input" id="p_year" type="number" value="${proj.year||''}"></div>
      <div class="field"><label>Enllaç de la carpeta a Box <span class="opt">opcional</span></label><input class="input" id="p_link" placeholder="https://…" value="${esc(proj.link||'')}"></div>
      <div class="btnbar"><button class="btn primary" id="pSave" style="flex:1">Desa</button></div>
    </div>
  </div>`;
  document.body.appendChild(bg); document.body.classList.add('locked');
  function close(){ document.body.removeChild(bg); document.body.classList.remove('locked'); }
  bg.querySelector('#pClose').addEventListener('click', close);
  bg.querySelector('#pSave').addEventListener('click', ()=>{
    proj.name = bg.querySelector('#p_name').value.trim() || 'Sense nom';
    proj.year = Number(bg.querySelector('#p_year').value) || null;
    proj.link = bg.querySelector('#p_link').value.trim();
    if(isNew) STATE.catalogs.projectes.push(proj);
    STATE.pieces.forEach(p=> (p.aparicions||[]).forEach(a=>{ if(a.projecteId===proj.id){ a.projecte = proj.name; a.any = proj.year; } }));
    persist(); close(); done();
    if(isNew && STATE.screen==='consultar') openProjecteSheet(proj.id);
  });
}

/* ================= AJUDA ================= */
function openHelp(){
  const gestio = STATE.role==='gestio';
  const tag = (cls, t)=> `<span class="statusline ${cls}"><span class="dot"></span>${t}</span>`;
  const bg = document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML = `<div class="sheet">
    <div class="sheet-head"><div class="htxt"><h2 style="display:block">Com funciona l'arxiu</h2></div>
      <button class="sheet-close" id="hClose" aria-label="Tanca"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="sheet-body">
      <p class="help-intro">L'arxiu recull totes les partitures de la banda: què tenim de cada obra, on és i si està completa per poder-la tocar.</p>

      <h3 class="help-h">Què vol dir cada color</h3>
      <div class="help-row"><span class="swatch ok"></span><div><b>Verd — La podem tocar</b>Hi ha la partitura general del director i totes les parts de la banda.
        <div class="tagrow">${tag('ok','Completa')}</div></div></div>
      <div class="help-row"><span class="swatch bad"></span><div><b>Vermell — Falta alguna cosa</b>Sabem que no tenim la partitura general, o que falten parts d'alguns instruments. Si en sabem quines, surten al costat.
        <div class="tagrow">${tag('bad','Falta general')}${tag('bad','Falten parts')}${tag('bad','Falta general i parts')}</div></div></div>
      <div class="help-row"><span class="swatch warn"></span><div><b>Groc — Cal comprovar-ho</b>Encara no sabem si hi és tot: algú ha d'anar a l'arxiu a mirar-ho. «Cal revisar» vol dir que hi ha alguna dada per corregir.
        <div class="tagrow">${tag('warn','Sense verificar')}${tag('warn','Parts sense verificar')}${tag('warn','General sense verificar')}<span class="minitag warn">Cal revisar</span></div></div></div>
      <div class="help-row"><span>🎨</span><div><b>Si en surten dos</b>El vermell sempre va primer. Per exemple, «Falta general» i «Parts sense verificar» vol dir que no hi ha la general i que les parts encara s'han de comprovar.</div></div>

      <h3 class="help-h">On es troben les partitures</h3>
      <div class="help-row"><span>☁️</span><div><b>Al Box</b>Hi ha una còpia digital. És el primer lloc on buscar-la.</div></div>
      <div class="help-row"><span>🗄️</span><div><b>En físic</b>Hi ha una còpia en paper a l'arxiu (Armari 0P2). Quan només és en paper, la targeta ho indica a sota: «Només en físic».</div></div>

      <h3 class="help-h">Com consultar-ho</h3>
      <div class="help-row"><span>🔎</span><div><b>Cercador</b>Escriu qualsevol dada: títol, autor, projecte, any, instrument… Pots escriure diverses paraules, com «nadal 2023».</div></div>
      <div class="help-row"><span>☰</span><div><b>Dues vistes</b>La vista ampliada mostra totes les etiquetes. La compacta mostra una línia per obra amb una marca de color a l'esquerra. En totes dues, l'índex de lletres de la dreta et porta directament a una lletra.</div></div>
      <div class="help-row"><span>🎼</span><div><b>Projectes</b>Cada concert o actuació amb el seu repertori. Des de la fitxa d'una obra pots anar als projectes on s'ha tocat.</div></div>
      ${gestio ? `
      <h3 class="help-h">Amb el rol d'edició</h3>
      <div class="help-row"><span>📋</span><div><b>Per revisar</b>La feina pendent agrupada: registres dels músics per acceptar, obres a revisar, parts o generals que falten i obres per comprovar.</div></div>
      <div class="help-row"><span>✏️</span><div><b>Editar</b>Obre una obra o un projecte i toca «Edita». Des de «Per revisar», les obres s'obren directament per editar.</div></div>
      <div class="help-row"><span>⚙️</span><div><b>Configuració</b>Les llistes que fan servir els formularis: ubicacions, compositors, plantilla de la banda… Si hi canvies un nom, es canvia a totes les obres.</div></div>`
      : `
      <div class="help-row"><span>➕</span><div><b>Registrar</b>Si trobes una obra que no hi és, registra-la. La Junta la revisarà i l'aprovarà.</div></div>`}
      <div class="btnbar"><button class="btn primary" id="hOk">Entesos</button></div>
    </div>
  </div>`;
  document.body.appendChild(bg); document.body.classList.add('locked');
  const close = ()=>{ document.body.removeChild(bg); document.body.classList.remove('locked'); };
  bg.querySelector('#hClose').addEventListener('click', close);
  bg.querySelector('#hOk').addEventListener('click', close);
  bg.addEventListener('click', e=>{ if(e.target===bg) close(); });
}
document.getElementById('helpBtn').addEventListener('click', openHelp);

/* ================= INIT ================= */
document.querySelectorAll('[data-view]').forEach(b=> b.classList.toggle('on', b.dataset.view===STATE.view));
STATE.user = null; STATE.session = null;
setRole('musica');
const saved = loadSession();
if(saved) startSession(saved); else showLogin();
</script>
</body></html>
