<!doctype html>
<html lang="ca"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2338">
<title>Arxiu · Banda de Terrassa</title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Arxiu">
<style>
:root{
  --navy:#0E2338; --bg:#F8FAFC; --surface:#FFFFFF; --ink:#0E2338; --ink-2:#44546A; --ink-3:#586578;
  --rule:#E2E8F0; --line:#CBD5E1; --band:#E6ECF3;
  --ok:#17784A; --warn:#B8860B; --warn-t:#7A5500; --warn-bg:#FBF1D4; --bad:#B3121F; --bad-bg:#FBE4E6;
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --shadow-sm:0 1px 2px rgba(14,35,56,.08); --shadow-lg:0 8px 24px rgba(14,35,56,.18), 0 1px 3px rgba(14,35,56,.12);
  --ease-spring:cubic-bezier(.34,1.56,.64,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sf);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:6px}
h1,h2,h3,p,ul{margin:0}
.hidden{display:none!important}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- capçalera ---------- */
.top{position:sticky;top:-62px;z-index:20;background:var(--navy);color:#fff;border-radius:0 0 28px 28px;padding:calc(var(--safe-t) + 14px) 20px 18px}
.top-brand{max-width:680px;margin:0 auto;height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.lg2{width:40px;height:40px;border-radius:11px;background:#fff;display:grid;place-items:center;flex:none}
.lg2 img{width:32px;height:32px;object-fit:contain}
.brand b{display:block;font:700 17px/20px var(--sf);letter-spacing:-.3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:600 13px/16px var(--sf);color:#C9D5E4}
.top-act{display:flex;gap:8px;flex:none}
.qm{width:40px;height:40px;border-radius:20px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font:700 19px/1 var(--sf);flex:none;transition:transform .15s var(--ease-spring)}
.qm:active{transform:scale(.92)}
.qm .ic{width:20px;height:20px}
.pt{max-width:680px;margin:14px auto 0;height:46px;border-radius:23px;background:rgba(255,255,255,.12);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;gap:2px}
.pt button{border:0;background:transparent;border-radius:20px;font:700 15px/1 var(--sf);color:#C9D5E4;transition:background .2s var(--ease-out),color .2s}
.pt button.on{background:#fff;color:var(--navy)}
body[data-screen=config] .pt, body[data-screen=registrar] .pt{display:none}
body[data-screen=config] .top, body[data-screen=registrar] .top{top:0;padding-bottom:22px}

main{max-width:680px;margin:0 auto;padding:18px 20px calc(var(--safe-b) + 120px);animation:fadeUp .35s var(--ease-out)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- barra inferior flotant ---------- */
.fbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 14px);height:64px;border-radius:32px;background:#fff;box-shadow:var(--shadow-lg);display:flex;padding:6px;gap:4px;z-index:30}
.fbar button{width:72px;border:0;border-radius:26px;display:grid;place-items:center;background:transparent;color:var(--ink-3);transition:background .2s var(--ease-out),color .2s}
.fbar button.on{background:var(--navy);color:#fff}
.fbar .ic{width:26px;height:26px}
body[data-screen=registrar] .fbar{display:none}
.savepill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 92px);max-width:calc(100vw - 32px);text-align:center;background:var(--navy);color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:14px;z-index:90;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .25s}
.savepill.show{opacity:1}

/* ---------- cerca, comptador, vista ---------- */
.search{position:relative;display:flex;align-items:center;gap:10px;height:48px;border-radius:24px;background:#fff;border:1px solid var(--line);padding:0 8px 0 18px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:400 17px/1 var(--sf);height:46px}
.search input::placeholder{color:var(--ink-3)}
.search:focus-within{border-color:var(--navy)}
.search svg{display:none}
.cfgsearch{height:46px;min-width:0}.cfgsearch input{height:44px;font-size:16px;width:100%;min-width:0}
.search button{border:0;background:transparent;font:700 15px/1 var(--sf);color:var(--navy);height:36px;padding:0 10px;border-radius:18px;display:inline-flex;align-items:center;gap:6px;flex:none}
.fbadge{background:var(--navy);color:#fff;border-radius:10px;font-size:11px;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center}
.cnt{font:400 13px/18px var(--sf);color:var(--ink-3);margin:10px 4px 0}
.lhrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:6px 0 4px}
.af{font:700 15px/20px var(--sf);min-width:0;display:flex;gap:10px;align-items:baseline;flex:1}
.aft{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);font-weight:600}
.af button{flex:none;white-space:nowrap}
.af button{border:0;background:transparent;padding:0;color:var(--bad);font:700 15px/20px var(--sf)}
.viewtoggle,.seg{display:flex;border:1px solid var(--line);border-radius:16px;background:#fff;padding:2px;margin-left:auto}
.viewtoggle button{border:0;background:transparent;height:32px;width:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink-2)}
.viewtoggle button.on{background:var(--navy);color:#fff}
.viewtoggle .ic{width:20px;height:20px}
.letter{font:700 13px/1 var(--sf);color:var(--ink-3);margin:18px 4px 8px}
.letter:first-child{margin-top:4px}
.cards{display:flex;flex-direction:column}
#list{padding-right:16px}
.azindex{position:fixed;right:max(2px, calc((100vw - 680px) / 2 - 22px));transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;align-items:center;padding:4px 2px;touch-action:none;user-select:none;-webkit-user-select:none}
.azindex button{border:0;background:transparent;color:var(--navy);font-weight:700;line-height:1;padding:0 6px;min-height:0;display:flex;align-items:center}
.empty{padding:42px 16px;text-align:center;color:var(--ink-3)}
.empty p{margin:0 auto;max-width:36ch;font-size:15px}

/* ---------- targeta d'obra amb marc corbat ---------- */
.fr{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:16px;border-left:8px solid var(--c,var(--line));padding:13px 16px 13px 14px;margin-bottom:10px;box-shadow:var(--shadow-sm);transition:transform .18s var(--ease-spring)}
.fr[data-id],.fr[data-pid],.fr[data-oid]{cursor:pointer}
.fr[data-id]:active,.fr[data-pid]:active,.fr[data-oid]:active{transform:scale(.985)}
.fr.ok{--c:var(--ok)} .fr.warn{--c:var(--warn)} .fr.bad{--c:var(--bad)} .fr.nv{--c:var(--navy)} .fr.n{--c:var(--line)}
.fr .tt,.tt{font:700 19px/24px var(--sf);letter-spacing:-.4px;overflow-wrap:anywhere}
.fr .who{font:400 15px/20px var(--sf);color:var(--ink-2)}
.fr .st{font:600 13px/18px var(--sf);margin-top:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn-t)} .st.bad{color:var(--bad)}
.fr .loc,.loc{font:400 13px/18px var(--sf);color:var(--ink-3);margin-top:2px}
.flag{font:700 13px/1 var(--sf);color:var(--warn-t);background:var(--warn-bg);border-radius:12px;height:24px;padding:0 10px;display:inline-grid;place-items:center;margin-left:auto}
.fr.cmp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;margin-bottom:8px}
.fr.cmp .tt{font-size:17px;line-height:22px}
.fr.cmp .st{margin-top:2px}
.fr.cmp .flag{flex:none}
.fr .accbtns{display:flex;gap:8px;margin-top:12px}
.fr .reasons{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--warn-t);line-height:1.5}
.fr .ct{font:800 15px/20px var(--sf);letter-spacing:-.2px;margin-bottom:2px}
.fr.warn .ct{color:var(--warn-t)}
.fr .kv .i:first-child{border-top:0}
.fr .kv .i:last-child{padding-bottom:2px}
.fr p.t2{font:400 15px/20px var(--sf);color:var(--ink-2)}
.fr ul.t2{padding-left:18px;font:400 15px/21px var(--sf);color:var(--ink-2)}
.fr .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fr .row > div{min-width:0}
.fr .row.prow{align-items:center}
.row .main{flex:1;min-width:0}

/* ---------- elements bàsics ---------- */
.btn{height:52px;border-radius:26px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 17px/1 var(--sf);background:var(--navy);color:#fff;padding:0 22px;transition:transform .2s var(--ease-spring),opacity .12s;text-decoration:none}
.btn:active{transform:scale(.97);opacity:.92}
.btn.o{background:#fff;color:var(--navy);outline:1.5px solid var(--navy);outline-offset:-1.5px}
.btn.s,.btn-sm{height:44px;padding:0 20px;font-size:15px}
.btn.bd{background:#fff;color:var(--bad);outline:1.5px solid var(--bad);outline-offset:-1.5px}
.btn.w{width:100%}
.btn:disabled{opacity:.5}
.pill{font:700 13px/1 var(--sf);height:36px;padding:0 14px;border-radius:18px;display:inline-grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--navy)}
.ib{width:40px;height:40px;border-radius:20px;border:0;display:grid;place-items:center;outline:1.5px solid var(--line);outline-offset:-1.5px;background:#fff;color:var(--navy);flex:none;transition:transform .15s var(--ease-spring)}
.ib:active{transform:scale(.92)}
.ib.d{color:var(--bad);outline-color:var(--bad)}
.ib .ic{width:20px;height:20px}
.h1{font:800 28px/32px var(--sf);letter-spacing:-.8px}
.sub{font:400 15px/20px var(--sf);color:var(--ink-2);margin-top:6px}
.hint{font:400 13px/18px var(--sf);color:var(--ink-3);margin-top:6px}
.sec-h{font:800 17px/22px var(--sf);letter-spacing:-.3px;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
h3.sec{font:800 17px/22px var(--sf);letter-spacing:-.3px;margin:22px 0 10px}
h3.sec:first-child{margin-top:4px}
.seccnt{font-weight:600;color:var(--ink-2);letter-spacing:0;margin-left:6px}
.kv .i{display:flex;gap:16px;padding:13px 0;border-top:1px solid var(--rule);font:400 15px/20px var(--sf)}
.kv .k{width:128px;color:var(--ink-2);flex:none}
.kv .v{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.kv .v.bad{color:var(--bad)} .kv .v.warn{color:var(--warn-t)}
.kv .v div + div{margin-top:2px}
.kv .v .sm{display:block;font-weight:400;color:var(--ink-2)}
.ia{font:700 11px/1 var(--sf);letter-spacing:.4px;color:var(--ink-3);outline:1px solid var(--line);outline-offset:-1px;border-radius:6px;padding:4px 6px;flex:none}
.ia.d{color:#C9D5E4;outline-color:rgba(255,255,255,.5)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 12px;font:600 14px/1.35 var(--sf)}

/* ---------- bandes de secció (formularis) ---------- */
.sec{margin-top:26px}
.sec.first{margin-top:22px}
.band{background:var(--band);color:var(--navy);border-radius:12px;border-left:6px solid var(--navy);height:36px;display:flex;align-items:center;padding:0 14px 0 12px;font:800 15px/20px var(--sf);letter-spacing:-.2px;margin-bottom:12px}
.hn,.fl i{font-style:normal;font-weight:400;color:var(--ink-3);margin-left:6px;font-size:13px}
.band .hn{color:var(--ink-2)}
.hn::before,.fl i::before{content:"("} .hn::after,.fl i::after{content:")"}
.fl{display:block;font:700 13px/18px var(--sf);margin:18px 0 8px}
.field{margin:0}
.field:first-child .fl{margin-top:0}
.errtext{display:none;color:var(--bad);font:600 13px/18px var(--sf);margin-top:6px}
.field.err .errtext{display:block}
.field.err .inp2,.field.err .combo-input{border-color:var(--bad)}
.field.err .three, .field.err .chips{outline:1.5px solid var(--bad);outline-offset:4px;border-radius:14px}
.inp2,.textarea,.combo-input,.inp{width:100%;height:52px;border-radius:14px;background:#fff;border:1px solid var(--line);padding:0 16px;font:400 17px/1 var(--sf);outline:none;transition:border-color .15s}
.inp2:focus,.textarea:focus,.combo-input:focus,.inp:focus{border-color:var(--navy)}
.inp2:disabled{opacity:.5}
.textarea{height:auto;min-height:96px;padding:14px 16px;line-height:1.4;resize:vertical}
.three{display:flex;gap:8px}
.three button{flex:1;min-height:52px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font:700 15px/1.1 var(--sf);padding:0 6px;display:grid;place-items:center;text-align:center;transition:background .15s,color .15s,border-color .15s}
.three button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.three button.on.bd{background:var(--bad);border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font:700 15px/1 var(--sf);display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,border-color .15s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on.bd{background:var(--bad);border-color:var(--bad)}
.chip.add{border-style:dashed;color:var(--navy)}
.chip:disabled{opacity:.4}
.chips.s .chip{min-height:38px}
.addline{display:flex;gap:8px;margin-top:10px}
.addline .inp2{flex:1;height:46px}
.addline .btn{height:46px;font-size:15px;padding:0 18px}
.link{border:0;background:transparent;color:var(--navy);font:700 13px/18px var(--sf);padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.gr{width:100%;display:flex;align-items:center;gap:10px;padding:13px 0;border:0;border-top:1px solid var(--rule);background:transparent;text-align:left;font:700 15px/20px var(--sf)}
.gr > span:first-child{flex:1}
.gr .sm{font-weight:400;color:var(--ink-3);text-align:right;max-width:55%}
.gr .sm.on{font-weight:700;color:var(--bad)}
.gr .ex{color:var(--navy);width:14px;text-align:center}
.grp.dis{opacity:.4;pointer-events:none}
.grp .chips{padding-bottom:10px}
.steps{display:flex;gap:8px;align-items:center;margin-top:16px}
.steps b{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);color:var(--ink-3);display:grid;place-items:center;font:800 13px/1 var(--sf)}
.steps b.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.steps b.done{border-color:var(--ok);color:var(--ok)}
.steps i{flex:1;height:2px;background:var(--line);max-width:36px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:14px 20px calc(var(--safe-b) + 18px);background:linear-gradient(to bottom,rgba(248,250,252,0),var(--bg) 22px);display:flex;gap:10px}
.foot .btn{flex:1}
.foot .back{flex:0 0 112px}
.foot-in{max-width:680px;margin:0 auto;width:100%;display:flex;flex-wrap:wrap;gap:10px}
.foot-in .btn.cx{flex:1 1 100%}
.foot-in .btn{flex:1} .foot-in .back{flex:0 0 112px}
.ctl{display:flex;justify-content:space-between;align-items:center}

/* ---------- pàgines a pantalla completa (fitxa, projecte, edició) ---------- */
.page{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;animation:pageIn .28s var(--ease-out)}
@keyframes pageIn{from{opacity:.4;transform:translateY(18px)}to{opacity:1;transform:none}}
.phead{background:var(--navy);color:#fff;border-radius:0 0 28px 28px;padding:calc(var(--safe-t) + 14px) 20px 24px}
.phead-in,.pbody{max-width:680px;margin:0 auto}
.ptop{display:flex;justify-content:space-between;align-items:center;height:44px}
.ptitle{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.ptitle h1{font:800 28px/32px var(--sf);letter-spacing:-.8px;color:#fff;overflow-wrap:anywhere}
.pwho{font:400 17px/22px var(--sf);color:#C9D5E4;margin-top:6px}
.pbody{padding:20px 20px calc(var(--safe-b) + 120px)}
.pbody.light{padding-top:calc(var(--safe-t) + 14px)}
.ptop.light{margin-bottom:14px}
.pbody .fr{margin-bottom:12px}
.pbody .fr .btn{margin-top:12px}
.sticky-foot{position:sticky;bottom:0;z-index:5;padding:14px 20px calc(var(--safe-b) + 18px);background:linear-gradient(to bottom,rgba(248,250,252,0),var(--bg) 22px)}
.sticky-foot .foot-in{max-width:680px}
.pickl{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);overflow:hidden;margin:8px 0 6px}
.pickrow{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 14px;border:0;border-top:1px solid var(--rule);background:transparent;text-align:left}
.pickrow:first-child{border-top:0}
.pickrow:active{background:var(--band)}
.pickrow .main{flex:1;min-width:0;display:flex;flex-direction:column}
.pickrow .title{font-weight:700;font-size:15px}
.pickrow .authors{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickplus{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.note-line{background:var(--band);border-radius:12px;padding:10px 12px;font:400 14px/20px var(--sf);color:var(--ink-2);margin-top:12px}
.revitem{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid rgba(122,85,0,.18);cursor:pointer;font:400 14px/20px var(--sf);color:var(--ink-2)}
.revitem input{flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:var(--ok)}

/* ---------- fulls modals (filtres, ajuda, edicions petites) ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(14,35,56,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-end;justify-content:center;height:100%;height:100dvh;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:#fff;width:calc(100% - 16px);max-width:600px;margin-bottom:8px;border-radius:32px;max-height:calc(100dvh - 92px);overflow-y:auto;overscroll-behavior:contain;padding:20px 20px 0;animation:sheetUp .32s var(--ease-spring)}
@keyframes sheetUp{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:sticky;top:-20px;background:#fff;z-index:2;padding:0 0 12px;margin-top:0}
.sheet-head .htxt{flex:1;min-width:0}
.sheet-head h2{font:800 28px/32px var(--sf);letter-spacing:-.8px}
.sheet-head .hsub{font:400 15px/20px var(--sf);color:var(--ink-2);margin-top:4px}
.sheet-close{border:1px solid var(--line);background:#fff;height:36px;padding:0 14px;border-radius:18px;display:grid;place-items:center;color:var(--navy);flex:none;font:700 13px/1 var(--sf)}
.sheet-close svg{display:none}
.sheet-close::after{content:"Tanca"}
.sheet-body{padding:4px 0 24px}
.sheet .btnbar,.btnbar{display:flex;gap:10px;position:sticky;bottom:0;z-index:3;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 16px);padding:16px 0 calc(var(--safe-b) + 16px)}
.btnbar .btn{flex:1}
.sheet .field{margin-bottom:14px}
.sheet .field label{display:block;font:700 13px/18px var(--sf);margin:0 0 8px}

/* ---------- combobox ---------- */

/* ---------- feina pendent i configuració ---------- */

/* ---------- inici de sessió ---------- */
body.auth > .top, body.auth > main, body.auth > .fbar, body.auth #azindex{display:none!important}

.lfield{display:grid;gap:8px;min-width:0}
.lfield > span{font:700 13px/18px var(--sf)}
.pass-wrap{position:relative}
.pass-wrap .inp{padding-right:48px}
.pass-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.pass-toggle svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pass-toggle .slash{opacity:0} .pass-toggle[aria-pressed="true"] .slash{opacity:1}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;font:400 15px/20px var(--sf)}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + span{background:var(--navy)}

.lbody .btn{width:100%;margin-top:8px}

@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }

/* ---------- fitxa i editor: llistes de files (v3) ---------- */
.gt{font:700 13px/18px var(--sf);color:var(--ink-2);margin:26px 4px 8px}
.gt.dis,.g2.dis{opacity:.4;pointer-events:none}

.rv{font-weight:600;text-align:right;max-width:58%;overflow-wrap:anywhere}

.rw.nt{display:block}.rw.nt p{margin:4px 0 0;color:var(--ink);font:400 15px/21px var(--sf);overflow-wrap:anywhere}

.stat{display:flex;gap:12px;align-items:flex-start;margin:4px 4px 6px}

<script>


const STANDARD_ORDER = ["Flautí","Flauta","Oboè","Fagot","Clarinet","Clarinet baix","Saxo alt","Saxo tenor","Saxo baríton","Trompa","Trompeta","Trombó","Bombardí","Tuba","Percussió"];

const STATE = {
  pieces: [],   // es carreguen del servidor en entrar
  catalogs: {estils:[], autors:[], arranjadors:[], parts:[], instrumentsExterns:[], projectes:[], ubicacions:[]},
  role: 'gestio', // 'musica' | 'gestio' — demo-only toggle until real accounts exist
  screen: 'consultar',
  filters: { q:'', estil:null, projecte:null, any:null, estat:null, general:null, ubicacio:null, lloc:null, original:null, instrExtern:null },
  view: (()=>{ try{ return localStorage.getItem('arxiu.vista')==='compacta' ? 'compacta' : 'ampliada'; }catch(e){ return 'ampliada'; } })(),
};

function norm(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }

/* ---------- nou sistema d'estat (5 etiquetes) ---------- */
function detailParts(p){
  if(p.totesFaltenParts) return 'totes';
  const clean = arr => (arr||[]).filter(x => x && x.trim().toUpperCase()!=='TOT');
  const auto = clean(p.partsNoDetectades);
  if(auto.length) return auto.join(', ');
  const manual = clean(p.faltenInventari);
  if(manual.length) return manual.join(', ');
  return '';
}
function missingCount(p){
  if(p.partsNoDetectades&&p.partsNoDetectades.length) return p.partsNoDetectades.length;
  if(p.faltenInventari&&p.faltenInventari.length) return p.faltenInventari.length;
  return 0;
}
function partsSeverity(p){
  if(p.estatParts !== 'Falten parts') return null;
  if(p.totesFaltenParts) return 'severe';
  const mcAuto = (p.partsNoDetectades||[]).length;
  const mcManual = (p.faltenInventari||[]).length;
  if(mcAuto > 0) return mcAuto <= 4 ? 'forgivable' : 'severe';
  if(mcManual > 0) return 'severe'; // font humana (Excel/Word) — mai es perdona, per poc que sigui
  return 'severe'; // "Falten parts" sense cap detall concret — es tracta amb cautela
}
/* ---------- estats de l'obra ----------
   Cada obra té dues facetes: la partitura general (G) i les parts de la banda (P).
   Cada faceta pot ser: 'ok' (la tenim), 'falta' o '?' (no ho sabem, «No ho sé»).
   Capa 1 — estat principal (una sola etiqueta): combina G i P. El vermell (el que falta) mana sobre el groc (sense verificar).
   Si l'estat és vermell i l'altra faceta és «No ho sé», se'n mostra una segona etiqueta del mateix nivell (groga).
   Capa 2 — etiqueta secundària: «Cal revisar».
   Ubicació — a la targeta, una línia petita només quan és en físic; a la fitxa, Al Box / En físic.
   Per canviar un nom o un color, només cal tocar aquestes taules. */
const ESTATS = {
  'complet':           {label:'Completa',                cls:'ok'},
  'falta-general':     {label:'Falta la general',        cls:'bad'},
  'falten':            {label:'Falten parts',            cls:'bad'},
  'falta-tot':         {label:'Falta la general i parts',cls:'bad'},
  'verificar':         {label:'Per verificar',           cls:'warn'},
  'verificar-general': {label:'General sense verificar', cls:'warn'},
  'verificar-parts':   {label:'Parts sense verificar',   cls:'warn'},
};
const FACETA = {  // com es mostra cada faceta a la fitxa i als filtres
  general: {ok:{label:'Sí', cls:'ok'},        falta:{label:'Falta', cls:'bad'},  '?':{label:'Per verificar', cls:'warn'}},
  parts:   {ok:{label:'Completes', cls:'ok'}, falta:{label:'Falten', cls:'bad'}, '?':{label:'Per verificar', cls:'warn'}},
};
function facets(p){
  const sev = partsSeverity(p);
  return {
    G: p.general==='si' ? 'ok' : p.general==='no' ? 'falta' : '?',
    P: (p.estatParts==='Completa' || sev==='forgivable') ? 'ok' : sev==='severe' ? 'falta' : '?',
    sev,
  };
}
function stateKey(G, P){
  if(G==='falta' && P==='falta') return 'falta-tot';
  if(G==='falta') return 'falta-general';
  if(P==='falta') return 'falten';
  if(G==='?' && P==='?') return 'verificar';
  if(G==='?') return 'verificar-general';
  if(P==='?') return 'verificar-parts';
  return 'complet';
}
function obraState(p){
  const {G, P, sev} = facets(p);
  const key = stateKey(G, P);
  // quan l'estat és vermell, la faceta desconeguda passa a la capa 2
  const extra = (G==='falta' && P==='?') ? ESTATS['verificar-parts'].label
              : (P==='falta' && G==='?') ? ESTATS['verificar-general'].label : '';

  return {key, ...ESTATS[key], G, P, sev, extra, detail: P==='falta' ? detailParts(p) : ''};
}
function stateText(st){ return st.label + (st.extra ? ' · '+st.extra : ''); }
/* ---------- notes de la fitxa ----------
   Tres blocs amb regles fixes.
   · Cal revisar       — incidències que requereixen feina; activen l'etiqueta i surten a «Per revisar».
   · Sobre la partitura — descripció del material (quin tipus de general hi ha, què conté la carpeta…).
   · A tenir en compte  — informació de servei: què falta comprovar, registres pendents, autoria buida.
   Les notes internes de la importació no es mostren. */
const NOTE_RULES = [  // s'aplica la primera que coincideix; si cap coincideix → «Sobre la partitura»
  {re:/^Unificada amb|^segons inventari\.?$/i, to:'ocult'},
  {re:/\.rar\b|\bzip\b|descomprimir|cal revisar/i, to:'revisar'},
];
function classifyNote(n){ const r = NOTE_RULES.find(r=>r.re.test(n)); return r ? r.to : 'partitura'; }
function obraNotes(p){
  const out = {revisar:[], partitura:[], compte:[]};
  const {G, P} = facets(p);
  // Cal revisar
  out.revisar = revisioItems(p).map(x=> x.text);
  // Sobre la partitura / notes de la importació
  (p.revisioNota||[]).forEach(n=>{ if(classifyNote(n)==='partitura') out.partitura.push(n); });
  if(p.notaPaperRevisada && p.notaPaperRevisada.length) out.partitura.push('Nota de l\'inventari en paper: «'+p.notaPaperRevisada.join('; ')+'».');
  // A tenir en compte
  if(p.nomesFisicPendent && (G==='?' || P==='?')) out.compte.push('Només registrada a l\'inventari en paper. Cal comprovar l\'inventari físic.');
  else {
    if(P==='?') out.compte.push('No s\'ha comprovat si hi ha totes les parts.');
    if(G==='?') out.compte.push('No s\'ha comprovat si hi ha la partitura general.');
  }
  if(p.pendentAcceptacio) out.compte.push('Registrada per '+(p.registradaPer||'un músic')+(p.dataRegistre? ' el '+p.dataRegistre : '')+' — pendent d\'aprovació.');
  if(!p.composer && !p.arranger) out.compte.push('No consta ni el compositor ni l\'arranjador.');
  else if(!p.composer) out.compte.push('No consta el compositor.');
  return out;
}
/* incidències de «Cal revisar»: cadascuna té una clau perquè es pugui marcar com a revisada */
function revisioItems(p){
  const out = [];
  if(p.autoriaConflicte) out.push({key:'autoria', text:'El compositor o l\'arranjador no coincideix entre les diverses còpies d\'aquesta obra — cal confirmar quin és el correcte.'});
  if(p.arranjadorRevisar) out.push({key:'arranjador', text:'El nom de l\'arranjador no s\'ha pogut normalitzar.'});
  if(p.notaPaper && p.notaPaper.length) out.push({key:'paper', text:'Hi ha una nota de l\'inventari en paper pendent de revisar: «'+p.notaPaper.join('; ')+'».'});
  (p.revisioNota||[]).forEach(n=>{ if(classifyNote(n)==='revisar') out.push({key:'nota:'+n, text:n}); });
  return out;
}
/* marca com a revisades les incidències indicades (totes si no se'n passa cap) */
function marcaRevisada(p, keys){
  keys = keys || revisioItems(p).map(x=> x.key);
  if(!keys.length) return;
  keys.forEach(k=>{
    if(k==='autoria') p.autoriaConflicte = false;
    else if(k==='arranjador') p.arranjadorRevisar = false;
    else if(k==='paper'){ p.notaPaperRevisada = [...(p.notaPaperRevisada||[]), ...(p.notaPaper||[])]; p.notaPaper = []; }
    else if(k.startsWith('nota:')){ const n = k.slice(5); p.revisioNota = (p.revisioNota||[]).filter(x=> x!==n); p.revisioFeta = [...(p.revisioFeta||[]), n]; }
  });
  p.revisada = {per: STATE.user ? STATE.user.name : '', data: new Date().toLocaleDateString('ca-ES', {day:'numeric', month:'long', year:'numeric'})};
}
/* marca «Detecció per IA»: dades obtingudes automàticament (poden tenir errors) */
function deteccioIA(p){ return !!p.origenIA || partsSeverity(p)==='forgivable'; }
function needsReview(p){ return obraNotes(p).revisar.length>0; }
function isDigital(p){ return !!p.escanejada || (p.fileCount||0)>0; }
function isFisic(p){ return !!p.enPaper || (p.ubicacioFisica&&p.ubicacioFisica.length>0); }
/* on és cada cosa: la general i les parts, cadascuna Al Box i/o En físic */
function placesOf(p){
  const base = [isDigital(p)&&'box', isFisic(p)&&'fisic'].filter(Boolean);
  return { g: p.generalNomesFisic ? ['fisic'] : base, p: p.partsNomesFisic ? ['fisic'] : base };
}
const PLACE_LABEL = {box:'Al Box', fisic:'En físic'};
function placesText(arr){ return arr.map((x,i)=> i ? PLACE_LABEL[x].toLowerCase() : PLACE_LABEL[x]).join(' i '); }

/* ---------- icones i targeta d'obra (marc corbat de color) ---------- */
const I = {
  back:'<svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  edit:'<svg class="ic" viewBox="0 0 24 24"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>',
  trash:'<svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  close:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
};
const ICO_CHEVRON = '';
function unlockBody(){ if(!document.querySelector('.page, .sheet-bg')) document.body.classList.remove('locked'); }
/* línia d'ubicació de la targeta: només quan alguna cosa és només en físic (si és al Box, primer es busca allà) */
function locLineHtml(p){
  if(!isFisic(p)) return '';
  const what = !isDigital(p) ? ['En físic']
    : [p.generalNomesFisic && facets(p).G!=='falta' && 'General només en físic', p.partsNomesFisic && facets(p).P!=='falta' && 'Parts només en físic'].filter(Boolean);
  if(!what.length) return '';
  const bits = [...what, (p.ubicacioFisica||[]).join(', ') || 'lloc sense indicar'];
  return `<div class="loc">${esc(bits.join(' · '))}</div>`;
}
/* text de l'estat: «Falten parts» (si falten totes) o «Falten parts · Clarinet, Trompeta» (si en falten de concretes) */
function stFull(st){
  const det = st.detail && st.detail!=='totes' ? ' · '+st.detail : '';
  return st.label + det + (st.extra ? ' · '+st.extra : '');
}
/* línies d'ubicació (fitxa) */
function placeLines(p){
  const d = isDigital(p), f = isFisic(p), out = [];
  if(d) out.push('Al Box');
  if(f) out.push('En físic · '+((p.ubicacioFisica||[]).join(', ') || 'lloc sense indicar'));
  if(d && f){ if(p.generalNomesFisic && facets(p).G!=='falta') out.push('General només en físic'); if(p.partsNomesFisic && facets(p).P!=='falta') out.push('Parts només en físic'); }
  return out.length ? out.map(x=>`<div>${esc(x)}</div>`).join('') : '<span class="sm">No consta enlloc</span>';
}
/* targeta d'obra (arxiu i feina pendent): el color de l'estat és el marc de l'esquerra */
function obraCardHtml(p, opts={}){
  const st = obraState(p);
  const authors = [p.composer, p.arranger?('Arr. '+p.arranger):''].filter(Boolean).join(' · ');
  const idAttr = opts.preview ? '' : `data-id="${esc(p.id)}" role="button" tabindex="0"`;
  return `<div class="fr ${st.cls}" ${idAttr}>
    <div class="tt">${esc(p.title)}</div>
    ${authors?`<div class="who">${esc(authors)}</div>`:''}
    <div class="st ${st.cls}">${esc(stFull(st))}${needsReview(p)?'<span class="flag">Cal revisar</span>':''}</div>
    ${locLineHtml(p)}
    ${opts.reasons ? `<ul class="reasons">${obraNotes(p).revisar.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>` : ''}
    ${opts.accept ? `<div class="accbtns"><button class="btn s" data-accept="${esc(p.id)}">Accepta</button><button class="btn s bd" data-reject="${esc(p.id)}">Elimina</button></div>` : ''}
  </div>`;
}
function bindCards(root, open){
  open = open || openObraSmart;
  root.querySelectorAll('.fr[data-id]').forEach(c=>{
    c.addEventListener('click', ()=> open(c.dataset.id));
    c.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(c.dataset.id); } });
  });
}
function refreshViews(){
  renderList();
  if(STATE.subview==='pendents') renderPendentsView();
  if(STATE.subview==='projectes') renderProjectesView();
  if(STATE.sheetRefresh) STATE.sheetRefresh();  // fitxa de projecte oberta
}


/* ---------- servidor (Supabase, projecte «arxiu») ----------
   Les dades només es poden llegir i desar amb una sessió oberta. El servidor comprova
   el rol: amb Consulta només es poden registrar obres noves. */
const ARXIU_URL = 'https://izysqmmqbvwkkqplkjgj.supabase.co';
const ARXIU_KEY = 'sb_publishable_Vz0K9slsiDPV7FK8eCCdhg_WG3fcnBM';
class ErrorServidor extends Error { constructor(codi){ super(codi); this.codi = codi; } }
async function servidor(ruta, body){
  let r;
  try{
    r = await fetch(ARXIU_URL + ruta, {method:'POST', headers:{'Content-Type':'application/json', apikey: ARXIU_KEY}, body: JSON.stringify(body)});
  }catch(e){ throw new ErrorServidor('XARXA'); }
  const txt = await r.text(); let data = null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok){
    const m = (data && (data.error || data.message)) || '';
    throw new ErrorServidor(/SESSIO_CADUCADA/.test(m) ? 'SESSIO' : /SENSE_PERMIS/.test(m) ? 'PERMIS' : /PROTECCIO/.test(m) ? 'PROTECCIO' : (data && data.error) || ('HTTP'+r.status));
  }
  return data;
}
const rpc = (fn, args)=> servidor('/rest/v1/rpc/'+fn, args);

/* ---------- desar i sincronitzar ----------
   SNAP és la darrera versió coneguda del servidor. Només s'envia el que ha canviat respecte a SNAP,
   juntament amb aquesta versió de base: el servidor combina els canvis camp per camp, de manera que
   si algú altre ha editat la mateixa obra (o la mateixa llista) mentrestant, no se li trepitgen els canvis.
   Les dades es tornen a demanar al servidor en tornar a l'app i cada minut, si no hi ha res obert ni pendent. */
/* SNAP.ready: només hi ha res a desar quan les dades ja s'han carregat del servidor
   (abans, les llistes buides d'una app que encara carrega semblarien canvis) */
const SNAP = {obres: new Map(), cat: new Map(), ready: false};
function snapshot(){
  SNAP.ready = true;
  SNAP.obres = new Map(STATE.pieces.map(o=> [o.id, JSON.stringify(o)]));
  SNAP.cat = new Map(Object.entries(STATE.catalogs).map(([k,v])=> [k, JSON.stringify(v)]));
}
function pendingChanges(){
  if(!SNAP.ready || !STATE.session) return null;
  const obres = [], bases = {}, esborra = [], catalegs = {}, catalegsBase = {};
  const cur = new Map(STATE.pieces.map(o=> [o.id, JSON.stringify(o)]));
  cur.forEach((j, id)=>{ const b = SNAP.obres.get(id); if(b!==j){ obres.push(JSON.parse(j)); bases[id] = b ? JSON.parse(b) : null; } });
  SNAP.obres.forEach((_, id)=>{ if(!cur.has(id)) esborra.push(id); });
  Object.entries(STATE.catalogs).forEach(([k,v])=>{ const b = SNAP.cat.get(k); if(b!==undefined && b!==JSON.stringify(v)){ catalegs[k] = JSON.parse(JSON.stringify(v)); catalegsBase[k] = b ? JSON.parse(b) : null; } });
  return (obres.length || esborra.length || Object.keys(catalegs).length) ? {obres, bases, esborra, catalegs, catalegsBase} : null;
}
const jstr = x => JSON.stringify(x);
/* versió local = versió del servidor + el que s'ha tocat aquí després d'enviar */
function rebaseObra(server, sent, local){
  const out = {...server};
  new Set([...Object.keys(sent), ...Object.keys(local)]).forEach(k=>{
    if(jstr(local[k])!==jstr(sent[k])){ if(k in local) out[k] = local[k]; else delete out[k]; }
  });
  return out;
}
function rebaseLlista(server, sent, local){
  const S = new Set(sent.map(jstr)), L = new Set(local.map(jstr));
  const out = server.filter(x=> !(S.has(jstr(x)) && !L.has(jstr(x))));
  const O = new Set(out.map(jstr));
  local.forEach(x=>{ if(!S.has(jstr(x)) && !O.has(jstr(x))) out.push(x); });
  return out;
}
function replaceInPlace(obj, data){ Object.keys(obj).forEach(k=> delete obj[k]); Object.assign(obj, data); }
function applySaveResult(canvis, r){
  r = r || {};
  let canviat = false;
  const sentObres = new Map(canvis.obres.map(o=> [o.id, o]));
  const locals = new Map(STATE.pieces.map(o=> [o.id, o]));
  (r.obres||[]).forEach(m=>{
    SNAP.obres.set(m.id, jstr(m));
    const loc = locals.get(m.id), sent = sentObres.get(m.id);
    if(loc && sent){
      const nou = rebaseObra(m, sent, loc);
      if(jstr(nou)!==jstr(loc)){ replaceInPlace(loc, nou); canviat = true; }
    }
  });
  canvis.esborra.forEach(id=> SNAP.obres.delete(id));
  const perdudes = (r.perdudes||[]).map(id=>{
    SNAP.obres.delete(id);
    const loc = locals.get(id);
    STATE.pieces = STATE.pieces.filter(x=> x.id!==id); canviat = true;
    return loc ? loc.title : id;
  });
  Object.entries(r.catalegs||{}).forEach(([k, m])=>{
    SNAP.cat.set(k, jstr(m));
    const local = STATE.catalogs[k] || [], sent = canvis.catalegs[k] || local;
    const nou = rebaseLlista(m, sent, local);
    if(jstr(nou)!==jstr(local)){
      const pool = new Map(local.map(x=> [jstr(x), x]));   // conserva els mateixos objectes (p. ex. un projecte obert)
      STATE.catalogs[k] = nou.map(x=> pool.get(jstr(x)) || x); canviat = true;
    }
  });
  if(canviat && !document.body.classList.contains('locked')){ refreshViews(); if(STATE.screen==='config') renderConfig(); }
  const avisos = [];
  if(perdudes.length) avisos.push(`Algú altre havia eliminat «${perdudes.join('», «')}»`);
  if((r.conflictes||[]).length) avisos.push(`Algú altre també havia editat «${r.conflictes.map(c=>c.title).join('», «')}». S'han combinat els canvis`);
  return avisos.join('. ');
}
let saveTimer=null, saving=false, retryDelay=0;
function persist(delay){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if(saving){ persist(); return; }
    const canvis = pendingChanges(); if(!canvis || !STATE.session) return;
    saving = true;
    try{
      const r = await rpc('desa_canvis', {p_token: STATE.session.token, p: canvis});
      const avis = applySaveResult(canvis, r);
      showSavePill(avis || 'Desat'); retryDelay = 0;
    }catch(e){
      if(e.codi==='SESSIO'){ sessionExpired(); }
      else if(e.codi==='PERMIS'){ showSavePill('No tens permís per fer aquest canvi'); await loadData(); }
      else if(e.codi==='PROTECCIO'){ showSavePill('El servidor ha bloquejat un canvi massa gran. Es tornen a carregar les dades.'); await loadData(); }
      else {
        retryDelay = Math.min(retryDelay ? retryDelay*2 : 3000, 30000);
        showSavePill('Sense connexió. Els canvis es desaran quan torni.');
        persist(retryDelay);
      }
    }finally{ saving = false; }
    if(!retryDelay && pendingChanges()) persist();   // canvis fets mentre es desava
  }, delay==null ? 300 : delay);
}
async function loadData(){
  const d = await rpc('carrega', {p_token: STATE.session.token});
  STATE.pieces = d.pieces || [];
  STATE.catalogs = Object.assign({estils:[], autors:[], arranjadors:[], parts:[], instrumentsExterns:[], projectes:[], ubicacions:[]}, d.catalogs || {});
  snapshot();
  refreshViews();
  if(STATE.screen==='config') renderConfig();
  return d.usuari;
}
/* torna a demanar les dades si no hi ha cap fitxa oberta ni canvis per desar */
let refreshing = false;
async function refreshFromServer(){
  const ocupat = ()=> !STATE.session || saving || refreshing || !!pendingChanges() || document.body.classList.contains('locked') || document.body.classList.contains('auth');
  if(ocupat()) return;
  refreshing = true;
  let d;
  try{ d = await rpc('carrega', {p_token: STATE.session.token}); }
  catch(e){ if(e.codi==='SESSIO') sessionExpired(); return; }
  finally{ refreshing = false; }
  if(ocupat()) return;
  const catalogs = Object.assign({estils:[], autors:[], arranjadors:[], parts:[], instrumentsExterns:[], projectes:[], ubicacions:[]}, d.catalogs || {});
  const pieces = d.pieces || [];
  const igualObres = pieces.length===SNAP.obres.size && pieces.every(o=> SNAP.obres.get(o.id)===jstr(o));
  const igualCat = Object.entries(catalogs).every(([k,v])=> SNAP.cat.get(k)===jstr(v));
  if(d.usuari && STATE.user && ROLE_OF[d.usuari.rol] && ROLE_OF[d.usuari.rol]!==STATE.role) setRole(ROLE_OF[d.usuari.rol]);
  if(igualObres && igualCat) return;
  STATE.pieces = pieces; STATE.catalogs = catalogs;
  snapshot();
  refreshViews();
  if(STATE.screen==='config' && !igualCat) renderConfig();
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible') refreshFromServer();
  else if(pendingChanges()) persist(0);   // en sortir de l'app, desa de seguida
});
setInterval(()=>{ if(document.visibilityState==='visible') refreshFromServer(); }, 60000);

/* Els usuaris i les contrasenyes són els de l'app d'assistència. La funció de servidor «entrar»
   els comprova allà i hi canvia la contrasenya el primer cop; el rol es recalcula a cada accés:
   músic o cap de secció → Consulta (consultar i registrar)
   director, junta o administració → Edició (editar, Per revisar i Configuració) */
const LS_SESSION = 'arxiu:sessio';
const ROLE_OF = {edicio:'gestio', consulta:'musica'};
function loadSession(){
  for(const st of [localStorage, sessionStorage]){
    try{ const x = JSON.parse(st.getItem(LS_SESSION)||'null'); if(x && x.token && new Date(x.caduca) > new Date()) return x; }catch(e){}
  }
  return null;
}
function saveSession(x, keep){
  try{ localStorage.removeItem(LS_SESSION); sessionStorage.removeItem(LS_SESSION); }catch(e){}
  if(x){ try{ (keep ? localStorage : sessionStorage).setItem(LS_SESSION, JSON.stringify(x)); }catch(e){} }
}

function openProjecteSheet(pid){
  const canEdit = STATE.role==='gestio';
  const el = document.createElement('div'); el.className='page';
  document.body.appendChild(el); document.body.classList.add('locked');
  let q = '', editing = false, toAdd = new Set(), toRm = new Set();
  const dirty = ()=> toAdd.size || toRm.size;
  function close(){
    if(editing && dirty() && !confirm('Hi ha canvis al repertori sense desar. Vols descartar-los?')) return;
    STATE.sheetRefresh = null; el.remove(); unlockBody(); refreshViews();
  }
  function save(){
    const pr = projById(pid);
    toAdd.forEach(id=>{ const p = STATE.pieces.find(x=>x.id===id); if(!p) return; p.aparicions = p.aparicions||[];
      if(!p.aparicions.some(a=>a.projecteId===pid)) p.aparicions.push({projecteId:pid, projecte:pr.name, any:pr.year||null, seccio:null, fitxers:0, estatParts:p.estatParts}); });
    toRm.forEach(id=>{ const p = STATE.pieces.find(x=>x.id===id); if(p) p.aparicions = (p.aparicions||[]).filter(a=>a.projecteId!==pid); });
    if(dirty()){ persist(); showSavePill('Repertori desat'); }
    toAdd = new Set(); toRm = new Set(); editing = false; q = ''; render();
  }
  function render(){
    const pr = projById(pid); if(!pr){ STATE.sheetRefresh = null; el.remove(); unlockBody(); return; }
    const sc = el.scrollTop;
    const obres = [...obresDe(pid).filter(p=> !toRm.has(p.id)), ...[...toAdd].map(id=> STATE.pieces.find(x=>x.id===id)).filter(Boolean)]
      .sort((a,b)=>a.title.localeCompare(b.title,'ca'));
    const nq = norm(q);
    const results = nq.length>=2 ? STATE.pieces.filter(p=> !obres.includes(p) && searchText(p).includes(nq)).sort((a,b)=>a.title.localeCompare(b.title,'ca')).slice(0,12) : [];
    el.innerHTML = `<div class="pbody light">
      ${editing ? '' : `<div class="ptop light"><button class="ib" id="pjClose" aria-label="Enrere">${I.back}</button></div>`}
      <div style="display:flex;align-items:center;gap:12px"><h1 class="h1" style="flex:1;min-width:0;overflow-wrap:anywhere">${esc(pr.name)}</h1>${editing?`<button class="ib" id="pjData" aria-label="Edita el nom, l'any o l'enllaç">${I.edit}</button>`:''}</div>
      <div class="sub">${pr.year||'Sense any'}${editing?' · Estàs editant el repertori':''}</div>
      ${!editing && pr.link?`<a class="btn s" style="margin-top:16px" href="${esc(pr.link)}" target="_blank" rel="noopener">Obre la carpeta a Box</a>`:''}
      ${editing?`<div class="search" style="margin-top:16px"><input id="pjAdd" type="text" placeholder="Afegeix una obra al repertori" autocomplete="off" value="${esc(q)}"></div>
        ${nq.length>=2?`<div class="pickl">${results.map(p=>`<button class="pickrow" data-add="${esc(p.id)}"><span class="main"><span class="title">${esc(p.title)}</span><span class="authors">${esc([p.composer,p.arranger?('Arr. '+p.arranger):''].filter(Boolean).join(' · '))}</span></span><span class="pickplus">+</span></button>`).join('') || '<p class="hint" style="margin:10px 14px">Cap obra coincideix, o ja és al repertori.</p>'}</div>`:''}`:''}
      <h3 class="sec">Repertori <span class="seccnt">${obres.length}</span></h3>
      ${obres.map(o=>{ const st=obraState(o); return `<div class="fr ${st.cls}" data-oid="${esc(o.id)}" role="button" tabindex="0"><div class="row prow"><div class="main">
          <div class="tt" style="font-size:17px;line-height:22px">${esc(o.title)}</div>
          <div class="who">${esc([o.composer,o.arranger?('Arr. '+o.arranger):''].filter(Boolean).join(' · '))}</div>
          <div class="st ${st.cls}">${esc(stFull(st))}</div></div>
          ${editing?`<button class="ib d" data-rm="${esc(o.id)}" aria-label="Treu del repertori">${I.trash}</button>`:''}</div></div>`; }).join('') || '<p class="hint" style="padding:8px 4px">Encara no hi ha cap obra al repertori d\'aquest projecte.</p>'}
    </div>
    ${canEdit ? `<div class="sticky-foot"><div class="foot-in">${editing
      ? `<button class="btn o back" id="pjCancel2">Cancel·la</button><button class="btn" id="pjSave">Desa</button>`
      : `<button class="btn" id="pjEdit">Edita</button>`}</div></div>` : ''}`;
    el.scrollTop = sc;
    const on = (sel, fn)=>{ const x = el.querySelector(sel); if(x) x.addEventListener('click', fn); };
    on('#pjClose', close);
    on('#pjEdit', ()=>{ editing = true; render(); });
    const cancel = ()=>{ toAdd = new Set(); toRm = new Set(); editing = false; q = ''; render(); };
    on('#pjCancel', cancel); on('#pjCancel2', cancel);
    on('#pjSave', save);
    on('#pjData', ()=> editProjecte(pid, render));
    const inp = el.querySelector('#pjAdd');
    if(inp){ inp.addEventListener('input', ()=>{ q = inp.value; const pos = inp.selectionStart; render(); const n = el.querySelector('#pjAdd'); n.focus(); n.setSelectionRange(pos,pos); }); }
    el.querySelectorAll('[data-add]').forEach(b=> b.addEventListener('click', ()=>{ const id = b.dataset.add; if(toRm.has(id)) toRm.delete(id); else toAdd.add(id); q=''; render(); }));
    el.querySelectorAll('[data-rm]').forEach(b=> b.addEventListener('click', e=>{ e.stopPropagation(); const id = b.dataset.rm; if(toAdd.has(id)) toAdd.delete(id); else toRm.add(id); render(); }));
    el.querySelectorAll('[data-oid]').forEach(r=> r.addEventListener('click', ()=> openObraSmart(r.dataset.oid)));
  }
  STATE.sheetRefresh = ()=>{ if(!editing) render(); };
  render();
}

function renderPendentsView(){

    if(!g.byPlace) return `<div class="list">${g.items.map(p=>obraCardHtml(p,{reasons:g.reasons, accept:g.accept&&canEdit})).join('')}</div>`;

      `<h3 class="sec">${esc(k)} <span class="seccnt">${buckets[k].length}</span></h3><div class="list">${buckets[k].map(p=>obraCardHtml(p)).join('')}</div>`).join('');
  }

        <span class="tasktxt"><span class="tasktitle">${esc(g.title)}</span><span class="taskdesc">${esc(g.desc)}</span></span>

      </button>
      ${STATE.openTask===g.key ? `<div class="taskbody">${bodyHtml(g)}</div>` : ''}
    </section>`).join('')
    : '<div class="empty"><p>No hi ha feina pendent.</p></div>';

  root.querySelectorAll('[data-task]').forEach(h=> h.addEventListener('click', ()=>{

  }));
  root.querySelectorAll('[data-accept]').forEach(b=> b.addEventListener('click', e=>{
    e.stopPropagation();
    const p = STATE.pieces.find(x=>x.id===b.dataset.accept);

  root.querySelectorAll('[data-reject]').forEach(b=> b.addEventListener('click', e=>{

}

function projectYears(){ return [...new Set(STATE.catalogs.projectes.map(p=>p.year).filter(Boolean))].sort((a,b)=>b-a); }
function projById(id){ return STATE.catalogs.projectes.find(p=>p.id===id); }
function projLabel(p){
  const n = p.aparicions ? p.aparicions.length : 0;
  if(n===0) return 'Sense projecte';
  if(n===1) return p.aparicions[0].projecte + (p.aparicions[0].any? ' · '+p.aparicions[0].any : '');
  return n+' projectes';
}

/* text on es busca: totes les metadades de l'obra. Cada paraula de la cerca ha d'aparèixer en algun camp. */
function searchText(p){
  const st = obraState(p), n = obraNotes(p);
  const fields = [
    p.title, p.titolBox, p.composer, p.arranger, p.de, p.estil, p.obs,
    ...(p.aparicions||[]).map(a=>{ const pr = projById(a.projecteId); return [pr?pr.name:a.projecte, pr?pr.year:a.any, a.seccio].join(' '); }),
    ...(p.specials||[]), ...(p.partsDetectades||[]), ...(p.faltenInventari||[]), ...(p.partsNoDetectades||[]),
    ...(p.ubicacioFisica||[]), isDigital(p)?'box digital':'', isFisic(p)?'fisic paper':'', (isFisic(p)&&!isDigital(p))?'nomes en fisic':'',
    st.label, st.extra, needsReview(p)?'cal revisar':'', p.original===true?'original comprada':'',
    ...n.revisar, ...n.partitura, ...(p.revisioNota||[]),
  ];
  return norm(fields.filter(Boolean).join(' · '));
}

/* ---------- cerca, filtres i llista ---------- */
function matches(p, f){
  f = f || STATE.filters;
  if(f.q){
    const hay = searchText(p);
    if(!norm(f.q).split(/\s+/).filter(Boolean).every(w=> hay.includes(w))) return false;
  }
  if(f.estil && p.estil!==f.estil) return false;
  if(f.estat && facets(p).P!==f.estat) return false;
  if(f.general && facets(p).G!==f.general) return false;
  if(f.ubicacio==='fisic' && !isFisic(p)) return false;
  if(f.ubicacio==='nomesfisic' && !(isFisic(p) && !isDigital(p))) return false;
  if(f.ubicacio==='digital' && !isDigital(p)) return false;
  if(f.lloc && !(p.ubicacioFisica||[]).includes(f.lloc)) return false;
  if(f.original && p.original!==(f.original==='si')) return false;
  if(f.instrExtern && !(p.specials||[]).includes(f.instrExtern)) return false;
  return true;
}
function filterWords(f){
  const w = [];
  if(f.estil) w.push(f.estil);
  if(f.general) w.push('General: '+FACETA.general[f.general].label.toLowerCase());
  if(f.estat) w.push('Parts: '+FACETA.parts[f.estat].label.toLowerCase());
  if(f.ubicacio) w.push(f.ubicacio==='digital' ? 'Al Box' : 'En físic');
  if(f.lloc) w.push(f.lloc);
  if(f.original) w.push(f.original==='si' ? 'Originals' : 'Còpies');
  if(f.instrExtern) w.push(f.instrExtern);
  return w;
}
function clearFilters(){
  STATE.filters = {q:STATE.filters.q, estil:null, projecte:null, any:null, estat:null, general:null, ubicacio:null, lloc:null, original:null, instrExtern:null};
}
function renderList(){
  const filtered = STATE.pieces.filter(p=>matches(p)).sort((a,b)=>a.title.localeCompare(b.title,'ca'));
  document.getElementById('resultCount').textContent = filtered.length===STATE.pieces.length ? `${filtered.length} obres` : `${filtered.length} de ${STATE.pieces.length} obres`;
  const words = filterWords(STATE.filters);

  if(words.length>0){ badge.textContent = words.length; badge.classList.remove('hidden'); } else badge.classList.add('hidden');

/* llista agrupada per inicial (les dues vistes). Compacta: una fila per obra; el color del marc és l'estat */
function groupedHtml(items, compact){
  let letter = null, out = '';
  items.forEach(p=>{
    const l = (norm(p.title).match(/[a-z0-9]/)||['#'])[0].toUpperCase();
    const L = /[0-9]/.test(l) ? '#' : l;
    if(L!==letter){ out += `<div class="letter" id="letter-${L}">${L}</div>`; letter = L; }
    if(!compact){ out += obraCardHtml(p); return; }
    const st = obraState(p);
    const who = p.composer || (p.arranger ? 'Arr. '+p.arranger : '');
    out += `<div class="fr cmp ${st.cls}" data-id="${esc(p.id)}" role="button" tabindex="0" title="${esc(stFull(st))}">
      <div style="min-width:0"><div class="tt">${esc(p.title)}</div>${who?`<div class="who" style="font-size:14px;line-height:18px">${esc(who)}</div>`:''}
      ${st.cls!=='ok'?`<div class="st ${st.cls}">${esc(stFull(st))}</div>`:''}</div>
      ${needsReview(p)?'<span class="flag">Cal revisar</span>':''}
    </div>`;
  });
  return out;
}

/* l'índex ocupa l'espai lliure entre la barra d'eines de la llista (o la capçalera, en fer scroll) i la barra inferior */
function layoutAzIndex(){
  const el = document.getElementById('azindex'); if(!el) return;
  const n = el.children.length;
  const top = Math.max(document.querySelector('.top').getBoundingClientRect().bottom, document.querySelector('#lhrow').getBoundingClientRect().bottom) + 8;
  const bottom = document.querySelector('.fbar').getBoundingClientRect().top - 8;
  const h = Math.max(8, Math.min(18, (bottom - top) / n));
  el.style.top = (top + (bottom - top) / 2) + 'px';
  [...el.children].forEach(b=>{ b.style.height = h+'px'; b.style.fontSize = Math.min(11, h - 1)+'px'; });
}

/* ================= COMBOBOX / MULTISELECT COMPONENTS ================= */
function positionPanel(panel, input){
  const r = input.getBoundingClientRect();
  const spaceBelow = window.innerHeight - r.bottom;
  const openUp = spaceBelow < 180 && r.top > spaceBelow;
  panel.style.position = 'fixed';
  panel.style.left = r.left+'px';
  panel.style.width = r.width+'px';
  if(openUp){
    panel.style.bottom = (window.innerHeight - r.top + 6)+'px';
    panel.style.top = 'auto';
  } else {
    panel.style.top = (r.bottom + 6)+'px';
    panel.style.bottom = 'auto';
  }
}
function attachPanelDismiss(closeFn){
  const onScroll = ()=>{ closeFn(); document.removeEventListener('scroll', onScroll, true); window.removeEventListener('resize', onScroll); };
  document.addEventListener('scroll', onScroll, true);
  window.addEventListener('resize', onScroll);
  return onScroll;
}
function makeCombobox(container, {items, value, onChange, placeholder, allowCreate=true}){
  container.classList.add('combo');
  container.innerHTML = `<input class="combo-input" type="text" placeholder="${esc(placeholder||'')}" autocomplete="off" value="${esc(value||'')}">
    <svg class="combo-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const input = container.querySelector('input');
  let panel = null, dismiss = null;
  function closePanel(){ if(panel){ panel.remove(); panel=null; } if(dismiss){ document.removeEventListener('scroll',dismiss,true); window.removeEventListener('resize',dismiss); dismiss=null; } }
  function openPanel(){
    closePanel();
    const q = norm(input.value);
    const filtered = items.filter(it=> norm(it).includes(q));
    panel = document.createElement('div'); panel.className='combo-panel';
    let html = '';
    filtered.slice(0,60).forEach(it=> html += `<div class="combo-opt" data-v="${esc(it)}">${esc(it)}</div>`);
    if(allowCreate && input.value.trim() && !items.some(it=> norm(it)===q)){
      html += `<div class="combo-opt create" data-create="1">+ Afegeix "${esc(input.value.trim())}"</div>`;
    }
    if(!html) html = `<div class="combo-empty">Sense resultats</div>`;
    panel.innerHTML = html;
    document.body.appendChild(panel);
    positionPanel(panel, input);
    dismiss = attachPanelDismiss(closePanel);
    panel.querySelectorAll('.combo-opt[data-v]').forEach(o=> o.addEventListener('mousedown', e=>{ e.preventDefault(); input.value=o.dataset.v; onChange(o.dataset.v); closePanel(); }));
    const c = panel.querySelector('.combo-opt[data-create]');
    if(c) c.addEventListener('mousedown', e=>{ e.preventDefault(); const v=input.value.trim(); if(!items.includes(v)) items.push(v); onChange(v); closePanel(); });
  }
  input.addEventListener('focus', openPanel);
  input.addEventListener('input', ()=>{ onChange(input.value.trim()); openPanel(); });
  input.addEventListener('blur', ()=> setTimeout(closePanel,150));
}

function makeMultiSelect(container, {items, values, onChange, placeholder, allowCreate=true}){
  container.classList.add('combo');
  let selected = values.slice();
  container.innerHTML = `<input class="combo-input" type="text" placeholder="${esc(placeholder||'')}" autocomplete="off">
    <svg class="combo-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="selectedchips"></div>`;
  const input = container.querySelector('input');
  const chipsBox = container.querySelector('.selectedchips');
  function renderChips(){
    chipsBox.innerHTML = selected.map(v=>`<span class="selchip">${esc(v)}<button data-rm="${esc(v)}">✕</button></span>`).join('');
    chipsBox.querySelectorAll('button[data-rm]').forEach(b=> b.addEventListener('click', ()=>{ selected = selected.filter(x=>x!==b.dataset.rm); renderChips(); onChange(selected); }));
  }
  renderChips();
  let panel=null, dismiss=null;
  function closePanel(){ if(panel){panel.remove(); panel=null;} if(dismiss){ document.removeEventListener('scroll',dismiss,true); window.removeEventListener('resize',dismiss); dismiss=null; } }
  function openPanel(){
    closePanel();
    const q = norm(input.value);
    const filtered = items.filter(it=> norm(it).includes(q) && !selected.includes(it));
    panel = document.createElement('div'); panel.className='combo-panel';
    let html = filtered.slice(0,60).map(it=>`<div class="combo-opt" data-v="${esc(it)}">${esc(it)}</div>`).join('');
    if(allowCreate && input.value.trim() && !items.some(it=>norm(it)===q)){
      html += `<div class="combo-opt create" data-create="1">+ Afegeix "${esc(input.value.trim())}"</div>`;
    }
    if(!html) html = `<div class="combo-empty">Sense resultats</div>`;
    panel.innerHTML = html;
    document.body.appendChild(panel);
    positionPanel(panel, input);
    dismiss = attachPanelDismiss(closePanel);
    panel.querySelectorAll('.combo-opt[data-v]').forEach(o=> o.addEventListener('mousedown', e=>{ e.preventDefault(); selected.push(o.dataset.v); input.value=''; renderChips(); onChange(selected); closePanel(); }));
    const c = panel.querySelector('.combo-opt[data-create]');
    if(c) c.addEventListener('mousedown', e=>{ e.preventDefault(); const v=input.value.trim(); if(!items.includes(v)) items.push(v); selected.push(v); input.value=''; renderChips(); onChange(selected); closePanel(); });
  }
  input.addEventListener('focus', openPanel);
  input.addEventListener('input', openPanel);
  input.addEventListener('blur', ()=> setTimeout(closePanel,150));
}

/* parts que falten: xips sobre la plantilla (Configuració › Parts) + camp lliure per a veus concretes */
function missingInit(piece){
  const src = (piece.faltenInventari&&piece.faltenInventari.length) ? piece.faltenInventari : (piece.partsNoDetectades||[]);
  const cat = STATE.catalogs.parts||[];
  return {
    totes: !!piece.totesFaltenParts || src.some(x=>(x||'').trim().toUpperCase()==='TOT'),
    sel: src.filter(x=>cat.includes(x)),
    altres: src.filter(x=>x && !cat.includes(x) && x.trim().toUpperCase()!=='TOT').join(', '),
    touched: false,
  };
}
function missingList(m){ return [...m.sel, ...m.altres.split(',').map(x=>x.trim()).filter(Boolean)]; }
/* camps de parts que resulten del formulari (null = no s'ha tocat, es conserva el que hi havia) */
function missingFields(draft){
  if(draft.estatParts!=='Falten parts') return {faltenInventari:[], partsNoDetectades:[], totesFaltenParts:false};
  if(!draft.missing.touched) return null;
  return {faltenInventari: draft.missing.totes ? ['TOT'] : missingList(draft.missing), partsNoDetectades:[], totesFaltenParts: draft.missing.totes};
}
function archInit(piece){
  const pl = placesOf(piece);
  return { gPlaces: pl.g.slice(), pPlaces: pl.p.slice(), llocs: (piece.ubicacioFisica||[]).slice() };
}
/* camps d'ubicació que resulten del formulari */
function archApply(d){
  // si falta la general o falten parts, no són enlloc: no compten per a la ubicació
  const g = d.general && d.general!=='no' ? d.gPlaces : [], pp = d.estatParts==='Falten parts' ? [] : d.pPlaces;
  const box = g.includes('box') || pp.includes('box'), fis = g.includes('fisic') || pp.includes('fisic');
  const cat = STATE.catalogs.ubicacions||[];
  const llocs = !fis ? [] : cat.length===1 ? [cat[0]] : (d.llocs.length ? d.llocs : cat.slice(0,1));
  return {
    escanejada: box, enPaper: fis, ubicacioFisica: llocs,
    generalNomesFisic: box && fis && g.length===1 && g[0]==='fisic',
    partsNomesFisic: box && fis && pp.length===1 && pp[0]==='fisic',
  };
}

const ORIGINAL = {si:'Sí, comprada', no:'No'};
function originalText(p){ return p.original===true ? 'Sí, comprada' : p.original===false ? 'No' : '—'; }

/* ================= FORMULARIS (registrar i edita comparteixen motor) ================= */
/* famílies de la plantilla per al desplegable «Quines falten?» (es dedueixen del nom de cada part de Configuració › Plantilla) */
function groupParts(cat){
  const R = [['Flautes',/flaut|piccolo/i],['Oboè i fagot',/obo[eè]|fagot/i],['Clarinets',/clarinet/i],['Saxos',/sax/i],
             ['Metall',/trompa|trompeta|tromb|bombard|tuba|fiscorn|eufoni/i],['Percussió',/percus|bateria|timbal|lamin|làmin|caixa|bombo|xil|marimb/i]];
  const out = R.map(([n])=>({name:n, items:[]})), altres = {name:'Altres', items:[]};
  cat.forEach(x=>{ const i = R.findIndex(([n,re])=> re.test(x)); (i<0 ? altres : out[i]).items.push(x); });
  return [...out, altres].filter(g=>g.items.length);
}
const sameSet = (a,b)=> a.length===b.length && a.every(x=>b.includes(x));
function newDraft(piece){
  const base = { nom:'', autor:'', arranjador:'', estil:'', estilNous:[], estilNew:'', original:null, projecteIds:[],
    general:null, estatParts:null, gPlaces:[], pPlaces:[], uPlaces:[], same:true, llocs:[],
    missing:{totes:false, sel:[], altres:'', touched:false}, instrExterns:[], extraNous:[], extraNew:'', comentaris:'',
    revisats:new Set(), openGrp:null, adding:null, err:{} };
  if(!piece) return base;
  const a = archInit(piece);
  const d = { ...base, nom:piece.title, autor:piece.composer||'', arranjador:piece.arranger||'', estil:piece.estil||'',
    projecteIds:(piece.aparicions||[]).map(x=>x.projecteId).filter(Boolean),
    general:piece.general||'desconegut', estatParts: piece.estatParts==='No és a Box' ? 'Per revisar' : (piece.estatParts||'Per revisar'),
    gPlaces:a.gPlaces, pPlaces:a.pPlaces, llocs:a.llocs, missing:missingInit(piece), instrExterns:(piece.specials||[]).slice(),
    comentaris:piece.obs||'', original: typeof piece.original==='boolean' ? piece.original : null };
  const ag = d.general!=='no', ap = d.estatParts!=='Falten parts';
  d.same = !(ag && ap) || sameSet(d.gPlaces, d.pPlaces);
  d.uPlaces = (ag ? d.gPlaces : d.pPlaces).slice();
  return d;
}
const applG = d=> !!d.general && d.general!=='no';
const applP = d=> !!d.estatParts && d.estatParts!=='Falten parts';
/* en mode «mateix lloc» la ubicació única s'aplica a la general i a les parts */
function plc(d){ if(d.same){ d.gPlaces = d.uPlaces.slice(); d.pPlaces = d.uPlaces.slice(); } return d; }
function afterAnswer(d){
  if(!d.same && !(applG(d) && applP(d))){ d.uPlaces = (applG(d) ? d.gPlaces : d.pPlaces).slice(); d.same = true; }
}
function placeOfDraft(d){ return archApply(plc(d)); }

function secUbic(d, first){
  const ag = applG(d), ap = applP(d), cat = STATE.catalogs.ubicacions||[];
  const tog = (w, arr)=> `<div class="three">${Object.entries(PLACE_LABEL).map(([k,l])=>`<button type="button" class="${arr.includes(k)?'on':''}" data-a="place" data-w="${w}" data-v="${k}">${l}</button>`).join('')}</div>`;

  else body = `<div class="field${E(d,'g')}"><div class="fl" style="margin-top:0">Partitura general (director)</div>${tog('g', d.gPlaces)}<div class="errtext">Indica on es troba la general.</div></div>

function secComentaris(d){ return `<section class="sec">${band('Comentaris','opcional')}<textarea class="textarea" data-in="coment" placeholder="Notes, enllaços, detalls a tenir en compte…">${esc(d.comentaris)}</textarea></section>`; }
